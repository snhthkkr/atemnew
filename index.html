<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="atem">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>atem</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* ── ink scale (warm-shifted, paint-derived for v26) ─────────────── */
  --void:#0a0908;
  --panel:#141210;
  --hairline:rgba(232,222,201,0.07);
  --hairline-strong:rgba(232,222,201,0.16);
  --ink:#e8dec9;                      /* bone — primary text */
  --ink-soft:rgba(232,222,201,0.62);
  --ink-faint:rgba(232,222,201,0.34);
  --ink-ghost:rgba(232,222,201,0.18);
  --ink-trace:rgba(232,222,201,0.08);
  /* ── accent (ember — warm, attention) ─────────────────────────────── */
  --accent:#c8632d;
  --accent-soft:rgba(200,99,45,0.18);
  /* ── danger ───────────────────────────────────────────────────────── */
  --danger:rgba(196,90,82,0.90);
  /* ── type ─────────────────────────────────────────────────────────── */
  --sans:'Inter','-apple-system','BlinkMacSystemFont','Segoe UI',sans-serif;
  /* ── motion ───────────────────────────────────────────────────────── */
  --t:220ms;
  --e:cubic-bezier(0.32,0.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{
  width:100%;height:100%;overflow:hidden;background:var(--void);
  font-family:var(--sans);color:var(--ink);
  font-feature-settings:'cv11','ss01','ss03';
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ─── Editor — one field, blur saves ──────────────────────────────── */
#editor{
  position:fixed;display:none;z-index:100;
  left:50%;top:50%;transform:translate(-50%,-50%) scale(0.985);
  width:min(380px,86vw);
  max-height:calc(100vh - 80px);
  max-height:calc(100dvh - 80px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--panel);
  border:1px solid var(--hairline);
  border-radius:6px;padding:18px 18px 12px;
  box-shadow:0 24px 60px -24px rgba(0,0,0,0.65);
  opacity:0;
  transition:opacity var(--t) var(--e), transform var(--t) var(--e);
}
#editor.open{display:block;opacity:1;transform:translate(-50%,-50%) scale(1)}
#editor textarea{
  -webkit-user-select:text;user-select:text;
  width:100%;min-height:96px;max-height:240px;
  background:transparent;border:none;outline:none;
  color:var(--ink);font-size:15px;line-height:1.55;
  font-family:var(--sans);font-weight:400;resize:none;
  letter-spacing:-0.005em;
}
#editor textarea::placeholder{color:var(--ink-ghost);font-style:normal}
#ed-color-btn{
  width:8px;height:8px;border-radius:50%;
  border:none;
  cursor:pointer;position:absolute;top:24px;right:18px;
  transition:transform var(--t) var(--e);z-index:5;
  box-shadow:0 0 0 1px var(--hairline-strong);
}
#ed-color-btn:hover{transform:scale(1.4)}
#ed-color-btn:active{transform:scale(0.9)}
#ed-color-palette{
  position:absolute;top:38px;right:18px;
  background:var(--panel);border:1px solid var(--hairline);
  border-radius:5px;padding:8px;display:none;gap:6px;
  z-index:10;
  box-shadow:0 10px 30px -10px rgba(0,0,0,0.7);
}
#ed-color-palette.open{display:flex;flex-wrap:wrap;width:148px}
.ed-color-swatch{
  width:18px;height:18px;border-radius:50%;cursor:pointer;
  border:none;transition:transform var(--t) var(--e);
  box-shadow:0 0 0 1px var(--hairline);
}
.ed-color-swatch:hover{transform:scale(1.15)}
#editor-actions{
  display:flex;justify-content:flex-end;gap:0;
  margin-top:10px;padding-top:8px;
  border-top:1px solid var(--hairline);
}
#editor-actions button{
  background:transparent;border:none;
  color:var(--ink-faint);font-size:12px;
  padding:6px 10px;border-radius:3px;cursor:pointer;
  font-family:var(--sans);font-weight:400;
  letter-spacing:0;
  transition:color var(--t) var(--e);
}
#editor-actions button:hover{color:var(--ink)}
#editor-actions .save{color:var(--accent)}
#editor-actions .save:hover{color:var(--accent)}
#del-btn{color:var(--danger)!important;margin-right:auto}
#del-btn:hover{opacity:0.8}

/* ─── Connection editor ──────────────────────────────────────────── */
#conn-editor{
  position:fixed;display:none;z-index:120;
  left:50%;top:50%;transform:translate(-50%,-50%) scale(0.985);
  width:min(360px,86vw);
  background:var(--panel);
  border:1px solid var(--hairline);
  border-radius:6px;padding:16px 18px 12px;
  box-shadow:0 24px 60px -24px rgba(0,0,0,0.65);
  opacity:0;
  transition:opacity var(--t) var(--e), transform var(--t) var(--e);
}
#conn-editor.open{display:block;opacity:1;transform:translate(-50%,-50%) scale(1)}
#conn-editor-title{font-family:var(--sans);font-size:11px;color:var(--ink-faint);margin-bottom:10px;letter-spacing:0;font-weight:500}
#conn-preset-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.conn-preset{
  padding:4px 9px;border-radius:3px;font-size:12px;
  border:1px solid var(--hairline);cursor:pointer;
  background:transparent;color:var(--ink-soft);
  transition:color var(--t) var(--e), border-color var(--t) var(--e);
  white-space:nowrap;
  font-family:var(--sans);font-weight:400;letter-spacing:0;
}
.conn-preset:hover{color:var(--ink);border-color:var(--hairline-strong)}
.conn-preset.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
#conn-custom-input{
  width:100%;background:transparent;border:none;
  border-bottom:1px solid var(--hairline);
  color:var(--ink);font-size:14px;padding:6px 0;outline:none;
  font-family:var(--sans);font-weight:400;margin-bottom:12px;
  -webkit-user-select:text;user-select:text;
}
#conn-custom-input::placeholder{color:var(--ink-ghost)}
#conn-color-row{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
#conn-color-row .conn-cswatch{
  width:14px;height:14px;border-radius:50%;cursor:pointer;
  border:none;
  transition:transform var(--t) var(--e);
  box-shadow:0 0 0 1px var(--hairline);
}
#conn-color-row .conn-cswatch:hover{transform:scale(1.2)}
#conn-color-row .conn-cswatch.active{box-shadow:0 0 0 1px var(--ink),0 0 0 3px var(--panel)}
#conn-editor-actions{display:flex;justify-content:flex-end;gap:0;padding-top:8px;border-top:1px solid var(--hairline)}
#conn-editor-actions button{
  background:transparent;border:none;
  color:var(--ink-faint);font-size:12px;
  padding:6px 10px;border-radius:3px;cursor:pointer;
  font-family:var(--sans);letter-spacing:0;
  transition:color var(--t) var(--e);
}
#conn-editor-actions button:hover{color:var(--ink)}
#conn-editor-actions .conn-del-btn{color:var(--danger)!important;margin-right:auto}
#conn-editor-actions .conn-del-btn:hover{opacity:0.8}
#conn-editor-actions .conn-done-btn{color:var(--accent)}

/* ─── Menu trigger — minimal dot, no brand wordmark ─────────────── */
#menu-btn{
  position:fixed;
  bottom:max(20px,env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  width:36px;height:36px;border-radius:50%;
  background:transparent;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:90;
  font-size:0;color:transparent;
  transition:transform var(--t) var(--e);
}
#menu-btn::before{
  content:'';
  width:6px;height:6px;border-radius:50%;
  background:var(--ink-faint);
  transition:background var(--t) var(--e), transform var(--t) var(--e);
}
#menu-btn:hover::before{background:var(--ink-soft);transform:scale(1.4)}
#menu-btn:active::before{background:var(--ink)}

/* ─── Menu drawer ──────────────────────────────────────────────── */
#menu-scrim{position:fixed;inset:0;z-index:9989;display:none;background:rgba(0,0,0,0.45);opacity:0;transition:opacity var(--t) var(--e)}
#menu-scrim.open{display:block;opacity:1}
#menu-drawer{
  position:fixed;top:0;left:0;bottom:0;
  width:min(280px,82vw);
  background:var(--panel);
  border-right:1px solid var(--hairline);
  z-index:9990;
  transform:translateX(-100%);
  transition:transform var(--t) var(--e);
  display:flex;flex-direction:column;
  padding:max(20px,env(safe-area-inset-top,0px)) 0 max(16px,env(safe-area-inset-bottom,0px));
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
#menu-drawer.open{transform:translateX(0)}
#menu-drawer .menu-header{
  padding:4px 18px 16px;margin-bottom:6px;
  border-bottom:1px solid var(--hairline);
}
#menu-drawer .menu-header .mh-name{
  font-family:var(--sans);font-weight:500;
  font-size:15px;color:var(--ink);
  letter-spacing:-0.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#menu-drawer .menu-header .mh-count{
  font-size:11px;color:var(--ink-faint);
  margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:0;
  font-weight:400;
}
#menu-drawer .menu-header .mh-label{display:none}
#menu-drawer .sep{
  height:1px;background:var(--hairline);
  margin:6px 18px;
}
#menu-drawer button{
  display:flex;align-items:center;
  width:100%;text-align:left;background:none;border:none;
  color:var(--ink-soft);font-size:13px;
  padding:9px 18px;cursor:pointer;
  font-family:var(--sans);font-weight:400;
  letter-spacing:-0.005em;
  transition:color var(--t) var(--e), background var(--t) var(--e);
}
#menu-drawer button:hover{color:var(--ink);background:var(--ink-trace)}
#menu-drawer .danger{color:var(--danger)}
#menu-drawer .danger:hover{color:var(--danger);opacity:0.85}
/* iOS-style pill toggle */
#menu-drawer .pill{
  width:28px;height:16px;border-radius:999px;
  background:var(--hairline-strong);
  margin-left:auto;flex-shrink:0;
  position:relative;transition:background var(--t) var(--e);
}
#menu-drawer .pill::after{
  content:'';position:absolute;top:2px;left:2px;
  width:12px;height:12px;border-radius:50%;
  background:var(--ink-soft);
  transition:transform var(--t) var(--e), background var(--t) var(--e);
}
#menu-drawer .pill.on{background:var(--accent)}
#menu-drawer .pill.on::after{transform:translateX(12px);background:var(--ink)}

/* ─── Lasso ────────────────────────────────────────────────────── */
#lasso-rect{position:fixed;display:none;z-index:70;border:1px solid var(--ink-faint);background:rgba(232,230,225,0.04);pointer-events:none;border-radius:2px}
#lasso-bar{
  position:fixed;display:none;z-index:110;
  bottom:max(72px,calc(env(safe-area-inset-bottom,0px)+64px));
  left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--hairline);
  border-radius:5px;padding:4px;gap:0;
  box-shadow:0 10px 30px -10px rgba(0,0,0,0.7);
}
#lasso-bar.open{display:flex}
#lasso-bar button{
  background:transparent;border:none;color:var(--ink-soft);
  font-size:13px;padding:6px 12px;border-radius:3px;cursor:pointer;
  font-family:var(--sans);font-weight:400;letter-spacing:-0.005em;white-space:nowrap;
  transition:color var(--t) var(--e);
}
#lasso-bar button:hover{color:var(--ink)}

/* ─── Starter Gallery ──────────────────────────────────────────── */
#gallery-overlay{
  position:fixed;inset:0;z-index:9995;display:none;
  background:rgba(10,9,8,0.97);
  flex-direction:column;
  padding:max(28px,env(safe-area-inset-top,0px)) 0 max(20px,env(safe-area-inset-bottom,0px));
  opacity:0;transition:opacity var(--t) var(--e);
}
#gallery-overlay.open{display:flex;opacity:1}
#gallery-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px 24px;flex-shrink:0;
}
#gallery-title{font-family:var(--sans);font-size:14px;color:var(--ink);font-weight:500;letter-spacing:-0.01em}
#gallery-close{
  background:transparent;border:none;
  color:var(--ink-faint);font-size:13px;cursor:pointer;
  padding:6px 10px;border-radius:3px;font-family:var(--sans);
  transition:color var(--t) var(--e);
}
#gallery-close:hover{color:var(--ink)}
#gallery-grid{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 28px 28px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));
  gap:12px;
  align-content:start;
}
.gcard{
  background:transparent;
  border:1px solid var(--hairline);
  border-radius:6px;padding:18px 20px 16px;
  cursor:pointer;
  transition:border-color var(--t) var(--e), background var(--t) var(--e);
  position:relative;overflow:hidden;
}
.gcard:hover{border-color:var(--hairline-strong);background:var(--ink-trace)}
.gcard-name{
  font-family:var(--sans);font-weight:500;
  font-size:15px;color:var(--ink);
  margin-bottom:6px;line-height:1.3;
  letter-spacing:-0.01em;
}
.gcard-desc{font-family:var(--sans);font-size:13px;color:var(--ink-faint);line-height:1.5;letter-spacing:-0.005em}
.gcard-meta{
  display:flex;gap:8px;margin-top:14px;align-items:center;
}
.gcard-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);opacity:0.7;flex-shrink:0;
}
.gcard-nodes{font-family:var(--sans);font-size:11px;color:var(--ink-ghost);letter-spacing:0;font-weight:400}

/* ─── Board Slots ──────────────────────────────────────────────── */
#boards-overlay{
  position:fixed;inset:0;z-index:9993;display:none;
  background:rgba(10,9,8,0.97);
  flex-direction:column;
  padding:max(28px,env(safe-area-inset-top,0px)) 0 max(20px,env(safe-area-inset-bottom,0px));
  opacity:0;transition:opacity var(--t) var(--e);
}
#boards-overlay.open{display:flex;opacity:1}
#boards-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px 24px;flex-shrink:0;
}
#boards-heading{font-family:var(--sans);font-size:14px;color:var(--ink);font-weight:500;letter-spacing:-0.01em}
#boards-close{
  background:transparent;border:none;
  color:var(--ink-faint);font-size:13px;cursor:pointer;
  padding:6px 10px;border-radius:3px;font-family:var(--sans);
  transition:color var(--t) var(--e);
}
#boards-close:hover{color:var(--ink)}
#boards-grid{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 28px 28px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(220px,46vw),1fr));
  gap:12px;align-content:start;
}
.bcard{
  background:transparent;
  border:1px solid var(--hairline);
  border-radius:6px;overflow:hidden;cursor:pointer;
  transition:border-color var(--t) var(--e);
}
.bcard.active{border-color:var(--accent)}
.bcard:hover{border-color:var(--hairline-strong)}
.bcard.active:hover{border-color:var(--accent)}
.bcard-thumb{
  width:100%;aspect-ratio:16/10;
  background:var(--void);
  position:relative;overflow:hidden;
  border-bottom:1px solid var(--hairline);
}
.bcard-thumb canvas{width:100%!important;height:100%!important;object-fit:cover}
.bcard-thumb-empty{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-ghost);font-family:var(--sans);font-size:12px;letter-spacing:0;
}
.bcard-info{padding:10px 12px 12px}
.bcard-name{
  font-family:var(--sans);font-weight:500;
  font-size:13px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:2px;letter-spacing:-0.005em;
}
.bcard.active .bcard-name{color:var(--accent)}
.bcard-count{font-family:var(--sans);font-size:11px;color:var(--ink-ghost);font-weight:400}
.bcard-rename{
  display:block;width:100%;text-align:left;
  background:none;border:none;border-top:1px solid var(--hairline);
  color:var(--ink-ghost);font-size:11px;
  cursor:pointer;padding:7px 12px;font-family:var(--sans);letter-spacing:0;
  transition:color var(--t) var(--e);
}
.bcard-rename:hover{color:var(--ink-soft)}

/* ─── Rich Editor (single field, first line is title) ────────────── */
#ed-body{
  -webkit-user-select:text;user-select:text;
  width:100%;min-height:96px;max-height:240px;
  background:transparent;border:none;outline:none;
  color:var(--ink);font-size:15px;line-height:1.55;
  font-family:var(--sans);font-weight:400;resize:none;
  padding-top:0;letter-spacing:-0.005em;
}
#ed-body::placeholder{color:var(--ink-ghost)}
/* Title row hidden — we infer title from first line of body */
#ed-title-row{display:none}
#ed-title{display:none}
#fps{
  position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:14px;
  font-family:'SF Mono','Menlo',monospace;font-size:10px;color:var(--ink-ghost);
  letter-spacing:0;
  font-variant-numeric:tabular-nums;pointer-events:none;display:none;z-index:85;
}
#fps.on{display:block}

/* ─── Hint ──────────────────────────────────────────────────────── */
#hint{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  color:var(--ink-ghost);font-size:13px;
  font-family:var(--sans);font-weight:400;
  pointer-events:none;transition:opacity 0.6s ease;
  letter-spacing:-0.005em;
}

/* ─── Toast ─────────────────────────────────────────────────────── */
#toast{
  position:fixed;top:max(20px,env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%) translateY(-12px);
  background:transparent;border:none;
  padding:0;color:var(--ink-soft);
  font-family:var(--sans);font-size:13px;letter-spacing:-0.005em;font-weight:400;
  opacity:0;transition:opacity var(--t) var(--e), transform var(--t) var(--e);
  z-index:200;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── Meanings panel (v26) ────────────────────────────────────────
   The user's grammar for this board. Lists each active slot (color,
   shape, size) and the values currently used. Inline text field
   beside each value lets the user write what it means TO THEM.
   ────────────────────────────────────────────────────────────────── */
#meanings-panel{
  position:fixed;display:none;z-index:115;
  right:max(20px,env(safe-area-inset-right,0px));
  top:50%;transform:translateY(-50%) translateX(8px);
  width:min(300px,86vw);
  max-height:calc(100vh - 60px);max-height:calc(100dvh - 60px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--panel);
  border:1px solid var(--hairline);
  border-radius:6px;padding:14px 16px 12px;
  box-shadow:0 24px 60px -24px rgba(0,0,0,0.65);
  opacity:0;
  transition:opacity var(--t) var(--e), transform var(--t) var(--e);
}
#meanings-panel.open{display:block;opacity:1;transform:translateY(-50%) translateX(0)}
#meanings-header{
  display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:10px;margin-bottom:8px;
  border-bottom:1px solid var(--hairline);
}
#meanings-title{
  font-family:var(--sans);font-size:11px;color:var(--ink-faint);
  font-weight:500;letter-spacing:0;
}
#meanings-close{
  background:transparent;border:none;
  color:var(--ink-faint);font-size:13px;cursor:pointer;
  padding:0;font-family:var(--sans);
  transition:color var(--t) var(--e);
}
#meanings-close:hover{color:var(--ink)}
#meanings-tabs{display:flex;gap:0;margin-bottom:10px;border-bottom:1px solid var(--hairline);padding-bottom:8px}
.meanings-tab{
  background:transparent;border:none;
  color:var(--ink-faint);font-size:12px;
  padding:4px 10px 4px 0;cursor:pointer;
  font-family:var(--sans);font-weight:400;
  transition:color var(--t) var(--e);
}
.meanings-tab:hover{color:var(--ink-soft)}
.meanings-tab.active{color:var(--accent)}
#meanings-body{padding-top:2px}
.meaning-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--hairline);
}
.meaning-row:last-child{border-bottom:none}
.meaning-glyph{
  flex-shrink:0;width:18px;height:18px;
  display:flex;align-items:center;justify-content:center;
}
.meaning-glyph.color-glyph{border-radius:50%;box-shadow:0 0 0 1px var(--hairline)}
.meaning-glyph.shape-glyph{

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","idb-keyval":"https://cdn.jsdelivr.net/npm/idb-keyval@6/+esm"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { get, set, del } from 'idb-keyval';

// ═══════════════════════════════════════════
// STATE
// Three primitives only: thoughts, connections, space (= camera).
// ═══════════════════════════════════════════

let state = {
  version: 26,
  thoughts: [],
  connections: [],
  camera: null,
  openToCapture: false,
  richMode: true,
  boardId: 'board-1',
  boardName: 'Board 1',
  isStarterBoard: false,
  // ── v26: schema system ─────────────────────────────────────────────
  // The user's emerging grammar for this board. Each slot is a property
  // of a thought (color, shape, size). The user assigns meanings to the
  // *values* that slot can take. atem ships defaults; the user fills in
  // what they mean to THEM — that's the customization.
  //
  // schema = which slots are active in this board's grammar
  // meanings = { slotName: { value: 'user-defined meaning' } }
  // ────────────────────────────────────────────────────────────────────
  schema: ['color', 'shape', 'size'],
  meanings: {
    color: {},   // { '#c8632d': 'urgent', '#6e5e9c': 'unfinished', ... }
    shape: {},   // { 'sphere': 'idea', 'card': 'fact', ... }
    size: {},    // { '1.4': 'major', '0.8': 'aside' }
  },
};

let editingId = null, editingColor = null;
let editingConnId = null;
let connectSource = null, holdTimer = null, collapseHoldTimer = null;
let blockNextPointerUp = false;
let editorClosedAt = 0;
let multiTouchActive = false;
let isDragging = false, draggedMesh = null;
let dragOffset = new THREE.Vector3();
let pointerStart = { x:0, y:0 }, pointerMoved = false, holdTriggered = false;
let pendingLineMesh = null, hintVisible = true;
let showFps = false;
let lassoActive = false, lassoStart = null, lassoEnd = null;
let lassoHoldTimer = null, lassoHoldTriggered = false;
let selectedIds = new Set();

const HOLD_MS = 350, DRAG_THRESH = 8, SPHERE_RADIUS = 0.35;
const raycaster = new THREE.Raycaster();
raycaster.params.Line = { threshold: 0.4 };
const pointer = new THREE.Vector2();
const plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
const intersectPt = new THREE.Vector3();

// ── Tonal palette (v26) ───────────────────────────────────────────────
// Returning to the v23 paint palette — you said v25 was too dull. The
// hand-mixed colors carry mood, not just hex. Each is named so the user
// can later assign meaning to "ember" (their own meaning, not ours).
// ──────────────────────────────────────────────────────────────────────
const TONES = {
  bone:      '#e8dec9', // chalk, central, default
  ember:     '#c8632d', // generative spark
  oxblood:   '#7a2e2e', // contradiction, weight
  duckegg:   '#6f9090', // resonance, association
  tobacco:   '#a87d3f', // footnote, aside
  iris:      '#6e5e9c', // depth, the unsaid
  verdigris: '#4a8a73', // confirmation
  rose:      '#b8645c', // soft emotion
  ink:       '#e8dec9', // alias for bone — used as the "default" when no color set
};
const COLORS = [TONES.bone, TONES.ember, TONES.oxblood, TONES.duckegg, TONES.tobacco, TONES.iris, TONES.verdigris, TONES.rose];

// Migrate any legacy hex from older versions into the palette
const COLOR_MAP = {
  // v22 Tailwind defaults
  '#6ea8fe': TONES.duckegg,
  '#a78bfa': TONES.iris,
  '#f472b6': TONES.rose,
  '#34d399': TONES.verdigris,
  '#fbbf24': TONES.tobacco,
  '#fb923c': TONES.ember,
  '#f87171': TONES.oxblood,
  '#67e8f9': TONES.bone,
  '#7ed4a4': TONES.verdigris,
  '#f5c97a': TONES.tobacco,
  '#b8a9f5': TONES.iris,
  '#7ab8f5': TONES.duckegg,
  // v24 muted neutrals
  '#e8e6e1': TONES.bone,
  '#d8cfba': TONES.bone,
  '#d8a35a': TONES.tobacco,
  '#c47a4d': TONES.ember,
  '#8a9c80': TONES.verdigris,
  '#7e8590': TONES.duckegg,
};
function migrateColor(c) {
  if (!c) return TONES.bone;
  const lower = String(c).toLowerCase();
  return COLOR_MAP[lower] || c;
}

// Connection presets — labels only. Connections share one muted color
// (rebuildConnections handles color logic). Labels are claims the user
// chooses. Labels themselves are part of the user's emerging grammar.
const CONN_PRESETS = [
  { label:'Causes' },
  { label:'Contradicts' },
  { label:'Supports' },
  { label:'Depends on' },
  { label:'Relates to' },
  { label:'Reminds me of' },
  { label:'Same as' },
  { label:'Part of' },
  { label:'Leads to' },
  { label:'Follows from' },
];
const CONN_COLORS = COLORS.slice();

// ═══════════════════════════════════════════
// SCENE
// ═══════════════════════════════════════════

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0908); // warm void

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0908, 0.020);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = true; controls.panSpeed = 0.8;
controls.rotateSpeed = 0.5; controls.zoomSpeed = 0.8;
controls.minDistance = 0.5; controls.maxDistance = 200;
controls.addEventListener('change', () => { needsRender = true; });

// Warm, soft lighting — no character on the spheres themselves,
// the character is in the spatial arrangement.
scene.add(new THREE.AmbientLight(0x3a3530, 0.62));
const dl = new THREE.DirectionalLight(0xfff4e0, 0.65); dl.position.set(5,8,10); scene.add(dl);
const bl = new THREE.DirectionalLight(0x504a55, 0.22); bl.position.set(-5,-3,-8); scene.add(bl);

const thoughtGroup = new THREE.Group(); scene.add(thoughtGroup);
const lineGroup = new THREE.Group(); scene.add(lineGroup);
const gridGroup = new THREE.Group(); scene.add(gridGroup);
let zGridVisible = false;

// O(1) lookup
const thoughtMap = new Map();
const meshMap = new Map();
function rebuildMaps() {
  thoughtMap.clear(); meshMap.clear();
  for (const t of state.thoughts) thoughtMap.set(t.id, t);
  for (const m of thoughtGroup.children) meshMap.set(m.userData.id, m);
}

// ═══════════════════════════════════════════
// THOUGHT MESH
// ═══════════════════════════════════════════

const sphereGeo = new THREE.SphereGeometry(SPHERE_RADIUS, 24, 18);

// ═══════════════════════════════════════════════════════════════════
// SHAPE LIBRARY (v25 branch — experimental)
// ═══════════════════════════════════════════════════════════════════
// Atem turns thought into matter. Different thoughts have different
// physical kinds. Shape is not decoration — shape is the epistemic
// register of the thought. A list-thought is literally stacked. A
// felt-thought is literally soft-edged. A framed-thought has sharp
// rectangular containment. The shape carries meaning the way a
// paragraph break carries meaning in prose.
//
// Each shape entry returns { geometry, materialOverrides, scaleOverride }
// so the rest of the rendering pipeline doesn't need to know about
// shape variants. addThoughtMesh() reads t.shape and dispatches.
// Default 'sphere' preserves all existing behavior.
// ═══════════════════════════════════════════════════════════════════
const SHAPES = {
  // The default. A thought as a discrete idea, equally exposed in all directions.
  sphere: () => ({
    geometry: sphereGeo,
  }),

  // Soft, irregular, low-resolution sphere — feels organic, slightly wobbly.
  // For thoughts that aren't yet sharp. Feelings, intuitions, half-ideas.
  pebble: () => {
    const g = new THREE.SphereGeometry(SPHERE_RADIUS * 1.05, 12, 8);
    const pos = g.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const r = Math.sqrt(x*x+y*y+z*z);
      const wobble = 1 + (Math.sin(x*7)*Math.cos(y*5)*Math.sin(z*6)) * 0.18;
      pos.setXYZ(i, x*wobble/r * SPHERE_RADIUS*1.05, y*wobble/r * SPHERE_RADIUS*1.05, z*wobble/r * SPHERE_RADIUS*1.05);
    }
    g.computeVertexNormals();
    return { geometry: g, materialOverrides: { roughness: 0.85, metalness: 0.0 } };
  },

  // A flat tile. Card. For framed thoughts — claims, definitions, structured items.
  // Faces the user (camera-facing handled in addThoughtMesh).
  card: () => {
    const g = new THREE.BoxGeometry(SPHERE_RADIUS*2.6, SPHERE_RADIUS*1.6, SPHERE_RADIUS*0.18);
    return { geometry: g, materialOverrides: { roughness: 0.55, metalness: 0.04 } };
  },

  // Tall narrow rectangle — a list item, a step in a sequence, a verse.
  // Stacks visually well when arranged vertically.
  bar: () => {
    const g = new THREE.BoxGeometry(SPHERE_RADIUS*3.2, SPHERE_RADIUS*0.5, SPHERE_RADIUS*0.18);
    return { geometry: g, materialOverrides: { roughness: 0.55, metalness: 0.04 } };
  },

  // Cube — a unit, a brick, an object of fixed size. For inventory-type thoughts.
  cube: () => {
    const g = new THREE.BoxGeometry(SPHERE_RADIUS*1.4, SPHERE_RADIUS*1.4, SPHERE_RADIUS*1.4);
    return { geometry: g, materialOverrides: { roughness: 0.45, metalness: 0.08 } };
  },

  // Long vertical pillar — a chapter, a phase, a sustained note.
  // Reads as duration when placed along Z.
  column: () => {
    const g = new THREE.CylinderGeometry(SPHERE_RADIUS*0.55, SPHERE_RADIUS*0.55, SPHERE_RADIUS*4.0, 16);
    return { geometry: g, materialOverrides: { roughness: 0.55, metalness: 0.05 } };
  },

  // Disc — a moment, a decision point, a hinge.
  // Wide and flat, the opposite of column.
  disc: () => {
    const g = new THREE.CylinderGeometry(SPHERE_RADIUS*1.3, SPHERE_RADIUS*1.3, SPHERE_RADIUS*0.3, 32);
    return { geometry: g, materialOverrides: { roughness: 0.5, metalness: 0.05 } };
  },

  // A small dot — for thoughts that are points in a constellation,
  // where the meaning is in the arrangement, not the individual item.
  dot: () => {
    const g = new THREE.SphereGeometry(SPHERE_RADIUS * 0.35, 12, 8);
    return {
      geometry: g,
      materialOverrides: { roughness: 0.2, metalness: 0.0, emissiveIntensity: 0.6 },
    };
  },

  // A faceted gem — for thoughts that have multiple angles, ambiguity, depth.
  // Reflects light differently as you orbit.
  gem: () => {
    const g = new THREE.OctahedronGeometry(SPHERE_RADIUS*1.1, 0);
    return { geometry: g, materialOverrides: { roughness: 0.25, metalness: 0.4 } };
  },

  // Torus — for recursive thoughts, loops, things that come back around.
  ring: () => {
    const g = new THREE.TorusGeometry(SPHERE_RADIUS*0.9, SPHERE_RADIUS*0.22, 12, 32);
    return { geometry: g, materialOverrides: { roughness: 0.45, metalness: 0.1 } };
  },

  // Cone — for thoughts that taper, narrow toward a point, conclusions.
  cone: () => {
    const g = new THREE.ConeGeometry(SPHERE_RADIUS*0.9, SPHERE_RADIUS*2.0, 16);
    return { geometry: g, materialOverrides: { roughness: 0.55, metalness: 0.05 } };
  },
};

function getShapeData(shapeName) {
  const fn = SHAPES[shapeName] || SHAPES.sphere;
  return fn();
}

function makeThoughtMaterial(color) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color || TONES.ink),
    emissive: new THREE.Color(color || TONES.ink),
    emissiveIntensity:0.10, roughness:0.62, metalness:0.0,
    transparent:true, opacity:0.94,
  });
}

// Label — Inter only. Title (medium 14px) + optional subtitle (regular 12px).
// One typeface, two weights. Ink-on-void. No decoration.
function createLabel(text, bodyText) {
  const title = (text || '').trim();
  const body = (bodyText || '').trim();

  let primary = '';
  let subtitle = '';

  if (title) {
    primary = title;
    if (body) {
      const firstLine = body.split('\n')[0].trim();
      subtitle = firstLine.length > 56 ? firstLine.slice(0, 54) + '…' : firstLine;
    }
  } else if (body) {
    // No title — promote first line to title, second line (if any) to subtitle
    const lines = body.split('\n');
    primary = lines[0];
    if (lines[1]) {
      const second = lines[1].trim();
      subtitle = second.length > 56 ? second.slice(0, 54) + '…' : second;
    }
  } else {
    return null;
  }

  const W = 512, SCALE = 2;
  const titleFontSize = 28;
  const subFontSize = 14;
  const lineH = 34;
  const subLineH = 19;
  const gap = 8;

  const TITLE_FONT = '500 ' + titleFontSize + 'px "Inter", -apple-system, BlinkMacSystemFont, sans-serif';
  const SUB_FONT   = '400 ' + subFontSize + 'px "Inter", -apple-system, BlinkMacSystemFont, sans-serif';

  const c = document.createElement('canvas');
  c.width = W * SCALE;
  const ctx = c.getContext('2d');
  ctx.scale(SCALE, SCALE);

  ctx.font = TITLE_FONT;
  let titleLines = [], tLine = '';
  const titleDisplay = primary.length > 60 ? primary.slice(0, 58) + '…' : primary;
  for (const w of titleDisplay.split(' ')) {
    const test = tLine ? tLine + ' ' + w : w;
    if (ctx.measureText(test).width > W - 20) { titleLines.push(tLine); tLine = w; }
    else tLine = test;
  }
  if (tLine) titleLines.push(tLine);
  if (titleLines.length > 2) titleLines = titleLines.slice(0, 2);

  let subLines = [];
  if (subtitle) {
    ctx.font = SUB_FONT;
    let sLine = '';
    for (const w of subtitle.split(' ')) {
      const test = sLine ? sLine + ' ' + w : w;
      if (ctx.measureText(test).width > W - 20) { subLines.push(sLine); sLine = w; }
      else sLine = test;
    }
    if (sLine) subLines.push(sLine);
    if (subLines.length > 1) subLines = subLines.slice(0, 1);
  }

  const titleH = titleLines.length * lineH;
  const subH = subLines.length > 0 ? gap + subLines.length * subLineH : 0;
  const totalH = titleH + subH + 16;

  c.height = totalH * SCALE;
  ctx.scale(SCALE, SCALE);
  ctx.clearRect(0, 0, W, totalH);

  // Title — primary ink
  ctx.fillStyle = 'rgba(232,230,225,0.94)';
  ctx.font = TITLE_FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const titleY = 8;
  titleLines.forEach((l, i) => ctx.fillText(l, W / 2, titleY + i * lineH));

  // Subtitle — faded ink, same typeface, lighter weight
  if (subLines.length > 0) {
    ctx.fillStyle = 'rgba(232,230,225,0.42)';
    ctx.font = SUB_FONT;
    const subY = titleY + titleH + gap;
    subLines.forEach((l, i) => ctx.fillText(l, W / 2, subY + i * subLineH));
  }

  const tex = new THREE.CanvasTexture(c); tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.88, depthTest: false });
  const sprite = new THREE.Sprite(mat);

  const worldW = 3.2;
  const worldH = worldW * (c.height / c.width);
  sprite.scale.set(worldW, worldH, 1);
  sprite.position.y = -SPHERE_RADIUS - 0.32 - worldH / 2;
  return sprite;
}

function addThoughtMesh(t) {
  if (t.color) t.color = migrateColor(t.color);
  const shapeName = t.shape || 'sphere';
  const shapeData = getShapeData(shapeName);
  const mat = makeThoughtMaterial(t.color);
  // Apply per-shape material overrides (roughness, metalness, etc.)
  if (shapeData.materialOverrides) {
    for (const k in shapeData.materialOverrides) {
      mat[k] = shapeData.materialOverrides[k];
    }
  }
  const mesh = new THREE.Mesh(shapeData.geometry, mat);
  mesh.position.set(t.position[0], t.position[1], t.position[2]);
  const size = t.size || 1.0;
  const _initOp = t.collapsedUnder ? 0 : 0.94;
  // Card and bar shapes billboard to camera so they read as flat surfaces.
  // Other shapes have intrinsic 3D character and rotate freely with the world.
  const billboards = (shapeName === 'card' || shapeName === 'bar');
  // Apply per-thought rotation if specified (e.g. for fixed-orientation columns)
  if (t.rotation) {
    mesh.rotation.set(t.rotation[0]||0, t.rotation[1]||0, t.rotation[2]||0);
  }
  mesh.userData = {
    id:t.id,
    shape: shapeName,
    billboards,
    targetEmissive:0.10,
    targetOpacity:_initOp,
    targetLabelOpacity:_initOp > 0.5 ? 0.88 : 0,
    breath:Math.random()*Math.PI*2,
    baseSize:size,
    bounceStart:performance.now(),
    collapsedCount:0,
    initialRotation: t.rotation ? [t.rotation[0]||0, t.rotation[1]||0, t.rotation[2]||0] : null,
  };
  mesh.scale.setScalar(size);

  const l = createLabel(t.text || '', t.body || '');
  if (l) {
    l.name = 'label';
    // Cards/bars: label centered ON the surface, not floating below.
    if (shapeName === 'card') {
      l.position.set(0, 0, SPHERE_RADIUS*0.12);
      l.position.y = 0;
    } else if (shapeName === 'bar') {
      l.position.set(0, 0, SPHERE_RADIUS*0.12);
      l.position.y = 0;
    } else if (shapeName === 'dot') {
      // Dots have labels well below; constellation feel
      l.position.y = -SPHERE_RADIUS - 0.5;
    }
    mesh.add(l);
  }
  thoughtGroup.add(mesh);
  meshMap.set(t.id, mesh);
  return mesh;
}

function updateLabel(mesh, text, body) {
  const old = mesh.getObjectByName('label');
  if (old) mesh.remove(old);
  const l = createLabel(text || '', body || '');
  if (l) { l.name = 'label'; mesh.add(l); }
}

function getMesh(id) { return meshMap.get(id); }

function createConnLabel(text, color) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.scale(2, 2);
  ctx.clearRect(0, 0, 256, 64);
  ctx.fillStyle = color || 'rgba(232,230,225,0.50)';
  ctx.font = '400 12px "Inter", -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let display = text || '';
  if (display.length > 28) display = display.slice(0, 26) + '…';
  ctx.fillText(display, 128, 32);
  const tex = new THREE.CanvasTexture(c); tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, opacity:0.6, depthTest:false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2.0, 0.5, 1);
  return sprite;
}

// Single muted ink color for ALL connections — they're scaffolding, not subject.
const CONN_INK = new THREE.Color('#e8e6e1');

function rebuildConnections() {
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  const pairs = {};
  for (const c of state.connections) { const key = [c.from, c.to].sort().join('|'); pairs[key] = (pairs[key]||0) + 1; }
  const drawn = new Set();
  for (const c of state.connections) {
    const key = [c.from, c.to].sort().join('|');
    if (drawn.has(key)) continue; drawn.add(key);
    const mA = getMesh(c.from), mB = getMesh(c.to);
    if (!mA || !mB) continue;
    const tA = thoughtMap.get(c.from), tB = thoughtMap.get(c.to);
    if ((tA && tA.collapsedUnder) || (tB && tB.collapsedUnder)) continue;
    const density = pairs[key]||1;
    if (c.color) c.color = migrateColor(c.color);

    // All connections share one muted color. Density modulates opacity.
    // Optional per-conn color override exists but is rarely used.
    const lineColor = c.color ? new THREE.Color(c.color) : CONN_INK;
    const baseOpacity = Math.min(0.22 + density*0.06, 0.42);

    const geo = new THREE.BufferGeometry().setFromPoints([mA.position.clone(), mB.position.clone()]);
    const mat = new THREE.LineBasicMaterial({ color: lineColor, transparent:true, opacity:baseOpacity });
    const line = new THREE.Line(geo, mat);
    const firstConn = state.connections.find(x => [x.from, x.to].sort().join('|') === key);
    line.userData = { from:c.from, to:c.to, density, connKey:key, connId:firstConn?.id, baseOpacity };
    lineGroup.add(line);

    // Directional arrow — small fork at target, same muted color
    if (c.directed) {
      const dir = new THREE.Vector3().subVectors(mB.position, mA.position);
      const len = dir.length();
      if (len > 0.1) {
        const norm = dir.clone().normalize();
        const armLen = Math.min(Math.max(len * 0.10, 0.22), 0.45);
        const spread = armLen * 0.5;

        const arrowTip = mB.position.clone().sub(norm.clone().multiplyScalar(SPHERE_RADIUS + 0.08));
        const arrowBase = arrowTip.clone().sub(norm.clone().multiplyScalar(armLen));

        const camDir = camera.getWorldDirection(new THREE.Vector3());
        let perp = new THREE.Vector3().crossVectors(camDir, norm).normalize();
        if (perp.length() < 0.1) perp = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), norm).normalize();
        if (perp.length() < 0.1) perp = new THREE.Vector3().crossVectors(new THREE.Vector3(1, 0, 0), norm).normalize();

        const forkL = arrowBase.clone().add(perp.clone().multiplyScalar(spread));
        const forkR = arrowBase.clone().sub(perp.clone().multiplyScalar(spread));

        const arrowOpacity = Math.min(baseOpacity + 0.3, 0.7);

        for (const forkPt of [forkL, forkR]) {
          const ageo = new THREE.BufferGeometry().setFromPoints([arrowTip.clone(), forkPt]);
          const amat = new THREE.LineBasicMaterial({ color: lineColor, transparent: true, opacity: arrowOpacity });
          const fork = new THREE.Line(ageo, amat);
          fork.userData = { isArrow: true, from: c.from, to: c.to, connKey: key, isLeft: forkPt === forkL };
          lineGroup.add(fork);
        }
      }
    }

    const label = c.label || (density > 1 ? `×${density}` : null);
    if (label) {
      const mid = new THREE.Vector3().addVectors(mA.position, mB.position).multiplyScalar(0.5);
      const sprite = createConnLabel(label);
      sprite.position.copy(mid);
      sprite.position.y += 0.28;
      sprite.userData = { isConnLabel: true, connKey: key, from: c.from, to: c.to };
      lineGroup.add(sprite);
    }
  }
  needsRender = true;
}

// Scratch vectors reused every frame to avoid GC churn in the hot path
const _camDir = new THREE.Vector3();
const _dir = new THREE.Vector3();
const _norm = new THREE.Vector3();
const _perp = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);
const _right = new THREE.Vector3(1, 0, 0);
const _arrowTip = new THREE.Vector3();
const _arrowBase = new THREE.Vector3();
const _forkPt = new THREE.Vector3();
const _scratch = new THREE.Vector3();

function updateConnectionPositions() {
  // Hoist camDir: computed once per frame instead of per-arrow.
  // On boards with many directed connections this saves ~N allocations/frame.
  let camDirComputed = false;
  for (const child of lineGroup.children) {
    if (child.userData.isConnLabel) {
      const parts = child.userData.connKey.split('|');
      const mA = getMesh(parts[0]), mB = getMesh(parts[1]);
      if (mA && mB) {
        child.position.set(
          (mA.position.x + mB.position.x) / 2,
          (mA.position.y + mB.position.y) / 2 + 0.25,
          (mA.position.z + mB.position.z) / 2
        );
      }
      continue;
    }
    if (child.userData.isArrow) {
      const mA = getMesh(child.userData.from), mB = getMesh(child.userData.to);
      if (mA && mB) {
        _dir.subVectors(mB.position, mA.position);
        const len = _dir.length();
        if (len > 0.1) {
          _norm.copy(_dir).normalize();
          // Bug 3: arm length scales with connection length
          const armLen = Math.min(Math.max(len * 0.12, 0.25), 0.6);
          const spread = armLen * 0.55;
          _arrowTip.copy(mB.position).sub(_scratch.copy(_norm).multiplyScalar(SPHERE_RADIUS + 0.08));
          _arrowBase.copy(_arrowTip).sub(_scratch.copy(_norm).multiplyScalar(armLen));
          // Bug 3: camera-right basis — computed once per frame, not per arrow
          if (!camDirComputed) { camera.getWorldDirection(_camDir); camDirComputed = true; }
          _perp.crossVectors(_camDir, _norm).normalize();
          if (_perp.length() < 0.1) _perp.crossVectors(_up, _norm).normalize();
          if (_perp.length() < 0.1) _perp.crossVectors(_right, _norm).normalize();
          if (child.userData.isLeft) {
            _forkPt.copy(_arrowBase).add(_scratch.copy(_perp).multiplyScalar(spread));
          } else {
            _forkPt.copy(_arrowBase).sub(_scratch.copy(_perp).multiplyScalar(spread));
          }
          const pos = child.geometry.attributes.position;
          pos.setXYZ(0, _arrowTip.x, _arrowTip.y, _arrowTip.z);
          pos.setXYZ(1, _forkPt.x, _forkPt.y, _forkPt.z);
          pos.needsUpdate = true;
        }
      }
      continue;
    }
    if (!child.userData.from) continue;
    const mA = getMesh(child.userData.from), mB = getMesh(child.userData.to);
    if (!mA || !mB) continue;
    const pos = child.geometry.attributes.position;
    pos.setXYZ(0, mA.position.x, mA.position.y, mA.position.z);
    pos.setXYZ(1, mB.position.x, mB.position.y, mB.position.z);
    pos.needsUpdate = true;
  }
}

async function save() {
  state.camera = {
    px:camera.position.x,py:camera.position.y,pz:camera.position.z,
    tx:controls.target.x,ty:controls.target.y,tz:controls.target.z
  };
  const key = 'atem-' + state.boardId;
  try { await set(key, state); } catch(e) { console.warn('idb save failed', e); }
  try { localStorage.setItem(key+'-backup', JSON.stringify(state)); } catch(e){}

  // Registry
  const registry = await getBoardRegistry();
  const idx = registry.findIndex(b => b.id === state.boardId);
  const entry = { id: state.boardId, name: state.boardName, count: state.thoughts.length, updated: Date.now() };
  if (idx >= 0) registry[idx] = entry; else registry.push(entry);
  try { await set('atem-boards', registry); } catch(e) {}

  // Supabase sync (debounced, non-blocking)
  scheduleSupabaseSync(state.boardId, state);
}

async function getBoardRegistry() {
  try {
    const r = await get('atem-boards');
    if (r && Array.isArray(r)) return r;
  } catch(e) {}
  // Bootstrap 5 slots
  return [
    { id:'board-1', name:'Board 1', count:0, updated:0 },
    { id:'board-2', name:'Board 2', count:0, updated:0 },
    { id:'board-3', name:'Board 3', count:0, updated:0 },
    { id:'board-4', name:'Board 4', count:0, updated:0 },

}

async function loadBoard(boardId) {
  // Close any open editors first — editingId would point to a thought that's about to be cleared.
  if (editingId) closeEditor(true);
  if (editingConnId) closeConnEditor();
  // Save current board first
  if (state.thoughts.length > 0 || state.connections.length > 0) await save();

  // Clear scene
  while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  thoughtMap.clear(); meshMap.clear();

  // Reset state (preserve settings)
  const richMode = state.richMode;
  const openToCapture = state.openToCapture;
  state.thoughts = [];
  state.connections = [];
  state.boardId = boardId;
  state.richMode = richMode;
  state.openToCapture = openToCapture;

  const key = 'atem-' + boardId;
  let s = null;

  // Remote first
  s = await loadFromSupabase(boardId);
  if (!s) { try { s = await get(key); } catch(e) {} }
  if (!s) {
    try {
      const raw = localStorage.getItem(key+'-backup');
      if (raw) s = JSON.parse(raw);
    } catch(e) {}
  }

  if (s) {
    state.thoughts = s.thoughts || [];
    state.connections = s.connections || [];
    state.boardName = s.boardName || boardId;
    state.boardDefaultShape = s.boardDefaultShape || 'sphere';
    state.boardDefaultColor = s.boardDefaultColor || null;
    state.schema = (s.schema && s.schema.length) ? s.schema : ['color', 'shape', 'size'];
    state.meanings = s.meanings || { color:{}, shape:{}, size:{} };
    if (!state.meanings.color) state.meanings.color = {};
    if (!state.meanings.shape) state.meanings.shape = {};
    if (!state.meanings.size) state.meanings.size = {};
    if (s.camera) {
      camera.position.set(s.camera.px,s.camera.py,s.camera.pz);
      controls.target.set(s.camera.tx,s.camera.ty,s.camera.tz);
    }
    const validIds = new Set(state.thoughts.map(t=>t.id));
    state.connections = state.connections.filter(c=>validIds.has(c.from)&&validIds.has(c.to));
    for (const t of state.thoughts) { if(!t.size)t.size=1.0; if(!t.props)t.props={}; if(t.body===undefined||t.body===null)t.body=''; }
    for (const t of state.thoughts) addThoughtMesh(t);
    rebuildMaps(); rebuildConnections();
    if (state.thoughts.length > 0) hideHint();
  }

  // Update board registry name
  const registry = await getBoardRegistry();
  const slot = registry.find(b => b.id === boardId);
  if (slot) { state.boardName = slot.name; }

  updateRichModeUI();
  needsRender = true;
  toast(state.boardName);
}

  state.boardId = boardId;

  s = await loadFromSupabase(boardId);

  // Fall back to IndexedDB

  // Fall back to legacy keys

      if (raw) { s = JSON.parse(raw); if (s) await set('atem-' + boardId, s); }
    } catch(e) {}
  }
  if (!s) return;

  try {
    state.version = s.version || state.version;
    state.thoughts = s.thoughts || [];
    state.connections = s.connections || [];
    state.openToCapture = s.openToCapture || false;
    state.richMode = s.richMode || false;
    state.boardName = s.boardName || 'Board 1';
    state.boardDefaultShape = s.boardDefaultShape || 'sphere';
    state.boardDefaultColor = s.boardDefaultColor || null;
    state.schema = (s.schema && s.schema.length) ? s.schema : ['color', 'shape', 'size'];
    state.meanings = s.meanings || { color:{}, shape:{}, size:{} };
    if (!state.meanings.color) state.meanings.color = {};
    if (!state.meanings.shape) state.meanings.shape = {};
    if (!state.meanings.size) state.meanings.size = {};

    if (s.camera) {
      camera.position.set(s.camera.px,s.camera.py,s.camera.pz);
      controls.target.set(s.camera.tx,s.camera.ty,s.camera.tz);
    }
    const validIds = new Set(state.thoughts.map(t=>t.id));
    state.connections = state.connections.filter(c=>validIds.has(c.from)&&validIds.has(c.to));
    for (const t of state.thoughts) { if(!t.size)t.size=1.0; if(!t.props)t.props={}; if(!t.body)t.body=''; }
    for (const c of state.connections) { if(!c.color)c.color='#6ea8fe'; if(c.directed===undefined)c.directed=false; if(c._reversed===undefined)c._reversed=false; }
    for (const t of state.thoughts) { if(!t.collapsedUnder) t.collapsedUnder = null; }
    for (const t of state.thoughts) addThoughtMesh(t);
    rebuildMaps(); rebuildConnections();
    updateCaptureToggle(); updateRichModeUI();
    if (state.thoughts.length > 0) hideHint();
  } catch(e) { console.warn('hydrate failed', e); }
}

function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function collapseThought(id) {
  // BFS — collect entire reachable subgraph, skip the root itself
  const visited = new Set([id]);
  const queue = [id];
  while (queue.length) {
    const cur = queue.shift();
    for (const c of state.connections) {
      const neighbor = c.from === cur ? c.to : c.to === cur ? c.from : null;
      if (neighbor && !visited.has(neighbor)) {
        visited.add(neighbor);
        queue.push(neighbor);
      }
    }
  }
  visited.delete(id); // don't collapse the root
  for (const nid of visited) {
    const t = thoughtMap.get(nid);
    if (!t) continue;
    t.collapsedUnder = id;
    const mesh = getMesh(nid);
    if (mesh) { mesh.userData.targetOpacity = 0; mesh.userData.targetLabelOpacity = 0; }
  }
  updateCollapseBadge(id);
  rebuildConnections();
  needsRender = true;
  return visited.size;
}

function expandThought(id) {
  for (const t of state.thoughts) {
    if (t.collapsedUnder === id) {
      t.collapsedUnder = null;
      const mesh = getMesh(t.id);
      if (mesh) { mesh.userData.targetOpacity = 0.9; mesh.userData.targetLabelOpacity = 0.88; }
    }
  }
  updateCollapseBadge(id);
  rebuildConnections();
  needsRender = true;
}

function updateCollapseBadge(id) {
  const count = state.thoughts.filter(t => t.collapsedUnder === id).length;
  const mesh = getMesh(id);
  if (!mesh) return;
  // store count in userData for the animate loop to render
  mesh.userData.collapsedCount = count;
}

function isCollapsed(id) {
  return state.thoughts.some(t => t.collapsedUnder === id);
}

function createThought(x, y, z, text, color, body) {
  // Inherit the board's shape vocabulary if this is a shape-themed board.
  // Set on board load via loadBoard / state.boardDefaultShape.
  const inheritedShape = state.boardDefaultShape || 'sphere';
  const inheritedColor = color || state.boardDefaultColor || TONES.ink;
  const t = {
    id:uid(), text:text||'',
    body: body||'',
    position:[x,y,z],
    color: inheritedColor,
    shape: inheritedShape,
    created:Date.now(), touched:Date.now(),
    size: 1.0,
    props: {}
  };
  state.thoughts.push(t);
  thoughtMap.set(t.id, t);
  state.isStarterBoard = false;
  addThoughtMesh(t); save(); hideHint(); hideIdleChip();
  // Confident pop-in: 0.88 → 1.0 over 220ms, ease-out cubic. No overshoot.
  const mesh = getMesh(t.id);
  if (mesh) {
    mesh.userData.bounceStart = performance.now();
    mesh.userData.bounceDuration = 220;
    mesh.userData.bounceFromZero = true;
    mesh.userData.baseSize = t.size;
  }
  const menu = document.getElementById('menu-drawer');
  if (menu && menu.classList.contains('open')) updateMenuHeader();
  if (zGridVisible) buildZGrid();
  // Refresh meanings panel if open — new thought may add a new value-row
  const panel = document.getElementById('meanings-panel');
  if (panel && panel.classList.contains('open')) renderMeaningsPanel();
  // Lenient nudge — after 3 thoughts with 2+ distinct colors
  maybeNudgeMeanings();
  needsRender = true;
  return t;
}

function updateThought(id, text, color, size, body) {
  const t = thoughtMap.get(id);
  if (!t) return;
  t.text = text; t.touched = Date.now();
  if (body !== undefined) t.body = body;
  if (color !== undefined) t.color = migrateColor(color);
  if (size !== undefined) t.size = size;
  const mesh = getMesh(id);
  if (mesh) {
    updateLabel(mesh, t.text, t.body);
    if (color) {
      const mc = migrateColor(color);
      mesh.material.color.set(mc); mesh.material.emissive.set(mc);
    }
    if (size !== undefined) { mesh.scale.setScalar(size); mesh.userData.baseSize = size; }
  }
  save();
  // Refresh meanings panel if open — color/size change may surface new values
  const panel = document.getElementById('meanings-panel');
  if (panel && panel.classList.contains('open')) renderMeaningsPanel();
  needsRender = true;
}

function deleteThought(id) {
  state.thoughts = state.thoughts.filter(t=>t.id!==id);
  state.connections = state.connections.filter(c=>c.from!==id&&c.to!==id);
  const mesh = getMesh(id);
  if (mesh) thoughtGroup.remove(mesh);
  thoughtMap.delete(id);
  meshMap.delete(id);
  rebuildConnections(); save(); needsRender = true;
  const menu = document.getElementById('menu-drawer');
  if (menu && menu.classList.contains('open')) updateMenuHeader();
}

function moveThought(id, x, y, z) {
  const t = thoughtMap.get(id);
  if (t) { t.position=[x,y,z]; t.touched=Date.now(); 
  if (zGridVisible) buildZGrid();
}
}

function addConnection(fromId, toId, label, color, directed) {
  if (fromId === toId) return;
  const conn = { id:uid(), from:fromId, to:toId, created:Date.now(), label: label||null, color: null, directed: directed||false };
  state.connections.push(conn);
  rebuildConnections(); save();
  // Quiet inhale on target — scale 1.0 → 1.04 → 1.0 over 220ms.
  // Confident motion is small motion.
  const targetMesh = getMesh(toId);
  if (targetMesh) {
    targetMesh.userData.targetEmissive = 0.32;
    targetMesh.userData.inhaleStart = performance.now();
    setTimeout(() => {
      if (targetMesh.userData) targetMesh.userData.targetEmissive = 0.10;
      needsRender = true;
    }, 280);
  }
  needsRender = true;
  if (label === null) return;
  if (!label) openConnEditor(conn.id);
  else toast('Connected');
}

function deleteConnection(connKey) {
  state.connections = state.connections.filter(c => [c.from,c.to].sort().join('|') !== connKey);
  rebuildConnections(); save(); toast('Disconnected');
  needsRender = true;
}

// ═══════════════════════════════════════════
// CONNECTION EDITOR
// ═══════════════════════════════════════════

const connEditorEl = document.getElementById('conn-editor');
const connCustomInput = document.getElementById('conn-custom-input');

function openConnEditor(connId) {
  const conn = state.connections.find(c => c.id === connId);
  if (!conn) return;
  editingConnId = connId;
  controls.enabled = false;

  const presetRow = document.getElementById('conn-preset-row');
  presetRow.innerHTML = CONN_PRESETS.map(p =>
    `<button class="conn-preset${conn.label===p.label?' active':''}" data-label="${p.label}" data-color="${p.color}">${p.label}</button>`
  ).join('');
  presetRow.querySelectorAll('.conn-preset').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      presetRow.querySelectorAll('.conn-preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      connCustomInput.value = '';
      conn.label = btn.dataset.label;
      conn.color = btn.dataset.color;
      document.querySelectorAll('#conn-color-row .conn-cswatch').forEach(s => {
        s.classList.toggle('active', s.dataset.color === conn.color);
      });
      rebuildConnections(); save();
    });
  });

  connCustomInput.value = (conn.label && !CONN_PRESETS.find(p=>p.label===conn.label)) ? conn.label : '';
  connCustomInput.oninput = () => {
    const v = connCustomInput.value.trim();
    if (v) {
      presetRow.querySelectorAll('.conn-preset').forEach(b => b.classList.remove('active'));
      conn.label = v;
      rebuildConnections(); save();
    }
  };

  const colorRow = document.getElementById('conn-color-row');
  colorRow.innerHTML = CONN_COLORS.map(c =>
    `<div class="conn-cswatch${conn.color===c?' active':''}" data-color="${c}" style="background:${c}"></div>`
  ).join('');
  colorRow.querySelectorAll('.conn-cswatch').forEach(swatch => {
    swatch.addEventListener('click', (e) => {
      e.stopPropagation();
      colorRow.querySelectorAll('.conn-cswatch').forEach(s => s.classList.remove('active'));
      swatch.classList.add('active');
      conn.color = swatch.dataset.color;
      rebuildConnections(); save();
    });
  });

  connEditorEl.classList.add('open');

  // Directed toggle — 3 states: undirected → A→B → B→A → undirected
  const dirBtn = document.getElementById('conn-dir-btn');
  // direction state: 0=undirected, 1=forward (from→to), 2=reverse (to→from)
  const getDirState = () => {
    if (!conn.directed) return 0;
    return conn._reversed ? 2 : 1;
  };
  const updateDirBtn = () => {
    const s = getDirState();
    const labels = ['↔ undirected', '→ A to B', '← B to A'];
    const colors = ['rgba(255,255,255,0.4)', 'rgba(255,200,100,0.9)', 'rgba(100,200,255,0.9)'];
    const bgs = ['rgba(255,255,255,0.06)', 'rgba(255,180,60,0.15)', 'rgba(60,160,255,0.15)'];
    dirBtn.textContent = labels[s];
    dirBtn.style.color = colors[s];
    dirBtn.style.background = bgs[s];
  };
  updateDirBtn();
  dirBtn.onclick = (e) => {
    e.stopPropagation();
    const s = getDirState();
    if (s === 0) {
      conn.directed = true; conn._reversed = false;
    } else if (s === 1) {
      // flip: swap from/to so the arrow points the other way
      const tmp = conn.from; conn.from = conn.to; conn.to = tmp;
      conn._reversed = true;
    } else {
      conn.directed = false; conn._reversed = false;
    }
    updateDirBtn();
    rebuildConnections(); save();
  };
}

function closeConnEditor() {
  editingConnId = null;
  connEditorEl.classList.remove('open');
  controls.enabled = true;
  needsRender = true;
}

document.getElementById('conn-done-btn').addEventListener('click', () => closeConnEditor());
document.getElementById('conn-del-btn').addEventListener('click', () => {
  if (editingConnId) {
    const conn = state.connections.find(c => c.id === editingConnId);
    if (conn) deleteConnection([conn.from, conn.to].sort().join('|'));
  }
  closeConnEditor();
});
connCustomInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); closeConnEditor(); }
});

// ═══════════════════════════════════════════
// EDITOR

const editorEl = document.getElementById('editor');

function renderEditorColors() {
  const btn = document.getElementById('ed-color-btn');
  const palette = document.getElementById('ed-color-palette');
  if (!btn || !palette) return;
  btn.style.background = editingColor;
  palette.innerHTML = COLORS.map(c =>
    `<div class="ed-color-swatch" data-color="${c}" style="background:${c}"></div>`
  ).join('');
  btn.onclick = (e) => { e.stopPropagation(); palette.classList.toggle('open'); };
  palette.querySelectorAll('.ed-color-swatch').forEach(swatch => {
    swatch.onclick = (e) => {
      e.stopPropagation();
      editingColor = swatch.dataset.color;
      btn.style.background = editingColor;
      palette.classList.remove('open');
      if (editingId) {
        const mesh = getMesh(editingId);
        if (mesh) { mesh.material.color.set(editingColor); mesh.material.emissive.set(editingColor); }
      }
    };
  });
}

function updateRichModeUI() {
  // v20: title is always visible. richMode state preserved for backward compat
  // with saved boards, but the UI no longer gates the title field. No-op.
}

function openEditor(id) {
  clearSelection(); closeConnEditor();
  editingId = id;
  const t = thoughtMap.get(id);
  const edBody = document.getElementById('ed-body');
  const edTitle = document.getElementById('ed-title');

  edBody.value = t ? (t.body || '') : '';
  if (edTitle) edTitle.value = t ? (t.text || '') : '';
  editingColor = t ? t.color : COLORS[0];
  renderEditorColors();
  updateRichModeUI();
  editorEl.classList.add('open');
  const collapseBtn = document.getElementById('collapse-btn');
  if (collapseBtn) collapseBtn.textContent = isCollapsed(id) ? '↑ expand' : '↓ collapse';
  controls.enabled = false;
  edBody.style.height = 'auto';

  // Glow connected thoughts
  for (const child of lineGroup.children) {
    if (child.userData.isConnLabel || child.userData.isArrow) continue;
    if (child.userData.from === id || child.userData.to === id) {
      const base = child.userData.baseOpacity || 0.35;
      child.material.opacity = Math.min(base + 0.3, 1.0);
      setTimeout(() => { if (child.material) child.material.opacity = base; needsRender = true; }, 800);
    }
  }
  needsRender = true;
  edBody.focus();
  edBody.selectionStart = edBody.value.length;
  setTimeout(() => edBody.focus(), 80);
}

function closeEditor(doSave) {
  if (doSave && editingId) {
    const edBody = document.getElementById('ed-body');
    const edTitle = document.getElementById('ed-title');
    const body = edBody ? edBody.value.trim() : '';
    // Bug 4: always read title from DOM — never force-wipe based on a mode flag
    const title = edTitle ? edTitle.value.trim() : '';
    if (!body && !title) {
      deleteThought(editingId);
    } else {
      updateThought(editingId, title, editingColor, undefined, body);
    }
  }
  editingId = null; editingColor = null;
  editorEl.classList.remove('open'); controls.enabled = true;
  editorClosedAt = performance.now();
}

document.getElementById('save-btn').addEventListener('click', ()=>closeEditor(true));
document.getElementById('cancel-btn').addEventListener('click', () => {
  if (editingId) {
    const t = thoughtMap.get(editingId);
    if (t && !t.text && !t.body) deleteThought(editingId);
  }
  closeEditor(false);
});
document.getElementById('del-btn').addEventListener('click', ()=>{ if(editingId) deleteThought(editingId); closeEditor(false); });
document.getElementById('collapse-btn').addEventListener('click', ()=>{
  if (!editingId) return;
  if (isCollapsed(editingId)) {
    expandThought(editingId);
    document.getElementById('collapse-btn').textContent = '↓ collapse';
  } else {
    collapseThought(editingId);
    document.getElementById('collapse-btn').textContent = '↑ expand';
  }
  save();
});
// Editor keyboard + input handlers
function setupEditorListeners() {
  const edBody = document.getElementById('ed-body');
  const edTitle = document.getElementById('ed-title');

  edBody.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeEditor(false); e.preventDefault(); }
    // v20: title is always on. Body Enter = newline (multi-line thinking).
    // Cmd/Ctrl+Enter = save. Matches rich editor conventions.
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { closeEditor(true); e.preventDefault(); }
  });
  edBody.addEventListener('input', () => {
    edBody.style.height = 'auto';
    edBody.style.height = Math.min(edBody.scrollHeight, 200) + 'px';
  });

  if (edTitle) {
    edTitle.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeEditor(false); e.preventDefault(); }
      // Enter in title = save (click outside is now the natural flow, Enter = done)
      // Shift+Enter jumps to body for adding detail
      if (e.key === 'Enter' && !e.shiftKey) { closeEditor(true); e.preventDefault(); }
      if (e.key === 'Enter' && e.shiftKey) { edBody.focus(); e.preventDefault(); }
    });
  }
}
setupEditorListeners();

// Tap outside editor = save (pointerdown on canvas while editor open)
canvas.addEventListener('pointerdown', (e) => {
  if (editorEl.classList.contains('open') && e.target === canvas) {
    closeEditor(true);
  }
}, { capture: true });

// ═══════════════════════════════════════════
// LASSO
// ═══════════════════════════════════════════

const lassoRect = document.getElementById('lasso-rect');
const lassoBar = document.getElementById('lasso-bar');

function clearSelection() {
  selectedIds.clear();
  lassoBar.classList.remove('open');
  lassoRect.style.display = 'none';
  for (const mesh of thoughtGroup.children) mesh.userData.targetEmissive = 0.15;
}

function updateLassoRect() {
  if (!lassoStart || !lassoEnd) return;
  const x = Math.min(lassoStart.x, lassoEnd.x), y = Math.min(lassoStart.y, lassoEnd.y);
  const w = Math.abs(lassoEnd.x - lassoStart.x), h = Math.abs(lassoEnd.y - lassoStart.y);
  lassoRect.style.display = 'block';
  lassoRect.style.left = x+'px'; lassoRect.style.top = y+'px';
  lassoRect.style.width = w+'px'; lassoRect.style.height = h+'px';
}

function finishLasso() {
  if (!lassoStart || !lassoEnd) { lassoRect.style.display='none'; return; }
  const x1 = Math.min(lassoStart.x, lassoEnd.x), y1 = Math.min(lassoStart.y, lassoEnd.y);
  const x2 = Math.max(lassoStart.x, lassoEnd.x), y2 = Math.max(lassoStart.y, lassoEnd.y);
  if (x2-x1 < 20 && y2-y1 < 20) { lassoRect.style.display='none'; return; }
  selectedIds.clear();
  for (const mesh of thoughtGroup.children) {
    const sp = mesh.position.clone().project(camera);
    const sx = (sp.x+1)/2 * window.innerWidth, sy = (1-sp.y)/2 * window.innerHeight;
    if (sx>=x1 && sx<=x2 && sy>=y1 && sy<=y2) { selectedIds.add(mesh.userData.id); mesh.userData.targetEmissive = 0.5; }
  }
  lassoRect.style.display = 'none';
  if (selectedIds.size > 0) { lassoBar.classList.add('open'); toast(selectedIds.size + ' selected'); }
}

document.getElementById('lasso-clear').addEventListener('pointerdown', (e)=>{ e.stopPropagation(); e.preventDefault(); clearSelection(); });
document.getElementById('lasso-recolor').addEventListener('pointerdown', (e)=>{
  e.stopPropagation(); e.preventDefault();
  if (selectedIds.size === 0) return;
  // Cycle through palette on each tap
  const idx = Math.floor(Math.random() * COLORS.length);
  const color = COLORS[idx];
  for (const id of selectedIds) {
    updateThought(id, thoughtMap.get(id)?.text, color, undefined, thoughtMap.get(id)?.body);
    const mesh = getMesh(id);
    if (mesh) { mesh.material.color.set(color); mesh.material.emissive.set(color); }
  }
  save(); toast(`${selectedIds.size} recolored`);
  clearSelection();
});

// ═══════════════════════════════════════════
// RAYCASTING
// ═══════════════════════════════════════════

function ndcFromEvent(e) {
  let x,y;
  if (e.touches && e.touches.length > 0) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
  else if (e.changedTouches && e.changedTouches.length > 0) { x = e.changedTouches[0].clientX; y = e.changedTouches[0].clientY; }
  else { x = e.clientX ?? 0; y = e.clientY ?? 0; }
  pointer.set((x/window.innerWidth)*2-1, -(y/window.innerHeight)*2+1);
}

function hitThought(e) {
  ndcFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  const visible = thoughtGroup.children.filter(m => {
    const t = thoughtMap.get(m.userData.id);
    return !t || !t.collapsedUnder;
  });
  const hits = raycaster.intersectObjects(visible, false);
  return hits.length ? hits[0].object : null;
}

function hitLine(e) {
  ndcFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(lineGroup.children.filter(l=>!l.userData.isConnLabel), false);
  return hits.length ? hits[0].object : null;
}

function worldPosFromScreen(e) {
  ndcFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  const camDir = camera.getWorldDirection(new THREE.Vector3());
  plane.setFromNormalAndCoplanarPoint(camDir.negate(), controls.target);
  raycaster.ray.intersectPlane(plane, intersectPt);
  return intersectPt.clone();
}

// ═══════════════════════════════════════════
// POINTER
// ═══════════════════════════════════════════

function pxFromEvent(e) {
  if (e.touches && e.touches.length > 0) return { x:e.touches[0].clientX, y:e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches.length > 0) return { x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY };
  return { x:e.clientX??0, y:e.clientY??0 };
}

function isOverlayOpen() {
  return editorEl.classList.contains('open')
    || connEditorEl.classList.contains('open')
    || boardsOverlay.classList.contains('open')
    || galleryOverlay.classList.contains('open');
}

function onPointerDown(e) {
  // If editor is open and tap is outside the editor panel — treat as "done"
  if (editorEl.classList.contains('open')) {
    const edRect = editorEl.getBoundingClientRect();
    const cx = e.clientX ?? e.touches?.[0]?.clientX;
    const cy = e.clientY ?? e.touches?.[0]?.clientY;
    if (cx !== undefined && (cx < edRect.left || cx > edRect.right || cy < edRect.top || cy > edRect.bottom)) {
      closeEditor(true);
      blockNextPointerUp = true;
      return;
    }
    return; // tap inside editor — let it handle naturally
  }
  if (isOverlayOpen()) return;
  if (e.target !== canvas) return;
  if (e.touches && e.touches.length > 1) { clearHold(); multiTouchActive = true; return; }
  const px = pxFromEvent(e);
  pointerStart = px; pointerMoved = false; holdTriggered = false;
  isDragging = false; lassoActive = false; lassoHoldTriggered = false;
  const hit = hitThought(e);
  if (hit) {
    draggedMesh = hit;
    const wp = worldPosFromScreen(e);
    dragOffset.copy(draggedMesh.position).sub(wp);
    holdTimer = setTimeout(()=>{
      if (!isDragging) {
        holdTriggered = true;
        connectSource = draggedMesh.userData.id;
        draggedMesh.material.emissiveIntensity = 0.6;
        pendingLineMesh.visible = true;
        pointerMoved = false;
        if (navigator.vibrate) navigator.vibrate(30);
      }
    }, HOLD_MS);
    // 5s deep-hold = collapse/expand entire subgraph
    collapseHoldTimer = setTimeout(()=>{
      if (!isDragging && !holdTriggered && draggedMesh) {
        const tid = draggedMesh.userData.id;
        if (isCollapsed(tid)) { expandThought(tid); }
        else { collapseThought(tid); }
        if (navigator.vibrate) navigator.vibrate([40,30,40]);
        save(); needsRender = true;
      }
    }, 5000);
    controls.enabled = false;
  } else {
    draggedMesh = null;
    lassoStart = px;
    lassoHoldTimer = setTimeout(()=>{
      if (!pointerMoved) {
        lassoHoldTriggered = true; lassoActive = true;
        if (navigator.vibrate) navigator.vibrate(20);
      }
    }, HOLD_MS);
    controls.enabled = true;
  }
}

function onPointerMove(e) {
  if (isOverlayOpen()) return;
  if (e.touches && e.touches.length > 1) { clearHold(); clearTimeout(lassoHoldTimer); lassoActive=false; lassoRect.style.display='none'; multiTouchActive = true; return; }
  const px = pxFromEvent(e);
  const dx = px.x-pointerStart.x, dy = px.y-pointerStart.y;
  if (Math.sqrt(dx*dx+dy*dy) > DRAG_THRESH) pointerMoved = true;

  if (draggedMesh && !holdTriggered && pointerMoved) {
    clearTimeout(holdTimer); isDragging = true;
    const wp = worldPosFromScreen(e);
    draggedMesh.position.copy(wp.add(dragOffset));
    moveThought(draggedMesh.userData.id, draggedMesh.position.x, draggedMesh.position.y, draggedMesh.position.z);
    updateConnectionPositions();
  }

  if (holdTriggered && connectSource) {
    const srcMesh = getMesh(connectSource);
    if (srcMesh) {
      const wp = worldPosFromScreen(e);
      const pos = pendingLineMesh.geometry.attributes.position;
      pos.setXYZ(0, srcMesh.position.x, srcMesh.position.y, srcMesh.position.z);
      pos.setXYZ(1, wp.x, wp.y, wp.z);
      pos.needsUpdate = true;
      needsRender = true;
    }
    const hit = hitThought(e);
    for (const child of thoughtGroup.children) {
      child.userData.targetEmissive = (hit===child && child.userData.id!==connectSource) ? 0.5 : 0.15;
    }
  }

  if (lassoActive && lassoHoldTriggered) { controls.enabled = false; lassoEnd = px; updateLassoRect(); }
}

function onPointerUp(e) {
  if (blockNextPointerUp) { blockNextPointerUp = false; return; }
  if (performance.now() - editorClosedAt < 150) return; // swallow stray up after editor close
  if (isOverlayOpen()) return;
  if (multiTouchActive) { multiTouchActive = false; draggedMesh=null; isDragging=false; holdTriggered=false; controls.enabled=true; return; }
  clearTimeout(holdTimer); clearTimeout(lassoHoldTimer);

  if (lassoActive && lassoHoldTriggered && lassoEnd) {
    finishLasso(); lassoActive=false; lassoHoldTriggered=false; lassoStart=null; lassoEnd=null;
    controls.enabled = true; return;
  }
  lassoActive=false; lassoHoldTriggered=false; lassoStart=null; lassoEnd=null; lassoRect.style.display='none';

  if (holdTriggered && connectSource) {
    pendingLineMesh.visible = false;
    const hit = hitThought(e);
    if (hit && hit.userData.id !== connectSource) {
      addConnection(connectSource, hit.userData.id);
    } else if (!hit && pointerMoved) {
      const wp = worldPosFromScreen(e);
      const newT = createThought(wp.x, wp.y, wp.z);
      const conn = { id:uid(), from:connectSource, to:newT.id, created:Date.now(), label:null, color:state.boardAccent||'#6ea8fe' };
      state.connections.push(conn);
      rebuildConnections(); save(); needsRender = true;
      setTimeout(() => openEditor(newT.id), 80);
    }
    const src = getMesh(connectSource);
    if (src) src.userData.targetEmissive = 0.15;
    for (const child of thoughtGroup.children) child.userData.targetEmissive = 0.15;
    connectSource = null;
  } else if (isDragging && draggedMesh) {
    save();
  } else if (draggedMesh && !pointerMoved) {
    openEditor(draggedMesh.userData.id);
  } else if (!draggedMesh && !pointerMoved) {
    if (selectedIds.size > 0) { clearSelection(); }
    else {
      const lineHit = hitLine(e);
      if (lineHit && lineHit.userData.connKey) {
        const conn = state.connections.find(c => [c.from,c.to].sort().join('|') === lineHit.userData.connKey);
        if (conn) openConnEditor(conn.id);
      } else {
        const wp = worldPosFromScreen(e);
        const t = createThought(wp.x, wp.y, wp.z);
        openEditor(t.id);
      }
    }
  }
  draggedMesh = null; isDragging = false; holdTriggered = false; multiTouchActive = false; controls.enabled = true;
}

function clearHold() {
  clearTimeout(holdTimer); clearTimeout(collapseHoldTimer); holdTriggered = false;
  if (connectSource) { const src = getMesh(connectSource); if (src) src.userData.targetEmissive = 0.15; connectSource = null; pendingLineMesh.visible = false; }
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length > 1) { multiTouchActive = true; clearHold(); draggedMesh = null; holdTriggered = true; controls.enabled = true; return; }
  multiTouchActive = false; onPointerDown(e);
}, { passive:false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e); }, { passive:false });
canvas.addEventListener('touchend', onPointerUp);
canvas.addEventListener('touchcancel', ()=>{ clearHold(); clearTimeout(lassoHoldTimer); lassoActive=false; lassoRect.style.display='none'; draggedMesh=null; isDragging=false; holdTriggered=false; multiTouchActive=false; controls.enabled=true; });
canvas.addEventListener('mousedown', onPointerDown);
// click-outside handled via editorClosedAt timestamp in onPointerUp
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);

// Hover highlight (desktop)
window.addEventListener('mousemove', (e) => {
  if (isDragging || holdTriggered || connectSource || isOverlayOpen()) {
    if (!connectSource) {
      for (const child of thoughtGroup.children) {
        child.userData.targetEmissive = 0.10;
        child.userData.targetLabelOpacity = 0.88;
      }
      for (const child of lineGroup.children) {
        if (child.userData.isConnLabel) { child.material.opacity = 0.6; continue; }
        child.material.opacity = child.userData.baseOpacity || 0.22;
      }
    }
    return;
  }
  const hit = hitThought(e);
  for (const child of thoughtGroup.children) {
    const tId = child.userData.id;
    if (!hit) {
      child.userData.targetEmissive = 0.10;
      child.userData.targetLabelOpacity = 0.88;
    } else if (tId === hit.userData.id) {
      child.userData.targetEmissive = 0.42;
      child.userData.targetLabelOpacity = 1.0;
    } else {
      const isConnected = state.connections.some(c =>
        (c.from === hit.userData.id && c.to === tId) || (c.to === hit.userData.id && c.from === tId)
      );
      child.userData.targetEmissive = isConnected ? 0.25 : 0.04;
      child.userData.targetLabelOpacity = isConnected ? 0.88 : 0.10;
    }
  }
  for (const child of lineGroup.children) {
    const base = child.userData.baseOpacity || 0.22;
    if (child.userData.isConnLabel) {
      if (!hit) child.material.opacity = 0.6;
      else {
        const isRelated = child.userData.from === hit.userData.id || child.userData.to === hit.userData.id;
        child.material.opacity = isRelated ? 0.85 : 0.04;
      }
      continue;
    }
    if (!hit) child.material.opacity = base;
    else {
      const isRelated = child.userData.from === hit.userData.id || child.userData.to === hit.userData.id;
      child.material.opacity = isRelated ? 0.7 : 0.05;
    }
  }
  needsRender = true;
});
