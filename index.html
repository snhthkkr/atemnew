const menuDrawer = document.getElementById('menu-drawer');
const menuScrim = document.getElementById('menu-scrim');
function updateMenuHeader() {
  const nameEl = document.getElementById('m-header-name');
  const countEl = document.getElementById('m-header-count');
  if (nameEl) nameEl.textContent = state.boardName || state.boardId || 'Board 1';
  if (countEl) {
    const n = state.thoughts.length;
    const c = state.connections.length;
    countEl.textContent = `${n} thought${n===1?'':'s'} · ${c} connection${c===1?'':'s'}`;
  }
}
function openMenu() { updateMenuHeader(); hideIdleChip(); menuDrawer.classList.add('open'); menuScrim.classList.add('open'); }
function closeMenu() { menuDrawer.classList.remove('open'); menuScrim.classList.remove('open'); }

document.getElementById('menu-btn').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); openMenu(); }, { passive:false });
menuScrim.addEventListener('click', closeMenu);

document.getElementById('m-export').addEventListener('click', () => {
  const data = JSON.stringify({ thoughts:state.thoughts, connections:state.connections }, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `atem-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  closeMenu(); toast('Exported');
});

document.getElementById('m-import').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = (ev) => {
    const file = ev.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (r) => {
      try {
        const data = JSON.parse(r.target.result);
        if (data.thoughts) {
          while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
          while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
          state.thoughts = data.thoughts;
          state.connections = data.connections || [];
          for (const t of state.thoughts) { if (!t.size) t.size = 1.0; if (!t.props) t.props = {}; }
          for (const c of state.connections) { if (!c.color) c.color = '#6ea8fe'; }
          for (const t of state.thoughts) addThoughtMesh(t);
          rebuildMaps();
          rebuildConnections(); save();
          toast('Imported ' + state.thoughts.length + ' thoughts');
          if (state.thoughts.length > 0) hideHint();
        }
      } catch (err) { toast('Import failed'); }
    };
    reader.readAsText(file);
  };
  input.click(); closeMenu();
});

document.getElementById('m-zgrid').addEventListener('click', () => { toggleZGrid(); });

document.getElementById('m-reset-view').addEventListener('click', () => {
  camera.position.set(0,0,state.initialCamDist||18); controls.target.set(0,0,0); controls.update(); needsRender=true; save(); closeMenu();
});

function updateCaptureToggle() {
  document.getElementById('m-capture-dot').classList.toggle('on', !!state.openToCapture);
}
document.getElementById('m-open-capture').addEventListener('click', () => {
  state.openToCapture = !state.openToCapture; updateCaptureToggle(); save();
  toast(state.openToCapture ? 'Will open to capture' : 'Will open to space');
  closeMenu();
});

document.getElementById('m-toggle-fps').addEventListener('click', () => {
  showFps = !showFps;
  document.getElementById('fps').classList.toggle('on', showFps);
  document.getElementById('m-fps-dot').classList.toggle('on', showFps);
  closeMenu();
});

document.getElementById('m-dump').addEventListener('click', () => {
  console.log(JSON.stringify(state, null, 2));
  closeMenu(); toast('State → console');
});

document.getElementById('m-orphans').addEventListener('click', () => {
  const connected = new Set();
  for (const c of state.connections) { connected.add(c.from); connected.add(c.to); }
  let count = 0;
  for (const mesh of thoughtGroup.children) {
    if (!connected.has(mesh.userData.id)) {
      count++;
      mesh.material.emissive.set('#ff4444'); mesh.material.emissiveIntensity = 0.8;
      setTimeout(() => {
        const t = thoughtMap.get(mesh.userData.id);
        if (t) mesh.material.emissive.set(t.color || '#6ea8fe');
        mesh.userData.targetEmissive = 0.15;
      }, 1500);
    }
  }
  closeMenu(); toast(count + ' orphan' + (count !== 1 ? 's' : ''));
});

document.getElementById('m-bulk').addEventListener('click', () => {
  const spread = Math.sqrt(100) * 2;
  for (let i = 0; i < 100; i++) {
    const x = (Math.random()-0.5)*spread, y = (Math.random()-0.5)*spread, z = (Math.random()-0.5)*spread*0.5;
    createThought(x, y, z, `test-${i}`);
  }
  closeMenu(); toast('+100');
});

document.getElementById('m-clear').addEventListener('click', async () => {
  if (!confirm('clear all thoughts?')) return;
  state.thoughts = []; state.connections = [];
  while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  thoughtMap.clear(); meshMap.clear();
  // Bug 7: also purge thumbnail so cleared board doesn't show ghost preview
  try { await del('atem-thumb-' + state.boardId); } catch(e) {}
  try { localStorage.removeItem('atem-thumb-' + state.boardId); } catch(e) {}
  save(); closeMenu(); toast('Cleared');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const meaningsP = document.getElementById('meanings-panel');
    if (meaningsP && meaningsP.classList.contains('open')) { closeMeanings(); e.preventDefault(); }
    else if (boardsOverlay.classList.contains('open')) { closeBoards(); e.preventDefault(); }
    else if (galleryOverlay.classList.contains('open')) { closeGallery(); e.preventDefault(); }
    else if (connEditorEl.classList.contains('open')) { closeConnEditor(); e.preventDefault(); }
    else if (menuDrawer.classList.contains('open')) { closeMenu(); e.preventDefault(); }
    else if (editorEl.classList.contains('open')) { closeEditor(false); e.preventDefault(); }
  }
});

// Drag-drop import
document.body.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); });
document.body.addEventListener('drop', (e) => {
  e.preventDefault(); e.stopPropagation();
  const file = e.dataTransfer.files[0];
  if (!file || !file.name.endsWith('.json')) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.thoughts) return;
      while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
      while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
      state.thoughts = data.thoughts;
      state.connections = data.connections || [];
      for (const t of state.thoughts) { if (!t.size) t.size = 1.0; if (!t.props) t.props = {}; }
      for (const c of state.connections) { if (!c.color) c.color = '#6ea8fe'; }
      for (const t of state.thoughts) addThoughtMesh(t);
      rebuildMaps();
      rebuildConnections(); save();
      toast(`Imported ${state.thoughts.length} thoughts`);
      if (state.thoughts.length > 0) hideHint();
    } catch (err) { toast('Import failed'); }
  };
  reader.readAsText(file);
});

// ─── Board Slots ───

const boardsOverlay = document.getElementById('boards-overlay');

function captureThumbnail() {
  // Force a render then grab the canvas pixel data as a small dataURL
  renderer.render(scene, camera);
  try {
    return renderer.domElement.toDataURL('image/jpeg', 0.5);
  } catch(e) { return null; }
}

async function saveThumbnail(boardId, dataUrl) {
  if (!dataUrl) return;
  try { await set('atem-thumb-' + boardId, dataUrl); } catch(e) {}
  try { localStorage.setItem('atem-thumb-' + boardId, dataUrl); } catch(e) {}
}

async function getThumbnail(boardId) {
  try {
    const t = await get('atem-thumb-' + boardId);
    if (t) return t;
  } catch(e) {}
  try { return localStorage.getItem('atem-thumb-' + boardId); } catch(e) { return null; }
}

function openBoards() {
  hideIdleChip();
  // Capture thumbnail of current board before opening
  const thumb = captureThumbnail();
  if (thumb) saveThumbnail(state.boardId, thumb);
  renderBoardSlots();
  boardsOverlay.classList.add('open');
}

function closeBoards() {
  boardsOverlay.classList.remove('open');
}

async function renderBoardSlots() {
  const registry = await getBoardRegistry();
  const grid = document.getElementById('boards-grid');
  grid.innerHTML = registry.map(b => `
    <div class="bcard${b.id === state.boardId ? ' active' : ''}" data-board-id="${b.id}">
      <div class="bcard-thumb" id="thumb-${b.id}">
        <div class="bcard-thumb-empty">empty</div>
      </div>
      <div class="bcard-info">
        <div class="bcard-name">${b.name}</div>
        <div class="bcard-count">${b.count > 0 ? b.count + ' thoughts' : 'empty'}</div>
      </div>
      <button class="bcard-rename" data-board-id="${b.id}">rename</button>
    </div>
  `).join('');

  // Load thumbnails async
  for (const b of registry) {
    getThumbnail(b.id).then(thumb => {
      if (!thumb) return;
      const container = document.getElementById('thumb-' + b.id);
      if (!container) return;
      container.innerHTML = '';
      const img = document.createElement('img');
      img.src = thumb;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
      container.appendChild(img);
    });
  }

  grid.querySelectorAll('.bcard').forEach(card => {
    card.addEventListener('click', async (e) => {
      if (e.target.classList.contains('bcard-rename')) return;
      const bid = card.dataset.boardId;
      if (bid === state.boardId) { closeBoards(); return; }
      closeBoards();
      await loadBoard(bid);
      try { localStorage.setItem('atem-last-board', bid); } catch(e) {}
    });
  });

  grid.querySelectorAll('.bcard-rename').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const bid = btn.dataset.boardId;
      getBoardRegistry().then(async reg => {
        const slot = reg.find(b => b.id === bid);
        const newName = prompt('Board name:', slot?.name || bid);
        if (!newName || !newName.trim()) return;
        const trimmed = newName.trim();
        if (bid === state.boardId) { state.boardName = trimmed; save(); }
        if (slot) { slot.name = trimmed; try { await set('atem-boards', reg); } catch(e) {} }
        renderBoardSlots();
      });
    });
  });
}

document.getElementById('boards-close').addEventListener('click', closeBoards);
boardsOverlay.addEventListener('click', (e) => { if (e.target === boardsOverlay) closeBoards(); });
document.getElementById('m-boards').addEventListener('click', () => { closeMenu(); openBoards(); });

function renderGalleryCards() {
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = STARTER_BOARDS.map(b => {
    const shapeBadge = b.defaultShape && b.defaultShape !== 'sphere'
      ? `<span style="font-size:10px;color:var(--ink-ghost);letter-spacing:0;margin-left:8px;font-style:normal">· ${b.defaultShape}</span>`
      : '';
    return `

      </div>
    </div>
  `}).join('');
  grid.querySelectorAll('.gcard').forEach(card => {
    card.addEventListener('click', () => {
      const board = STARTER_BOARDS.find(b => b.id === card.dataset.boardId);
      if (board) loadStarterBoard(board);
    });
  });
}

function loadStarterBoard(board) {
  if (state.thoughts.length > 0 && !state.isStarterBoard) {
    if (!confirm(`Load "${board.name}"?\n\nThis replaces your current space. Export first to keep it.`)) return;
  }
  // Close any open editors — editingId would point to a thought about to be cleared
  if (editingId) closeEditor(false);
  if (editingConnId) closeConnEditor();
  hideIdleChip();

  while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  thoughtMap.clear(); meshMap.clear();

  const now = Date.now();
  state.thoughts = board.thoughts.map(t => ({
    ...t,
    position: [...t.position],
    body: t.body || '',
    created: now,
    touched: now,
    props: t.props || {}
  }));

  // Bug 2: 5-tuple destructure [from, to, label, directed, color]
  state.connections = board.connections.map(([from, to, label, directed, color]) => {
    return {
      id: uid(),
      from, to,
      label: label || null,
      color: color || board.accent,
      directed: directed || false,
      created: now
    };
  });

  for (const t of state.thoughts) addThoughtMesh(t);
  rebuildMaps();
  rebuildConnections();
  hideHint();

  // Bug 10: dynamic camera distance — max(22, maxR * 1.9)
  let maxR = 0;
  for (const t of state.thoughts) {
    const r = Math.hypot(t.position[0], t.position[1], t.position[2]);
    if (r > maxR) maxR = r;
  }
  const camDist = Math.max(22, maxR * 1.9);
  state.initialCamDist = camDist;
  camera.position.set(0, 0, camDist);
  controls.target.set(0, 0, 0);
  needsRender = true;

  // Bug 8: update board slot registry (name, count, updated) — persist metadata
  state.boardName = board.name;
  state.boardAccent = board.accent || '#6ea8fe';
  state.boardDefaultShape = board.defaultShape || 'sphere';
  state.boardDefaultColor = board.defaultColor || null;
  // Boards are semiotic universes — they may ship a pre-filled grammar
  // (schema + meanings). Users opening the board see what filled-in
  // grammar looks like, then continue filling it themselves. Test arena.
  state.schema = (board.schema && board.schema.length) ? [...board.schema] : ['color', 'shape', 'size'];
  state.meanings = {
    color: board.meanings?.color ? { ...board.meanings.color } : {},
    shape: board.meanings?.shape ? { ...board.meanings.shape } : {},
    size:  board.meanings?.size  ? { ...board.meanings.size  } : {},
  };
  state.isStarterBoard = true;
  save();
  getBoardRegistry().then(async reg => {
    const slot = reg.find(b => b.id === state.boardId);
    if (slot) {
      slot.name = board.name;
      slot.count = state.thoughts.length;
      slot.updated = Date.now();
      try { await set('atem-boards', reg); } catch(e) {}
    }
  });

  closeGallery();
  toast(`Loaded ${board.name}`);
}

document.getElementById('m-gallery').addEventListener('click', () => { closeMenu(); openGallery(); });

// ═══════════════════════════════════════════════════════════════════
// MEANINGS PANEL — the user's grammar for this board (v26)
// ═══════════════════════════════════════════════════════════════════
// Atem ships defaults (color/shape/size as slots), the user fills in
// what those values mean to THEM. Same hex on two different boards can
// mean different things — boards are semiotic universes.
//
// Surfacing: lenient. After just 3 thoughts on a fresh board (or on
// load of a starter that has pre-filled meanings), a single quiet
// nudge appears once. Always accessible via menu after that.
// ═══════════════════════════════════════════════════════════════════

let meaningsActiveSlot = 'color';
let meaningsNudgeShown = false;

function meaningsLabelForColor(hex) {
  const lower = hex && hex.toLowerCase();
  for (const k in TONES) {
    if (TONES[k].toLowerCase() === lower) return k;
  }
  return hex;
}

function getUsedValuesForSlot(slot) {
  // Returns { value: count } for each unique value used on this slot
  // across all thoughts on the current board. Sorted by count descending.
  const used = {};
  for (const t of state.thoughts) {
    let v = null;
    if (slot === 'color') v = t.color || TONES.bone;
    else if (slot === 'shape') v = t.shape || 'sphere';
    else if (slot === 'size') {
      // Bucket sizes into rough tiers so the user isn't drowning in 1.043 vs 1.044
      const s = t.size || 1.0;
      if (s >= 1.5) v = 'large';
      else if (s >= 1.15) v = 'medium-large';
      else if (s >= 0.85) v = 'default';
      else if (s >= 0.6) v = 'small';
      else v = 'tiny';
    }
    if (v == null) continue;
    used[v] = (used[v] || 0) + 1;
  }
  return Object.entries(used).sort((a, b) => b[1] - a[1]);
}

function renderMeaningsPanel() {
  const body = document.getElementById('meanings-body');
  if (!body) return;
  body.innerHTML = '';

  const slot = meaningsActiveSlot;
  const used = getUsedValuesForSlot(slot);

  if (used.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'meaning-empty';
    empty.textContent = `No ${slot}s used yet on this board. Add a thought, then come back here to give it meaning.`;
    body.appendChild(empty);
    return;
  }

  if (!state.meanings) state.meanings = { color:{}, shape:{}, size:{} };
  if (!state.meanings[slot]) state.meanings[slot] = {};

  for (const [value, count] of used) {
    const row = document.createElement('div');
    row.className = 'meaning-row';

    const glyph = document.createElement('div');
    if (slot === 'color') {
      glyph.className = 'meaning-glyph color-glyph';
      glyph.style.background = value;
    } else if (slot === 'shape') {
      glyph.className = 'meaning-glyph shape-glyph';
      glyph.textContent = value;
    } else {
      glyph.className = 'meaning-glyph size-glyph';
      // Size dot scales with bucket
      let s = 6;
      if (value === 'tiny') s = 4;
      else if (value === 'small') s = 7;
      else if (value === 'default') s = 10;
      else if (value === 'medium-large') s = 13;
      else if (value === 'large') s = 16;
      glyph.style.width = s + 'px';
      glyph.style.height = s + 'px';
    }
    row.appendChild(glyph);

    const input = document.createElement('input');
    input.className = 'meaning-input';
    input.type = 'text';
    input.value = state.meanings[slot][value] || '';
    // Placeholders: helpful hints, not prescriptions
    if (slot === 'color') {
      input.placeholder = `what does ${meaningsLabelForColor(value)} mean to you?`;
    } else if (slot === 'shape') {
      input.placeholder = `what does this shape carry?`;
    } else {
      input.placeholder = `what does '${value}' signify?`;
    }
    input.addEventListener('input', () => {
      const v = input.value.trim();
      if (v) state.meanings[slot][value] = v;
      else delete state.meanings[slot][value];
      save();
    });
    row.appendChild(input);

    const c = document.createElement('span');
    c.className = 'meaning-count';
    c.textContent = '×' + count;
    row.appendChild(c);

    body.appendChild(row);
  }
}

function openMeanings() {
  const panel = document.getElementById('meanings-panel');
  if (!panel) return;
  // Refresh tabs to reflect schema (so unused slots could be hidden in the future)
  document.querySelectorAll('.meanings-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.slot === meaningsActiveSlot);
  });
  renderMeaningsPanel();
  panel.classList.add('open');
}

function closeMeanings() {
  document.getElementById('meanings-panel').classList.remove('open');
}

document.getElementById('meanings-close').addEventListener('click', closeMeanings);
document.getElementById('m-meanings').addEventListener('click', () => { closeMenu(); openMeanings(); });
document.querySelectorAll('.meanings-tab').forEach(tab => {

// Lenient nudge: after the user has made 3 thoughts on a fresh board (no
// pre-filled meanings) AND used at least 2 distinct colors, surface the
// meaning-affordance once via toast. They can ignore it. Available in
// menu always.
function maybeNudgeMeanings() {
  if (meaningsNudgeShown) return;
  if (state.thoughts.length < 3) return;
  // Check distinct colors used (heuristic: only nudge if user is actually
  // varying colors — otherwise the meaning panel has nothing useful)
  const colors = new Set();
  for (const t of state.thoughts) colors.add(t.color || TONES.bone);
  if (colors.size < 2) return;
  // Only nudge if the user hasn't filled in any meanings yet
  if (state.meanings && state.meanings.color) {
    const filled = Object.values(state.meanings.color).some(v => v && v.trim());
    if (filled) { meaningsNudgeShown = true; return; }
  }
  meaningsNudgeShown = true;
  toast('Tip: tell atem what your colors mean');
}

// ═══════════════════════════════════════════
// ANIMATION
// ═══════════════════════════════════════════

let fpsFrames = 0, fpsLast = performance.now(), fpsValue = 0;
let lastTime = performance.now();
let needsRender = true;

const frustum = new THREE.Frustum();
const camMatrix = new THREE.Matrix4();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now(); const dt = Math.min((now-lastTime)/1000, 0.05); lastTime = now;
  fpsFrames++;
  if (now-fpsLast >= 500) {
    fpsValue = Math.round(fpsFrames/((now-fpsLast)/1000)); fpsFrames = 0; fpsLast = now;
    if (showFps) document.getElementById('fps').textContent = fpsValue + ' fps';
  }

  controls.update();

  camera.updateMatrixWorld();
  camMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(camMatrix);

  let hasAnim = false;
  for (const mesh of thoughtGroup.children) {
    const ud = mesh.userData; ud.breath += dt*0.7;
    // Imperceptible drift — board breathes, you feel it not see it
    if (!isDragging || mesh !== draggedMesh) {
      mesh.position.y += Math.sin(ud.breath)*0.00018;
      mesh.position.x += Math.cos(ud.breath*0.7)*0.00012;
    }
    // Billboarded shapes (card, bar) face the camera — they're surfaces, not volumes
    if (ud.billboards) {
      mesh.quaternion.copy(camera.quaternion);
    }
    const ce = mesh.material.emissiveIntensity;
    const te = ud.targetEmissive + Math.sin(ud.breath)*0.02;
    mesh.material.emissiveIntensity += (te-ce)*0.08;
    const co = mesh.material.opacity;
    mesh.material.opacity += (ud.targetOpacity-co)*0.08;

    // Confident pop-in: 0.88 → 1.0 ease-out cubic over 220ms. No overshoot.
    if (ud.bounceStart) {
      const dur = ud.bounceDuration || 220;
      const elapsed = now - ud.bounceStart;
      if (elapsed >= dur) {
        ud.bounceStart = 0;
        ud.bounceFromZero = false;
        mesh.scale.setScalar(ud.baseSize || 1.0);
      } else {
        const t = elapsed / dur;
        let mult;
        if (ud.bounceFromZero) {
          // ease-out cubic: 0.88 → 1.0
          const u = 1 - Math.pow(1 - t, 3);
          mult = 0.88 + 0.12 * u;
        } else {
          // soft return bounce
          mult = 1 + 0.04 * Math.sin(Math.PI * t);
        }
        mesh.scale.setScalar((ud.baseSize || 1.0) * mult);
        hasAnim = true;
      }
    }

    // Inhale on connection-land: 1.0 → 1.04 → 1.0 over 220ms
    if (ud.inhaleStart) {
      const dur = 220;
      const elapsed = now - ud.inhaleStart;
      if (elapsed >= dur) {
        ud.inhaleStart = 0;
        if (!ud.bounceStart) mesh.scale.setScalar(ud.baseSize || 1.0);
      } else {
        const t = elapsed / dur;
        const mult = 1 + 0.04 * Math.sin(Math.PI * t);
        if (!ud.bounceStart) mesh.scale.setScalar((ud.baseSize || 1.0) * mult);
        hasAnim = true;
      }
    }

    const label = mesh.getObjectByName('label');
    if (label) {
      const inView = frustum.containsPoint(mesh.position);
      const _screenR = (mesh.scale.x / mesh.position.distanceTo(camera.position)) * window.innerHeight * 0.5;
      const _sizeOk = _screenR > 8;
      const _targetLO = (inView && ud.targetOpacity > 0.5 && _sizeOk) ? ud.targetLabelOpacity : 0;
      const _curLO = label.material.opacity;
      label.material.opacity += (_targetLO - _curLO) * 0.12;
      label.visible = inView && label.material.opacity > 0.02;
      if (Math.abs(_curLO - _targetLO) > 0.01) hasAnim = true;
    }

    if (Math.abs(ce-te) > 0.01 || Math.abs(co-ud.targetOpacity) > 0.01) hasAnim = true;

    // Collapse badge — small ↓N indicator above the sphere
    const count = ud.collapsedCount || 0;
    let badge = mesh.getObjectByName('collapse-badge');
    if (count > 0) {
      if (!badge || badge.userData.forCount !== count) {
        if (badge) mesh.remove(badge);
        const bc = document.createElement('canvas'); bc.width = 128; bc.height = 64;
        const bctx = bc.getContext('2d');
        bctx.fillStyle = 'rgba(20,18,16,0.88)';
        bctx.beginPath();
        if (bctx.roundRect) bctx.roundRect(4,4,120,56,4); else bctx.rect(4,4,120,56);
        bctx.fill();
        bctx.strokeStyle = 'rgba(232,230,225,0.18)'; bctx.lineWidth = 1; bctx.stroke();
        bctx.fillStyle = '#e8e6e1';
        bctx.font = '500 22px "Inter", sans-serif';
        bctx.textAlign = 'center'; bctx.textBaseline = 'middle';
        bctx.fillText('+' + count, 64, 34);
        const bt = new THREE.CanvasTexture(bc);
        const bm = new THREE.SpriteMaterial({ map:bt, transparent:true, opacity:0.92, depthTest:false });
        badge = new THREE.Sprite(bm);
        badge.name = 'collapse-badge';
        badge.userData.forCount = count;
        badge.scale.set(1.0, 0.5, 1);
        badge.position.set(0, (mesh.scale.x || 1) + 0.5, 0);
        mesh.add(badge);
      }
      badge.visible = ud.targetOpacity > 0.1;
    } else if (badge) {
      mesh.remove(badge);
    }
  }

  if (lineGroup.children.length > 0) updateConnectionPositions();

  if (needsRender || isDragging || hasAnim) {
    renderer.render(scene, camera);
    needsRender = false;
  }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  needsRender = true;
});

// ═══════════════════════════════════════════
// Z-GRID
// ═══════════════════════════════════════════

function buildZGrid() {
  while (gridGroup.children.length) gridGroup.remove(gridGroup.children[0]);
  if (!zGridVisible) return;

  // Unique z-levels — group thoughts within 0.75 units of each other
  const rawZ = state.thoughts.map(t => t.position[2]).sort((a,b)=>a-b);
  const zLevels = [];
  for (const z of rawZ) {
    if (!zLevels.length || Math.abs(z - zLevels[zLevels.length-1]) > 0.75) zLevels.push(z);
  }
  if (!zLevels.length) return;

  // Board bounds — generous padding
  const xs = state.thoughts.map(t => t.position[0]);
  const ys = state.thoughts.map(t => t.position[1]);
  const pad = 6;
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
  const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;

  // Grid step — sparse. One line every 4 units. 
  const step = 4;

  for (const z of zLevels) {
    const count = state.thoughts.filter(t => Math.abs(t.position[2] - z) < 0.75).length;
    const pts = [];

    // Vertical lines (along y)
    for (let x = Math.ceil(minX/step)*step; x <= maxX; x += step) {
      pts.push(new THREE.Vector3(x, minY, z), new THREE.Vector3(x, maxY, z));
    }
    // Horizontal lines (along x)
    for (let y = Math.ceil(minY/step)*step; y <= maxY; y += step) {
      pts.push(new THREE.Vector3(minX, y, z), new THREE.Vector3(maxX, y, z));
    }

    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.22,
      depthTest: true
    });
    const segs = new THREE.LineSegments(geo, mat);
    segs.renderOrder = -1;
    gridGroup.add(segs);

    // Solid border rectangle — makes each plane's extent unambiguous
    const borderPts = [
      new THREE.Vector3(minX, minY, z), new THREE.Vector3(maxX, minY, z),
      new THREE.Vector3(maxX, minY, z), new THREE.Vector3(maxX, maxY, z),
      new THREE.Vector3(maxX, maxY, z), new THREE.Vector3(minX, maxY, z),
      new THREE.Vector3(minX, maxY, z), new THREE.Vector3(minX, minY, z),
    ];
    const borderGeo = new THREE.BufferGeometry().setFromPoints(borderPts);
    const borderMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 });
    const border = new THREE.LineSegments(borderGeo, borderMat);
    border.renderOrder = -1;
    gridGroup.add(border);

    // Minimal z-tag: just a tiny text sprite at the left edge, mid-height
    const cy = (minY + maxY) / 2;
    const bc = document.createElement('canvas'); bc.width = 120; bc.height = 36;
    const bctx = bc.getContext('2d');
    bctx.fillStyle = 'rgba(255,255,255,0.6)';
    bctx.font = 'bold 20px system-ui'; bctx.textAlign = 'left'; bctx.textBaseline = 'middle';
    bctx.fillText('z' + (z >= 0 ? '+' : '') + z.toFixed(0) + ' ·' + count, 4, 18);
    const bt = new THREE.CanvasTexture(bc);
    const bm = new THREE.SpriteMaterial({ map:bt, transparent:true, opacity:0.9, depthTest:false });
    const tag = new THREE.Sprite(bm);
    tag.scale.set(2.5, 0.75, 1);
    tag.position.set(minX - 0.5, cy, z);
    gridGroup.add(tag);
  }
  needsRender = true;
}

function toggleZGrid() {
  zGridVisible = !zGridVisible;
  document.getElementById('m-zgrid-dot').classList.toggle('on', zGridVisible);
  buildZGrid();
}

      {id:'thought2',text:'2. Thought',position:[-8,-1,3],color:'#7ed4a4',size:1.3},
      {id:'conn3',text:'3. Connection',position:[-8,2.5,3],color:'#7ed4a4',size:1.3},

      {id:'empty',text:'Empty screen',position:[-11,-5.5,2],color:'#7ed4a4',size:0.9},
      {id:'complete',text:'Three is complete',position:[-5,-2.5,2.5],color:'#7ed4a4',size:0.85},
      {id:'spatial',text:'Spatial cognition',position:[8,-5.5,-3],color:'#7ab8f5',size:1.0},
      {id:'external',text:'Extended cognition',position:[11,-4,-3],color:'#7ab8f5',size:0.9},
      {id:'flow',text:'Flow conditions',position:[8,-2.5,-2.5],color:'#7ab8f5',size:1.0},
      {id:'s1',text:'Stage 1: Presets',position:[-2.5,7,-2],color:'#f5c97a',size:1.2},
      {id:'s2',text:'Stage 2: Prompting',position:[1.5,8,-2.5],color:'#f5c97a',size:1.05},
      {id:'s3',text:'Stage 3: Code',position:[5.5,7,-2],color:'#f5c97a',size:1.05},
    ];
    const BCONNS = [
      ['claim','soul','why it matters'],['claim','medium','what it is'],['claim','fundamental','how'],
      ['claim','cheap','constraint'],['claim','joy','feeling'],['claim','sensitive','nature'],
      ['claim','space','primitive 1'],['claim','thought2','primitive 2'],['claim','conn3','primitive 3'],
      ['space','thought2','contains'],['thought2','conn3','enables'],['conn3','density','core insight'],
      ['space','empty','opens as'],['space','complete','proof'],['thought2','complete','proof'],['conn3','complete','proof'],
      ['space','spatial','cognitive basis'],['thought2','external','cognitive basis'],['flow','joy','produces'],
      ['soul','s1','stage 1'],['s1','s2','adds prompting'],['s2','s3','adds code'],
    ];
    for (const t of BIBLE) {

      state.thoughts.push(thought);

    for (const [from, to, label] of BCONNS) {

    }
    rebuildMaps();
