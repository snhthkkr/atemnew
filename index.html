<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>atem</title>
<style>
/* his tokens, verbatim — the body that was already right */
:root{--void:#0b0e14;--void2:#0e131b;--panel:#121822;--ink:#dce6f0;--faint:rgba(220,230,240,.5);--ghost:rgba(220,230,240,.2);--line:rgba(180,205,230,.12);--line2:rgba(180,205,230,.22);--signal:#5fe3b0;--rose:#e0739a;--t:480ms;--ease:cubic-bezier(.22,.68,0,1);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse 130% 90% at 50% -15%,#10151e 0%,#0b0e14 58%);font-family:-apple-system,'Space Grotesk',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden}
#axes,#edges,#trails{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#axes{z-index:1}#edges{z-index:2}#trails{z-index:4}
#world{position:absolute;inset:0;transform:translate(0,0) scale(1);transform-origin:0 0;will-change:transform;z-index:3}
.ax{stroke:rgba(180,205,230,.1);stroke-width:1}
.axlab{fill:var(--ghost);font-family:ui-monospace,'Space Mono',monospace;font-size:10px}
.edge{stroke:rgba(170,200,225,.2);stroke-width:1.4;fill:none;stroke-linecap:round}
.edge.hl{stroke:rgba(95,227,176,.6);stroke-width:1.8}
.edge.live{stroke:var(--signal);stroke-width:1.6;stroke-dasharray:5 4;opacity:.9}
.earrow{fill:rgba(170,200,225,.55)}
.elabel{fill:var(--faint);font-family:ui-monospace,'Space Mono',monospace;font-size:9.5px}
.trail{stroke:var(--signal);stroke-width:1.2;fill:none;stroke-linecap:round;opacity:0}
.trail.go{animation:fade .85s var(--ease) forwards}
@keyframes fade{0%{opacity:.55}100%{opacity:0}}
.tdot{fill:rgba(95,227,176,.5)}
.dfghost{fill:none;stroke:var(--rose);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.dfglab{fill:var(--rose);font-family:ui-monospace,'Space Mono',monospace;font-size:9px;opacity:.8}
.node{position:absolute;cursor:grab;transition:left var(--t) var(--ease),top var(--t) var(--ease);z-index:10;touch-action:none}
.node .dot{position:absolute;left:0;top:0;width:var(--d,15px);height:var(--d,15px);margin-left:calc(var(--d,15px)/-2);margin-top:calc(var(--d,15px)/-2);border-radius:50%;background:var(--c,#dce6f0);box-shadow:0 0 0 1.5px var(--void),0 0 0 2.5px rgba(0,0,0,.25);transition:width .3s var(--ease),height .3s var(--ease),box-shadow .2s}
.node .lab{position:absolute;left:14px;top:0;transform:translateY(-50%);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;line-height:1.2;letter-spacing:-.01em;color:var(--ink);background:rgba(11,14,20,.5);padding:3px 8px;border-radius:7px;transition:background .18s,color .18s,opacity .22s var(--ease)}
.node.mute .lab{opacity:0}
.node.mute:hover .lab,.node.hot .lab,.node.sel .lab{opacity:1}
.node.hot{z-index:300}.node.hot .lab{background:rgba(14,20,29,.96);color:#fff}
.node.sel .dot{box-shadow:0 0 0 1.5px var(--signal),0 0 14px rgba(95,227,176,.5)}
.node.src .dot{box-shadow:0 0 0 2px var(--signal),0 0 0 7px rgba(95,227,176,.22)}
.node.drag{cursor:grabbing}
.node.born .dot{animation:pop .34s var(--ease)}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.node.diffadd .dot{box-shadow:0 0 0 1.5px var(--void),0 0 0 3px rgba(95,227,176,.55)}
#lenses{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:5px;background:rgba(14,19,27,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:5px;z-index:40;box-shadow:0 8px 32px rgba(0,0,0,.4);max-width:94vw;overflow-x:auto}
.lens{appearance:none;border:0;background:transparent;color:var(--faint);font-family:inherit;font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:9px;cursor:pointer;transition:background .2s,color .2s;display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.1;white-space:nowrap}
.lens .lk{font-family:ui-monospace,'Space Mono',monospace;font-size:8.5px;color:var(--ghost);letter-spacing:.02em}
.lens:hover{color:var(--ink)}
.lens.on{background:rgba(95,227,176,.13);color:var(--signal)}
.lens.on .lk{color:rgba(95,227,176,.6)}
#caption{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);color:var(--faint);font-size:13px;text-align:center;pointer-events:none;z-index:39;transition:opacity .4s;max-width:90vw;letter-spacing:-.01em}
#caption b{color:var(--ink);font-weight:500}
#top{position:fixed;left:16px;top:14px;display:flex;align-items:center;gap:11px;z-index:45}
#menubtn{appearance:none;width:32px;height:32px;border:1px solid var(--line);background:rgba(14,19,27,.6);color:var(--ink);border-radius:9px;cursor:pointer;font-size:15px;line-height:1;transition:.2s}
#menubtn:hover{border-color:var(--line2)}
#brand{font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--ink)}
#bname{font-family:ui-monospace,'Space Mono',monospace;font-size:11px;color:var(--ghost)}
#legend{position:fixed;right:16px;top:16px;z-index:40;display:flex;flex-direction:column;gap:5px;align-items:flex-end;max-width:230px}
.lg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--faint);cursor:pointer;background:rgba(14,19,27,.5);padding:4px 9px;border-radius:8px;border:1px solid transparent;transition:.18s}
.lg:hover{border-color:var(--line);color:var(--ink)}
.lg .ld{width:11px;height:11px;border-radius:50%;flex:none}
#legendhint{font-size:10.5px;color:var(--ghost);font-family:ui-monospace,'Space Mono',monospace;cursor:pointer;padding:3px 8px;border-radius:7px;transition:.18s}
#legendhint:hover{color:var(--faint)}
#menu{position:fixed;left:0;top:0;bottom:0;width:300px;max-width:84vw;background:var(--void2);border-right:1px solid var(--line2);z-index:80;transform:translateX(-104%);transition:transform .3s var(--ease);padding:18px 16px;overflow-y:auto;box-shadow:14px 0 50px rgba(0,0,0,.5)}
#menu.on{transform:none}
#menuback{position:fixed;inset:0;background:rgba(6,9,13,.4);z-index:79;opacity:0;pointer-events:none;transition:opacity .25s}
#menuback.on{opacity:1;pointer-events:auto}
.msec{margin-bottom:22px}
.mh{font-family:ui-monospace,'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ghost);margin-bottom:9px}
.mitem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--faint);padding:8px 10px;border-radius:9px;cursor:pointer;transition:.15s;border:1px solid transparent}
.mitem:hover{background:rgba(255,255,255,.03);color:var(--ink)}
.mitem.on{color:var(--signal);background:rgba(95,227,176,.08)}
.mitem .mk{margin-left:auto;font-family:ui-monospace,'Space Mono',monospace;font-size:9px;color:var(--ghost)}
.mbtn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--faint);font-family:inherit;font-size:12px;padding:7px 11px;border-radius:8px;cursor:pointer;transition:.15s;width:100%;text-align:left;margin-top:4px}
.mbtn:hover{color:var(--ink);border-color:var(--line2)}
.vmkr{margin-top:8px;display:none;background:rgba(8,11,16,.5);border:1px solid var(--line);border-radius:10px;padding:11px}
.vmkr.on{display:block}
.vmkr label{font-size:10.5px;color:var(--ghost);display:block;margin:7px 0 3px}
.vmkr select,.vmkr input{width:100%;background:rgba(8,11,16,.6);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-family:inherit;font-size:12px;padding:6px 7px;outline:none}
.vmkr .vr{display:flex;gap:7px;margin-top:10px}
.vmkr .vr .mbtn{margin-top:0}
#impbox{width:100%;height:70px;background:rgba(8,11,16,.6);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:ui-monospace,'Space Mono',monospace;font-size:10px;padding:8px;outline:none;display:none;margin-top:6px}
#scrim{position:fixed;inset:0;background:rgba(6,9,13,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}
#scrim.on{opacity:1;pointer-events:auto}
#editor{position:fixed;z-index:91;width:min(360px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:15px;box-shadow:0 18px 60px rgba(0,0,0,.55);opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);transform-origin:top left}
#editor.on{opacity:1;transform:none;pointer-events:auto}
#etext{width:100%;min-height:64px;resize:none;background:rgba(8,11,16,.6);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:inherit;font-size:14px;line-height:1.45;padding:10px 11px;outline:none;-webkit-user-select:text;user-select:text}
#etext::placeholder{color:var(--ghost)}#etext:focus{border-color:var(--line2)}
.swatches{display:flex;gap:8px;margin-top:11px}
.sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .14s,border-color .14s}
.sw:hover{transform:scale(1.12)}.sw.on{border-color:var(--ink)}
.dims{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.dim{font-family:ui-monospace,'Space Mono',monospace;font-size:10px;color:var(--faint);background:rgba(8,11,16,.5);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.dim b{color:var(--signal);font-weight:400}
.erow{display:flex;gap:8px;margin-top:13px;align-items:center}
.ebtn{appearance:none;border:0;border-radius:9px;padding:8px 14px;font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;transition:.18s}
.eprim{background:var(--signal);color:#06281d}.eprim:hover{filter:brightness(1.08)}
.eghost{background:transparent;color:var(--faint)}.eghost:hover{color:var(--ink)}
.edel{margin-left:auto;color:rgba(224,115,154,.8);background:transparent}.edel:hover{color:var(--rose)}
#coach{position:fixed;z-index:60;background:rgba(14,20,29,.95);border:1px solid var(--line2);border-radius:11px;padding:9px 13px;font-size:12.5px;color:var(--ink);max-width:250px;box-shadow:0 8px 28px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s var(--ease);transform:translateY(6px);line-height:1.4}
#coach.on{opacity:1;transform:none}
#coach .ck{display:block;font-family:ui-monospace,'Space Mono',monospace;font-size:9.5px;color:var(--signal);margin-top:4px}
#stamp{position:fixed;left:16px;bottom:16px;font-family:ui-monospace,'Space Mono',monospace;font-size:9px;color:var(--ghost);z-index:5;letter-spacing:.05em}
#errbar{position:fixed;left:0;right:0;bottom:0;background:#3a0d12;color:#ffd9de;font-family:ui-monospace,'Space Mono',monospace;font-size:11px;padding:8px 12px;z-index:999;display:none}
.label-in{position:fixed;z-index:92;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px;display:none}
.label-in input{background:rgba(8,11,16,.6);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-family:inherit;font-size:12px;padding:6px 8px;outline:none;width:150px;-webkit-user-select:text;user-select:text}
.label-in .dirs{display:flex;gap:4px;margin-top:6px}
.label-in .dirs button{flex:1;background:rgba(8,11,16,.5);color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:5px;cursor:pointer;font-family:inherit}
.label-in .dirs button.on{background:rgba(95,227,176,.15);color:var(--signal);border-color:transparent}

/* ===== THE TAPE — time riding under the lenses, in his voice ===== */
#timebar{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);width:min(560px,92vw);z-index:38;
  display:flex;align-items:center;gap:7px;background:rgba(14,19,27,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:11px;padding:5px 9px;transition:opacity .3s}
.tb{appearance:none;border:0;background:transparent;color:var(--faint);font-family:ui-monospace,'Space Mono',monospace;font-size:11px;padding:4px 6px;border-radius:6px;cursor:pointer;line-height:1;transition:.15s;white-space:nowrap}
.tb:hover{color:var(--ink)}
.tb.on{color:var(--signal);background:rgba(95,227,176,.1)}
#track{flex:1;height:26px;cursor:crosshair;touch-action:none;border-radius:5px;min-width:120px}
#tbmore{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);display:none;gap:5px;z-index:38;
  background:rgba(14,19,27,.85);border:1px solid var(--line);border-radius:10px;padding:5px 7px;backdrop-filter:blur(12px)}
#tbmore.on{display:flex}
#tinfo{position:fixed;left:16px;bottom:34px;font-family:ui-monospace,'Space Mono',monospace;font-size:9.5px;color:var(--ghost);z-index:5;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tinfo.past{color:var(--signal)}

/* ===== notation — one quiet line, summoned by / ===== */
#ubarwrap{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);width:min(520px,92vw);z-index:70;display:none}
#ubarwrap.on{display:block}
#umsg{font-family:ui-monospace,'Space Mono',monospace;font-size:10px;color:var(--signal);min-height:14px;padding:0 4px 4px}
#umsg.err{color:var(--rose)}
#ubar{width:100%;background:rgba(14,20,29,.96);border:1px solid var(--line2);border-radius:10px;color:var(--ink);
  font-family:ui-monospace,'Space Mono',monospace;font-size:12.5px;padding:10px 12px;outline:none;-webkit-user-select:text;user-select:text}
#ubar:focus{border-color:rgba(95,227,176,.4)}
#ubar::placeholder{color:var(--ghost)}
@media (max-width:640px){#timebar{bottom:70px}#caption{bottom:124px}}
</style>
</head>
<body>
<div id="stage">
  <svg id="axes"></svg><svg id="edges"></svg><svg id="trails"></svg>
  <div id="world"></div>
</div>
<div id="top"><button id="menubtn">&#9776;</button><div id="brand">atem</div><div id="bname"></div></div>
<div id="legend"></div>
<div id="caption"></div>
<div id="timebar">
  <button class="tb" id="tPlay" title="play the board's history (space)">&#9654;</button>
  <button class="tb" id="tSpeed" title="speed">1&times;</button>
  <canvas id="track"></canvas>
  <button class="tb" id="tNow" title="jump to the present">now</button>
  <button class="tb" id="tMore" title="more time tools">&#8943;</button>
</div>
<div id="tbmore">
  <button class="tb" id="tMode" title="even beat / compressed real time">even</button>
  <button class="tb" id="tMark" title="name this moment">mark</button>
  <button class="tb" id="tDiff" title="set moment A, scrub to compare">diff A</button>
  <button class="tb" id="tFork" title="fork a board from this moment">&#9107; fork</button>
  <button class="tb" id="tFilm" title="export a self-playing replay">&#9678; film</button>
</div>
<div id="tinfo"></div>
<div id="lenses"></div>
<div id="coach"></div>
<div id="menuback"></div>
<div id="menu">
  <div class="msec"><div class="mh">boards</div><div id="boardlist"></div><button class="mbtn" id="newboard">+ new blank board</button></div>
  <div class="msec"><div class="mh">lenses &mdash; a view is just data</div><div id="viewlist"></div><button class="mbtn" id="newview">+ new lens</button>
    <div class="vmkr" id="vmkr"><label>name</label><input id="vmname" placeholder="my lens">
      <label>horizontal &mdash; read which property?</label><select id="vmx"></select>
      <label>vertical &mdash; read which property?</label><select id="vmy"></select>
      <div class="vr"><button class="mbtn" id="vmcreate" style="color:var(--signal)">create</button><button class="mbtn" id="vmcancel">cancel</button></div>
    </div></div>
  <div class="msec"><div class="mh">coins &mdash; derived properties</div><div id="coinlist"></div>
    <div class="vmkr on" style="display:block;background:transparent;border:0;padding:0">
      <input id="cname" placeholder="name (e.g. weight)" style="width:100%;background:rgba(8,11,16,.6);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-family:inherit;font-size:12px;padding:6px 7px;outline:none">
      <input id="cexpr" placeholder="expr (e.g. degree*size)" style="width:100%;margin-top:5px;background:rgba(8,11,16,.6);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-family:ui-monospace,monospace;font-size:11px;padding:6px 7px;outline:none">
      <button class="mbtn" id="coinadd" style="color:var(--signal)">coin it</button>
    </div></div>
  <div class="msec"><div class="mh">data &mdash; the ledger, as text</div>
    <button class="mbtn" id="exportbtn">&#8675; export .atem (ledger)</button>
    <button class="mbtn" id="importbtn">&#8673; import .atem (v1 or ledger)</button>
    <textarea id="impbox" placeholder="paste .atem json, then click import again"></textarea>
    <button class="mbtn" id="cleartoggle" style="color:rgba(224,115,154,.8);margin-top:10px">clear this board</button></div>
  <div class="msec"><div class="mh">engine</div><button class="mbtn" id="selftestbtn">run self-test</button>
    <div id="selftestout" style="font-family:ui-monospace,'Space Mono',monospace;font-size:10px;color:var(--faint);margin-top:8px"></div></div>
</div>
<div id="scrim"></div>
<div id="editor">
  <textarea id="etext" placeholder="what's on your mind?"></textarea>
  <div class="swatches" id="swatches"></div>
  <div class="dims" id="dims"></div>
  <div class="erow"><button class="ebtn eprim" id="esave">save</button><button class="ebtn eghost" id="ecancel">cancel</button><button class="ebtn edel" id="edel">delete</button></div>
</div>
<div class="label-in" id="labelin"><input id="labeltext" placeholder="name this link&hellip;"><div class="dirs" id="labeldirs"></div></div>
<div id="ubarwrap"><div id="umsg"></div><input id="ubar" autocomplete="off" spellcheck="false" placeholder="+ a thought &middot; #id.slot = n &middot; a -> b : label &middot; coin n = expr &middot; play &middot; mark &middot; fork &middot; film &middot; help"></div>
<div id="stamp">fork &middot; booting&hellip;</div>
<div id="errbar"></div>
<script>
(function(){
"use strict";
/* atem confluence r1 — the synthesis.
   SUBSTRATE = the utterance ledger: (subject, property, value, provenance, moment).
               The board is a fold. History is a place. [from the sandbox line]
   ENGINE    = layout(core, spec) -> positions. Pure. Lenses are DATA.  [from r11]
   INVERT    = drag is layout run backwards: solve for the slot, write it
               — and the write is an utterance.                          [r11 + ledger]
   TAPE      = scrub/play/diff/fork/film over the same ledger.           [from the sandbox line]
   Vocabulary throughout is provisional — naming carries provenance weight. */
var booted=false;
function fail(m){try{var e=document.getElementById('errbar');e.style.display='block';e.textContent='atem hit a snag: '+m+' - your boards are safe.';}catch(_){}}
window.onerror=function(m,s,l,c,err){fail((err&&err.message)||m);return false;};
window.onunhandledrejection=function(ev){fail((ev&&ev.reason&&ev.reason.message)||'async');};
var $=function(id){return document.getElementById(id);};
function now(){return Date.now();}
function uid(p){return (p||'t')+Math.random().toString(36).slice(2,9);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function r2(n){return Math.round(n*1000)/1000;}
var H=3600000;

/* =================================================================
   LEDGER — the only truth. subjects: t: e: coin: lens: mean:
   ================================================================= */
var boards={},activeId=null,ledger=[],cursor=-1,cps=[];
var CP_EVERY=60;
function blankModel(){return {thoughts:{},order:[],edges:{},coins:[],lenses:{},meanings:{}};}
function applyU(M,u){
  var kp=u.s.split(':'),kind=kp[0],id=kp.slice(1).join(':');
  if(kind==='t'){
    if(u.p==='exists'){
      if(u.v){M.thoughts[id]={id:id,slots:{text:'',color:'#dce6f0',size:1,x:0,y:0,time:u.m},touched:u.m,created:u.m};M.order.push(id);}
      else{delete M.thoughts[id];var oi=M.order.indexOf(id);if(oi>=0)M.order.splice(oi,1);
        for(var e in M.edges)if(M.edges[e].a===id||M.edges[e].b===id)delete M.edges[e];}
      return;
    }
    var t=M.thoughts[id];if(!t)return;t.slots[u.p]=u.v;t.touched=u.m;
  } else if(kind==='e'){
    if(u.p==='exists'){if(u.v)M.edges[id]={id:id,a:null,b:null,label:'',dir:1};else delete M.edges[id];return;}
    var ed=M.edges[id];if(ed)ed[u.p]=u.v;
  } else if(kind==='coin'){
    var i0=-1;for(var i=0;i<M.coins.length;i++)if(M.coins[i].name===id)i0=i;
    if(u.v===null){if(i0>=0)M.coins.splice(i0,1);}

function atemImport(j){
  var d=typeof j==='string'?JSON.parse(j):j;

    var id=uid('b');boards[id]={name:(d.name||'imported')+'',view:d.view||'free',ledger:d.ledger,marks:d.marks||[]};
    switchBoard(id);return;
  }
  // v1 snapshot -> synthesize a tape: one claim per fact, prov 'import'
  var b=d.atem===1?d:(d.thoughts?d:null);if(!b)throw new Error('unrecognized .atem');
  var L=[],m0=now()-((b.thoughts||[]).length*4+20)*1000,i=0;
  function say(s,p,v){L.push({m:m0+(i++)*900,s:s,p:p,v:v,prov:'import'});}
  seedBaseLenses(L,m0-5000);
  (b.thoughts||[]).forEach(function(t){say('t:'+t.id,'exists',true);
    for(var k in t.slots){if(t.slots[k]==null)continue;say('t:'+t.id,k,t.slots[k]);}});
  (b.edges||[]).forEach(function(e,n){var eid='e'+n;say('e:'+eid,'exists',true);say('e:'+eid,'a',e[0]);say('e:'+eid,'b',e[1]);say('e:'+eid,'label',e[2]||'');say('e:'+eid,'dir',e[3]==null?1:e[3]);});

  var id2=uid('b');boards[id2]={name:(b.name||'imported')+' (from v1)',view:b.view&&b.view!=='matrix'?b.view:'free',ledger:L,marks:[]};
  switchBoard(id2);
}

   THE TAPE — scrub, play, sessions, marks, diff, fork, film.
   ================================================================= */
var PROV_COLOR={hand:'#5fe3b0',notation:'#6fa8d0',agent:'#9b8cdb',seed:'rgba(220,230,240,.35)','import':'#f0a868'};
var SESSION_GAP=30*60e3;
var playing=false,playRAF=null,playNextAt=0,speed=1,playMode='even';
var diffA=null,diffOn=false,hoverIdx=null;
var SPEEDS=[0.5,1,2,4,8];
var track=$('track'),tctx=track.getContext('2d');
function curIdx(){return cursor===-1?ledger.length-1:cursor;}

var seekPending=null;
function seekTo(idx){
  stopPlayback();
  if(!ledger.length)return;
  idx=clamp(idx,0,ledger.length-1);
  cursor=idx>=ledger.length-1?-1:idx;
  if(seekPending)return;
  seekPending=requestAnimationFrame(function(){seekPending=null;refold();render();});
}
function toPresent(){stopPlayback();cursor=-1;refold();render();}
function stepDelay(i){
  if(playMode==='even')return 140/speed;
  var prev=ledger[i-1],cur=ledger[i];if(!prev||!cur)return 140/speed;
  var gap=(cur.m-prev.m)/1000;
  return (60+Math.log10(1+gap)*260)/speed;
}
function startPlayback(){
  if(!ledger.length)return;
  if(cursor===-1)cursor=0;
  playing=true;$('tPlay').innerHTML='&#10074;&#10074;';$('tPlay').classList.add('on');
  refold();render();
  playNextAt=performance.now()+stepDelay(cursor+1);
  playRAF=requestAnimationFrame(playTick);
}
function stopPlayback(){if(!playing)return;playing=false;cancelAnimationFrame(playRAF);$('tPlay').innerHTML='&#9654;';$('tPlay').classList.remove('on');}
function playTick(ts){
  if(!playing)return;
  var advanced=false;
  while(ts>=playNextAt){
    if(cursor>=ledger.length-1){toPresent();return;}
    cursor++;applyU(model,ledger[cursor]);advanced=true;
    var u=ledger[cursor],kp=u.s.split(':');
    if(kp[0]==='t'&&u.p==='exists'&&u.v===true){(function(id){setTimeout(function(){if(nodes[id]){nodes[id].classList.add('born');setTimeout(function(){nodes[id]&&nodes[id].classList.remove('born');},400);}},0);})(kp[1]);}
    playNextAt+=stepDelay(cursor+1);
    if(playNextAt<ts-500)playNextAt=ts;
  }
  if(advanced)render();
  playRAF=requestAnimationFrame(playTick);
}
function drawTrack(){
  var dpr=window.devicePixelRatio||1,W=track.clientWidth*dpr,Ht=track.clientHeight*dpr;
  if(!W)return;
  if(track.width!==W||track.height!==Ht){track.width=W;track.height=Ht;}
  var g=tctx;g.clearRect(0,0,W,Ht);
  var N=ledger.length;if(!N)return;
  var xAt=function(i){return (i+0.5)/N*W;};
  var cols=Math.max(1,Math.floor(W/(3*dpr))),perCol=Math.max(1,N/cols);
  for(var c=0;c<cols;c++){
    var i0=Math.floor(c*perCol),i1=Math.min(N,Math.ceil((c+1)*perCol));if(i0>=i1)continue;
    var counts={},n=0;for(var i=i0;i<i1;i++){var pv=ledger[i].prov||'hand';counts[pv]=(counts[pv]||0)+1;n++;}
    var dom=null,best=0;for(var k in counts)if(counts[k]>best){best=counts[k];dom=k;}
    var hgt=clamp(4+Math.log2(1+n)*5,4,Ht/dpr*0.7)*dpr;
    g.fillStyle=PROV_COLOR[dom]||'rgba(220,230,240,.3)';g.globalAlpha=0.8;
    g.fillRect(c/cols*W,Ht*0.8-hgt,Math.max(1.4*dpr,W/cols-0.6*dpr),hgt);g.globalAlpha=1;
  }

  sessions().forEach(function(s){if(s.start>0)g.fillRect(xAt(s.start)-1*dpr,0,2*dpr,Ht);});
  g.fillStyle='rgba(180,205,230,.15)';g.fillRect(0,Ht*0.8,W,1*dpr);
  if(diffA!==null){var xa=xAt(diffA);g.fillStyle='#6fa8d0';g.beginPath();g.moveTo(xa,Ht*0.8);g.lineTo(xa-3.5*dpr,Ht);g.lineTo(xa+3.5*dpr,Ht);g.closePath();g.fill();}
  g.fillStyle='#dce6f0';
  marks().forEach(function(mk){if(mk.at>=N)return;var x=xAt(mk.at);g.beginPath();g.moveTo(x,2*dpr);g.lineTo(x+3*dpr,7*dpr);g.lineTo(x,12*dpr);g.lineTo(x-3*dpr,7*dpr);g.closePath();g.fill();});
  if(hoverIdx!==null){g.strokeStyle='rgba(220,230,240,.3)';g.lineWidth=1*dpr;g.beginPath();g.moveTo(xAt(hoverIdx),0);g.lineTo(xAt(hoverIdx),Ht);g.stroke();}
  var px=xAt(curIdx());
  g.strokeStyle=cursor===-1?'rgba(220,230,240,.35)':'#5fe3b0';g.lineWidth=1.6*dpr;
  g.beginPath();g.moveTo(px,0);g.lineTo(px,Ht);g.stroke();
}

function computeDiff(){
  var A=modelAt(diffA),B=model,added=[],removed=[],moved=[],P=boardProps(),spec=curSpec();
  for(var id in B.thoughts){
    if(!A.thoughts[id]){added.push(id);continue;}
    var a=A.thoughts[id].slots,b=B.thoughts[id].slots,dl=0;
    for(var k in b)if(typeof b[k]==='number'&&typeof a[k]==='number'&&Math.abs(b[k]-a[k])>0.01)dl=1;
    if(dl)moved.push(id);
  }
  for(var id2 in A.thoughts)if(!B.thoughts[id2])removed.push({id:id2,slots:A.thoughts[id2].slots});
  return {added:added,removed:removed,moved:moved};
}
function renderDiff(){
  var tl=$('trails');
  for(var k in nodes)nodes[k].classList.remove('diffadd');
  if(!diffOn||diffA===null){if(tl.dataset.diff){tl.innerHTML='';delete tl.dataset.diff;}return;}
  var D=computeDiff(),O=origin,s='';
  D.added.forEach(function(id){if(nodes[id])nodes[id].classList.add('diffadd');});
  D.removed.forEach(function(r){
    var sx=(O.x+axisPos(r.slots.x,{map:'direct'}))*zoom+pan.x,sy=(O.y-axisPos(r.slots.y,{map:'direct'}))*zoom+pan.y;
    s+='<circle class="dfghost" cx="'+sx+'" cy="'+sy+'" r="7"></circle><text class="dfglab" x="'+(sx+11)+'" y="'+(sy+3)+'">\u2020 '+esc(String(r.slots.text||'').split('\n')[0].slice(0,22))+'</text>';
  });
  tl.innerHTML=s;tl.dataset.diff='1';
}

function umsg(m,err){var e=$('umsg');e.textContent=m;e.className=err?'err':'';setTimeout(function(){if(e.textContent===m)e.textContent='';},4000);}
function findThought(ref){ref=String(ref).replace(/^#/,'').trim();if(model.thoughts[ref])return ref;
  var low=ref.toLowerCase();
  for(var i=0;i<model.order.length;i++){var t=model.thoughts[model.order[i]];if(t&&String(t.slots.text||'').toLowerCase().indexOf(low)>=0)return t.id;}
  return null;}
function speak(raw){
  var s=raw.trim();if(!s)return;var m;
  if(m=s.match(/^\+\s*(.+)$/)){
    var id=uid();computeOrigin();
    utterMany([['t:'+id,'exists',true],['t:'+id,'text',m[1].trim()],['t:'+id,'color','#dce6f0'],['t:'+id,'size',1],['t:'+id,'x',r2((Math.random()-.5)*4)],['t:'+id,'y',r2((Math.random()-.5)*3)]],'notation');
    save();render();return umsg('uttered: "'+m[1].trim().slice(0,28)+'"');
  }
  if(m=s.match(/^(#?\S+)\.([a-z_][a-z0-9_]*)\s*=\s*(.+)$/i)){
    var tid=findThought(m[1]);if(!tid)return umsg('no thought matches "'+m[1]+'"',1);
    var p=m[2].toLowerCase(),v=m[3].trim();
    if(p==='text'||p==='color'){}
    else{v=parseFloat(v);if(!isFinite(v))return umsg('slots hold numbers (text/color excepted)',1);}
    utter('t:'+tid,p,v,'notation');save();render();
    return umsg('#'+tid+'.'+p+' = '+v);
  }
  if(m=s.match(/^(#?\S+)\s*(->|--|<-)\s*(#?\S+)\s*(?::\s*(.+))?$/)){
    var a=findThought(m[2]==='<-'?m[3]:m[1]),b=findThought(m[2]==='<-'?m[1]:m[3]);
    if(!a||!b)return umsg('could not match both thoughts',1);
    var eid=uid('e');
    utterMany([['e:'+eid,'exists',true],['e:'+eid,'a',a],['e:'+eid,'b',b],['e:'+eid,'label',(m[4]||'').trim()],['e:'+eid,'dir',m[2]==='--'?0:1]],'notation');
    save();render();return umsg('connected');
  }
  if(m=s.match(/^coin\s+([a-z_][a-z0-9_]*)\s*=\s*(.+)$/i)){utter('coin:'+m[1],'expr',m[2].trim(),'notation');save();render();return umsg('coined: '+m[1]);}
  if(m=s.match(/^lens\s+(\S+)$/i)){var sp=null;allSpecs().forEach(function(L){if(L.id===m[1]||L.label.toLowerCase()===m[1].toLowerCase())sp=L;});if(!sp)return umsg('no lens "'+m[1]+'"',1);switchLens(sp.id);return umsg('lens: '+sp.label);}
  if(m=s.match(/^find\s+(.+)$/i)){var fid=findThought(m[1]);if(!fid)return umsg('nothing matches',1);sel=fid;
    var p2=lastPos[fid]||{x:0,y:0};pan.x=window.innerWidth/2-(origin.x+p2.x)*zoom;pan.y=window.innerHeight/2-(origin.y+p2.y)*zoom;applyPan();render();return umsg('found #'+fid);}
  if(m=s.match(/^when\s+(.+)$/i)){var wid=findThought(m[1]);if(!wid)return umsg('nothing matches',1);
    for(var i=0;i<ledger.length;i++)if(ledger[i].s==='t:'+wid&&ledger[i].p==='exists'&&ledger[i].v===true){seekTo(i);return umsg('born at moment '+(i+1));}
    return umsg('birth not on this tape',1);}
  if(m=s.match(/^mark\s+(.+)$/i)){marks().push({at:curIdx(),label:m[1].trim()});drawTrack();save();return umsg('marked: '+m[1].trim());}
  if(m=s.match(/^board\s+(.+)$/i)){var name=m[1].trim(),hit=null;
    Object.keys(boards).forEach(function(id){if(boards[id].name.toLowerCase()===name.toLowerCase())hit=id;});
    if(hit){switchBoard(hit);return umsg('board: '+boards[hit].name);}
    newBoard(name);return umsg('new board: '+name);}
  if(/^play$/i.test(s)){startPlayback();return umsg('rolling');}
  if(/^pause$/i.test(s)){stopPlayback();return umsg('held');}
  if(m=s.match(/^speed\s+([\d.]+)x?$/i)){var v2=+m[1];if(SPEEDS.indexOf(v2)<0)return umsg('speeds: '+SPEEDS.join(' '),1);speed=v2;$('tSpeed').textContent=v2+'\u00d7';return umsg('speed '+v2+'\u00d7');}
  if(/^fork$/i.test(s)){forkHere();return umsg('forked');}
  if(/^film$/i.test(s)){exportFilm();return umsg('film exported');}
  if(/^diff$/i.test(s)){$('tDiff').click();return;}
  if(/^undo$/i.test(s)){undo();return umsg('unsaid');}
  if(/^help$/i.test(s))return umsg('+ text \u00b7 #id.slot=n \u00b7 a->b:label \u00b7 coin n=expr \u00b7 lens id \u00b7 find/when q \u00b7 board name \u00b7 play/pause/speed \u00b7 mark \u00b7 diff \u00b7 fork \u00b7 film \u00b7 undo');
  umsg('unparsed \u00b7 try: help',1);
}

function selfTest(){
  var out=[];function ok(n,c){out.push({name:n,ok:!!c});}
  var P=boardProps();
  (function(){var sp={kind:'project',x:{slot:'x',map:'direct'},y:{slot:'y',map:'direct'}},t={slots:{}};
    var w=invert(sp,t,2*SCALE,-3*SCALE);var o={};w.forEach(function(p){o[p[0]]=p[1];});
    ok('free round-trip (invert\u2218layout=id)',Math.abs(axisPos(o.x,sp.x)-2*SCALE)<1&&Math.abs(-axisPos(o.y,sp.y)+3*SCALE)<1);})();
  (function(){var sp={kind:'project',x:{slot:'u1',map:'unit'},y:{slot:'u2',map:'unit'}},t={slots:{}};
    var w=invert(sp,t,0.4*MSPAN,-0.3*MSPAN);var o={};w.forEach(function(p){o[p[0]]=p[1];});
    ok('unit round-trip',Math.abs(axisPos(o.u1,sp.x)-0.4*MSPAN)<1&&Math.abs(-axisPos(o.u2,sp.y)+0.3*MSPAN)<1);})();
  (function(){ // checkpointed fold === naive fold
    var M1=modelAt(-1),M2=blankModel();for(var i=0;i<ledger.length;i++)applyU(M2,ledger[i]);
    for(var e in M2.edges)if(!M2.thoughts[M2.edges[e].a]||!M2.thoughts[M2.edges[e].b])delete M2.edges[e];
    ok('checkpoint fold \u2261 naive fold',JSON.stringify(M1)===JSON.stringify(M2));})();
  ok('coined props are read-only to invert',!writableProp('degree')&&!writableProp('age_h'));
  ok('layout pure of viewport',(function(){if(!model.order.length)return true;var a=layout(P,model.order,curSpec()),b=layout(P,model.order,curSpec());var id=model.order[0];return a[id].x===b[id].x;})());
  ok('lenses live in the ledger',allSpecs().length>0);
  ok('agent api shape',['add','connect','set','lens','view','layout','delta','coin','seek','fork','export'].every(function(k){return typeof window.atem[k]==='function';}));
  ok('export/import roundtrip',(function(){try{var o=JSON.parse(atemExport());return o.atem===2&&Array.isArray(o.ledger)&&o.v1&&o.v1.atem===1;}catch(e){return false;}})());
  ok('delta returns displacement',(function(){if(model.order.length<1)return true;var sp=allSpecs();if(sp.length<2)return true;var d=deltaOf(sp[0],sp[1]);var id=model.order[0];return d[id]&&typeof d[id].dist==='number';})());
  return out;
}

/* =================================================================

   thought → connection → correction → gap → return. lenses and coins

function Author(daysAgo){
  var L=[],mk=[],t=now()-daysAgo*24*H;
  function say(s,p,v,pr){L.push({m:Math.round(t),s:s,p:p,v:v,prov:pr||'hand'});}
  return {
    L:L,mk:mk,
    base:function(){say('lens:free','spec',{base:1,ord:1,label:'free',sub:'place',kind:'project',x:{slot:'x',map:'direct'},y:{slot:'y',map:'direct'},caption:'<b>a free field.</b> place them wherever feels right.'},'seed');t+=2000;},
    T:function(dt,id,text,color,size,x,y,slots,pr){t+=dt*1000;
      say('t:'+id,'exists',true,pr);say('t:'+id,'text',text,pr);say('t:'+id,'color',color,pr);
      say('t:'+id,'size',size,pr);say('t:'+id,'x',x,pr);say('t:'+id,'y',y,pr);
      if(slots)for(var k in slots)say('t:'+id,k,slots[k],pr);},
    E:function(dt,a,b,label,dir,pr){t+=dt*1000;var id=uid('e');
      say('e:'+id,'exists',true,pr);say('e:'+id,'a',a,pr);say('e:'+id,'b',b,pr);say('e:'+id,'label',label||'',pr);say('e:'+id,'dir',dir==null?1:dir,pr);return id;},
    KE:function(dt,eid){t+=dt*1000;say('e:'+eid,'exists',false);},
    RL:function(dt,eid,label){t+=dt*1000;say('e:'+eid,'label',label);},
    W:function(dt,id,k,v){t+=dt*1000;say('t:'+id,k,v);},
    M:function(dt,id,x,y){t+=dt*1000;say('t:'+id,'x',x);say('t:'+id,'y',y);},
    R:function(dt,id,text){t+=dt*1000;say('t:'+id,'text',text);},
    K:function(dt,id){t+=dt*1000;say('t:'+id,'exists',false);},
    MEAN:function(dt,c,label){t+=dt*1000;say('mean:'+c,'is',label);},
    C:function(dt,n,e){t+=dt*1000;say('coin:'+n,'expr',e);},
    LENS:function(dt,id,sp){t+=dt*1000;say('lens:'+id,'spec',sp);},
    GAP:function(hrs){t+=hrs*H;},
    MARK:function(label){mk.push({at:L.length-1,label:label});}
  };
}

/* =================================================================
   PERSISTENCE — artifact storage first, localStorage mirror. errbar-safe.
   ================================================================= */
var canPersist=true,saveTimer=null,seedv=2;
function bundleOut(){if(activeBoard())activeBoard().pan={x:pan.x,y:pan.y,z:zoom};return JSON.stringify({v:3,seedv:seedv,activeId:activeId,boards:boards});}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    var out=bundleOut();
    try{if(window.storage)window.storage.set('atem-fork',out);}catch(e){}
    try{localStorage.setItem('atem-fork',out);}catch(e){canPersist=false;}
  },350);
}
function loadBundle(){
  return new Promise(function(res){
    function tryLS(){try{var v=localStorage.getItem('atem-fork');if(v)return JSON.parse(v);}catch(e){}return null;}
    try{
      if(window.storage){window.storage.get('atem-fork').then(function(r){
        if(r&&r.value){try{res(JSON.parse(r.value));return;}catch(e){}}
        res(tryLS());
      }).catch(function(){res(tryLS());});return;}
    }catch(e){}
    res(tryLS());
  });
}

/* =================================================================
   BOOT
   ================================================================= */
function tick(){try{drawEdges();}catch(e){}requestAnimationFrame(tick);}
function boot(){
  loadBundle().then(function(saved){
    var firstEver=false;
    try{firstEver=!localStorage.getItem('atem-seen');localStorage.setItem('atem-seen','1');}catch(e){firstEver=true;}
    if(saved&&saved.v===3&&saved.boards&&Object.keys(saved.boards).length){
      boards=saved.boards;activeId=saved.activeId;
      if(!boards[activeId])activeId=Object.keys(boards)[0];
      finish(firstEver&&false);
    } else {
      if(!Object.keys(boards).length)seedAll(false);
      if(!activeId||!boards[activeId])activeId=Object.keys(boards)[0];
      finish(true);
    }
  });
  function finish(coach){
    ledger=boards[activeId].ledger;
    var pz=boards[activeId].pan||{x:0,y:0,z:1};pan={x:pz.x,y:pz.y};zoom=pz.z||1;
    refold();applyPan();booted=true;render();save();
    $('stamp').textContent='fork \u00b7 r1 \u2713'+(canPersist?'':' \u00b7 memory only');
    requestAnimationFrame(tick);
    
  }
}
try{boot();}catch(e){fail('boot \u00b7 '+((e&&e.message)||e));try{seedAll();ledger=boards[activeId].ledger;refold();booted=true;render();$('stamp').textContent='fork \u00b7 recovered';requestAnimationFrame(tick);}catch(_){}}
})();
