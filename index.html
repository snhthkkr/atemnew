<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>atem</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono&display=swap');
:root{--void:#0b0e14;--void2:#0e131b;--panel:#121822;--ink:#dce6f0;--faint:rgba(220,230,240,.5);--ghost:rgba(220,230,240,.2);--line:rgba(180,205,230,.12);--line2:rgba(180,205,230,.22);--signal:#5fe3b0;--t:480ms;--ease:cubic-bezier(.22,.68,0,1);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse 130% 90% at 50% -15%,#10151e 0%,#0b0e14 58%);font-family:'Space Grotesk',-apple-system,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden}
#axes,#edges,#trails{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#axes{z-index:1}#edges{z-index:2}#trails{z-index:4}
#world{position:absolute;inset:0;transform:translate(0px,0px) scale(1);transform-origin:0 0;will-change:transform;z-index:3}
.ax{stroke:rgba(180,205,230,.1);stroke-width:1}
.axlab{fill:var(--ghost);font-family:'Space Mono',monospace;font-size:10px}
.edge{stroke:rgba(170,200,225,.2);stroke-width:1.4;fill:none;stroke-linecap:round}
.edge.hl{stroke:rgba(95,227,176,.6);stroke-width:1.8}
.edge.live{stroke:var(--signal);stroke-width:1.6;stroke-dasharray:5 4;opacity:.9}
.earrow{fill:rgba(170,200,225,.55)}
.elabel{fill:var(--faint);font-family:'Space Mono',monospace;font-size:9.5px}
.trail{stroke:var(--signal);stroke-width:1.2;fill:none;stroke-linecap:round;opacity:0}
.trail.go{animation:fade .85s var(--ease) forwards}
@keyframes fade{0%{opacity:.55}100%{opacity:0}}
.tdot{fill:rgba(95,227,176,.5)}
.node{position:absolute;cursor:grab;transition:left var(--t) var(--ease),top var(--t) var(--ease);z-index:10;touch-action:none}
.node .dot{position:absolute;left:0;top:0;width:var(--d,15px);height:var(--d,15px);margin-left:calc(var(--d,15px)/-2);margin-top:calc(var(--d,15px)/-2);border-radius:50%;background:var(--c,#dce6f0);box-shadow:0 0 0 1.5px var(--void),0 0 0 2.5px rgba(0,0,0,.25);transition:width .3s var(--ease),height .3s var(--ease),box-shadow .2s}
.node .lab{position:absolute;left:14px;top:0;transform:translateY(-50%);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;line-height:1.2;letter-spacing:-.01em;color:var(--ink);background:rgba(11,14,20,.5);padding:3px 8px;border-radius:7px;transition:background .18s,color .18s,opacity .22s var(--ease)}
.node.mute .lab{opacity:0}
.node.mute:hover .lab,.node.hot .lab,.node.sel .lab{opacity:1}
.node.hot{z-index:300}.node.hot .lab{background:rgba(14,20,29,.96);color:#fff}
.node.hot .dot{box-shadow:0 0 0 1.5px var(--signal),0 0 14px rgba(95,227,176,.4)}
.node.sel .dot{box-shadow:0 0 0 1.5px var(--signal),0 0 14px rgba(95,227,176,.5)}
.node.src .dot{box-shadow:0 0 0 2px var(--signal),0 0 0 7px rgba(95,227,176,.22)}
.node.drag{cursor:grabbing}
#lenses{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:5px;background:rgba(14,19,27,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:5px;z-index:40;box-shadow:0 8px 32px rgba(0,0,0,.4);max-width:94vw;overflow-x:auto}
.lens{appearance:none;border:0;background:transparent;color:var(--faint);font-family:inherit;font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:9px;cursor:pointer;transition:background .2s,color .2s;display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.1;white-space:nowrap}
.lens .lk{font-family:'Space Mono',monospace;font-size:8.5px;color:var(--ghost);letter-spacing:.02em}
.lens:hover{color:var(--ink)}
.lens.on{background:rgba(95,227,176,.13);color:var(--signal)}
.lens.on .lk{color:rgba(95,227,176,.6)}
#caption{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);color:var(--faint);font-size:13px;text-align:center;pointer-events:none;z-index:39;transition:opacity .4s;max-width:90vw;letter-spacing:-.01em}
#caption b{color:var(--ink);font-weight:500}
#top{position:fixed;left:16px;top:14px;display:flex;align-items:center;gap:11px;z-index:45}
#menubtn{appearance:none;width:32px;height:32px;border:1px solid var(--line);background:rgba(14,19,27,.6);color:var(--ink);border-radius:9px;cursor:pointer;font-size:15px;line-height:1;transition:.2s}
#menubtn:hover{border-color:var(--line2)}
#brand{font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--ink)}
#bname{font-family:'Space Mono',monospace;font-size:11px;color:var(--ghost)}
#legend{position:fixed;right:16px;top:16px;z-index:40;display:flex;flex-direction:column;gap:5px;align-items:flex-end;max-width:230px}
.lg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--faint);cursor:pointer;background:rgba(14,19,27,.5);padding:4px 9px;border-radius:8px;border:1px solid transparent;transition:.18s}
.lg:hover{border-color:var(--line);color:var(--ink)}
.lg .ld{width:11px;height:11px;border-radius:50%;flex:none}
#legendhint{font-size:10.5px;color:var(--ghost);font-family:'Space Mono',monospace;cursor:pointer;padding:3px 8px;border-radius:7px;transition:.18s}
#legendhint:hover{color:var(--faint)}
#menu{position:fixed;left:0;top:0;bottom:0;width:300px;max-width:84vw;background:var(--void2);border-right:1px solid var(--line2);z-index:80;transform:translateX(-104%);transition:transform .3s var(--ease);padding:18px 16px;overflow-y:auto;box-shadow:14px 0 50px rgba(0,0,0,.5)}
#menu.on{transform:none}
#menuback{position:fixed;inset:0;background:rgba(6,9,13,.4);z-index:79;opacity:0;pointer-events:none;transition:opacity .25s}
#menuback.on{opacity:1;pointer-events:auto}
.msec{margin-bottom:22px}
.mh{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ghost);margin-bottom:9px}
.mitem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--faint);padding:8px 10px;border-radius:9px;cursor:pointer;transition:.15s;border:1px solid transparent}
.mitem:hover{background:rgba(255,255,255,.03);color:var(--ink)}
.mitem.on{color:var(--signal);background:rgba(95,227,176,.08)}
.mitem .mk{margin-left:auto;font-family:'Space Mono',monospace;font-size:9px;color:var(--ghost)}
.mbtn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--faint);font-family:inherit;font-size:12px;padding:7px 11px;border-radius:8px;cursor:pointer;transition:.15s;width:100%;text-align:left;margin-top:4px}
.mbtn:hover{color:var(--ink);border-color:var(--line2)}
.vmkr{margin-top:8px;display:none;background:rgba(8,11,16,.5);border:1px solid var(--line);border-radius:10px;padding:11px}
.vmkr.on{display:block}
.vmkr label{font-size:10.5px;color:var(--ghost);display:block;margin:7px 0 3px}
.vmkr select,.vmkr input{width:100%;background:rgba(8,11,16,.6);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-family:inherit;font-size:12px;padding:6px 7px;outline:none}
.vmkr .vr{display:flex;gap:7px;margin-top:10px}
.vmkr .vr .mbtn{margin-top:0}
#impbox{width:100%;height:70px;background:rgba(8,11,16,.6);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:'Space Mono',monospace;font-size:10px;padding:8px;outline:none;display:none;margin-top:6px}
#scrim{position:fixed;inset:0;background:rgba(6,9,13,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}
#scrim.on{opacity:1;pointer-events:auto}
#editor{position:fixed;z-index:91;width:min(360px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:15px;box-shadow:0 18px 60px rgba(0,0,0,.55);opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);transform-origin:top left}
#editor.on{opacity:1;transform:none;pointer-events:auto}
#etext{width:100%;min-height:64px;resize:none;background:rgba(8,11,16,.6);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:inherit;font-size:14px;line-height:1.45;padding:10px 11px;outline:none}
#etext::placeholder{color:var(--ghost)}#etext:focus{border-color:var(--line2)}
.swatches{display:flex;gap:8px;margin-top:11px}
.sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .14s,border-color .14s}
.sw:hover{transform:scale(1.12)}.sw.on{border-color:var(--ink)}
.dims{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.dim{font-family:'Space Mono',monospace;font-size:10px;color:var(--faint);background:rgba(8,11,16,.5);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.dim b{color:var(--signal);font-weight:400}
.erow{display:flex;gap:8px;margin-top:13px;align-items:center}
.ebtn{appearance:none;border:0;border-radius:9px;padding:8px 14px;font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;transition:.18s}
.eprim{background:var(--signal);color:#06281d}.eprim:hover{filter:brightness(1.08)}
.eghost{background:transparent;color:var(--faint)}.eghost:hover{color:var(--ink)}
.edel{margin-left:auto;color:rgba(224,115,154,.8);background:transparent}.edel:hover{color:#e0739a}
#coach{position:fixed;z-index:60;background:rgba(14,20,29,.95);border:1px solid var(--line2);border-radius:11px;padding:9px 13px;font-size:12.5px;color:var(--ink);max-width:240px;box-shadow:0 8px 28px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s var(--ease);transform:translateY(6px);line-height:1.4}
#coach.on{opacity:1;transform:none}
#coach .ck{display:block;font-family:'Space Mono',monospace;font-size:9.5px;color:var(--signal);margin-top:4px}
#stamp{position:fixed;left:16px;bottom:16px;font-family:'Space Mono',monospace;font-size:9px;color:var(--ghost);z-index:5;letter-spacing:.05em}
#errbar{position:fixed;left:0;right:0;bottom:0;background:#3a0d12;color:#ffd9de;font-family:'Space Mono',monospace;font-size:11px;padding:8px 12px;z-index:999;display:none}
.label-in{position:fixed;z-index:92;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px;display:none}
.label-in input{background:rgba(8,11,16,.6);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-family:inherit;font-size:12px;padding:6px 8px;outline:none;width:150px}
.label-in .dirs{display:flex;gap:4px;margin-top:6px}
.label-in .dirs button{flex:1;background:rgba(8,11,16,.5);color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:5px;cursor:pointer;font-family:inherit}
.label-in .dirs button.on{background:rgba(95,227,176,.15);color:var(--signal);border-color:transparent}
</style>
</head>
<body>
<div id="stage">
  <svg id="axes"></svg><svg id="edges"></svg><svg id="trails"></svg>
  <div id="world"></div>
</div>
<div id="top"><button id="menubtn">&#9776;</button><div id="brand">atem</div><div id="bname"></div></div>
<div id="legend"></div>
<div id="caption"></div>
<div id="lenses"></div>
<div id="coach"></div>
<div id="menuback"></div>
<div id="menu">
  <div class="msec"><div class="mh">boards</div><div id="boardlist"></div><button class="mbtn" id="newboard">+ new blank board</button></div>
  <div class="msec"><div class="mh">views &mdash; a view is just data</div><div id="viewlist"></div><button class="mbtn" id="newview">+ new view</button>
    <div class="vmkr" id="vmkr"><label>name</label><input id="vmname" placeholder="my view">
      <label>horizontal &mdash; read which slot?</label><select id="vmx"></select>
      <label>vertical &mdash; read which slot?</label><select id="vmy"></select>
      <div class="vr"><button class="mbtn" id="vmcreate" style="color:var(--signal)">create</button><button class="mbtn" id="vmcancel">cancel</button></div>
    </div></div>
  <div class="msec"><div class="mh">data &mdash; the same core, as text</div>
    <button class="mbtn" id="exportbtn">&#8675; export .atem</button>
    <button class="mbtn" id="importbtn">&#8673; import .atem</button>
    <textarea id="impbox" placeholder="paste .atem json, then click import again"></textarea>
    <button class="mbtn" id="cleartoggle" style="color:rgba(224,115,154,.8);margin-top:10px">clear this board</button></div>
  <div class="msec"><div class="mh">engine</div><button class="mbtn" id="selftestbtn">run self-test</button>
    <div id="selftestout" style="font-family:'Space Mono',monospace;font-size:10px;color:var(--faint);margin-top:8px"></div></div>
</div>
<div id="scrim"></div>
<div id="editor">
  <textarea id="etext" placeholder="what's on your mind?"></textarea>
  <div class="swatches" id="swatches"></div>
  <div class="dims" id="dims"></div>
  <div class="erow"><button class="ebtn eprim" id="esave">save</button><button class="ebtn eghost" id="ecancel">cancel</button><button class="ebtn edel" id="edel">delete</button></div>
</div>
<div class="label-in" id="labelin"><input id="labeltext" placeholder="name this link&hellip;"><div class="dirs" id="labeldirs"></div></div>
<div id="stamp">resonance &middot; booting&hellip;</div>
<div id="errbar"></div>
<script>
(function(){
"use strict";
/* atem r11 - the engine carve-out.
   CORE   = pure data: thoughts, edges, slots. Knows nothing of pixels.
   LAYOUT = layout(core, spec) -> {id:{x,y}}. A pure function. Renderers are DATA (specs).
   INVERT = drag is the same function run backwards: screen -> solve for slot -> write it.
   DELTA  = diff of two layout() calls. Trivial, because positions are just data now. */
var booted=false;
function fail(m){try{var e=document.getElementById('errbar');e.style.display='block';e.textContent='atem hit a snag: '+m+' - your boards are safe.';}catch(_){}}
window.onerror=function(m,s,l,c,err){fail((err&&err.message)||m);return false;};
window.onunhandledrejection=function(ev){fail((ev&&ev.reason&&ev.reason.message)||'async');};
var $=function(id){return document.getElementById(id);};
function now(){return Date.now();}
function uid(p){return (p||'t')+Math.random().toString(36).slice(2,9);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function r2(n){return Math.round(n*1000)/1000;}

/* ===== THE ENGINE - no DOM, no window, no zoom, no pan. Pure data -> positions. ===== */
var SCALE=96, MSPAN=3.0*96, OSPAN=6*96;
var XF={linear:{to:function(v,lo,hi){return (v-lo)/((hi-lo)||1);},from:function(t,lo,hi){return lo+t*((hi-lo)||1);}}};
function axisPos(v,ax){v=(v==null?0:v);if(ax.map==='direct')return v*SCALE;if(ax.map==='unit')return (clamp(v,0,1)*2-1)*MSPAN;return 0;}
function axisInv(px,ax){if(ax.map==='direct')return r2(px/SCALE);if(ax.map==='unit')return clamp(r2(((px/MSPAN)+1)/2),0,1);return 0;}
function domainOf(core,slot){var lo=Infinity,hi=-Infinity;core.thoughts.forEach(function(t){var v=t.slots[slot];if(typeof v==='number'){if(v<lo)lo=v;if(v>hi)hi=v;}});if(lo===Infinity){lo=0;hi=1;}return {lo:lo,hi:hi};}
function band(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))&255;return ((h/255)-0.5)*200;}
function layout(core,spec){
  var out={},T=core.thoughts;
  if(spec.kind==='project'){T.forEach(function(t){out[t.id]={x:axisPos(t.slots[spec.x.slot],spec.x),y:-axisPos(t.slots[spec.y.slot],spec.y)};});}
  else if(spec.kind==='order'){var slot=spec.x.slot,d=domainOf(core,slot);T.forEach(function(t){var v=t.slots[slot]||0,t01=XF.linear.to(v,d.lo,d.hi);out[t.id]={x:(t01-0.5)*OSPAN,y:band(t.id)};});}
  else if(spec.kind==='nest'){var order=nestOrder(core),n=order.length;order.forEach(function(id,i){out[id]={x:-220+nestDepth(core,id)*42,y:(i-(n-1)/2)*44};});}
  return out;
}
function invert(core,spec,t,ox,oy){
  if(spec.kind==='project'){t.slots[spec.x.slot]=axisInv(ox,spec.x);t.slots[spec.y.slot]=axisInv(-oy,spec.y);return true;}
  if(spec.kind==='order'){var slot=spec.x.slot,d=domainOf(core,slot);t.slots[slot]=XF.linear.from((ox/OSPAN)+0.5,d.lo,d.hi);return true;}
  return false;
}
function specWritable(spec){return spec.kind==='project'||spec.kind==='order';}
function specHasUnitAxis(spec){return spec.kind==='project'&&(spec.x.map==='unit'||spec.y.map==='unit');}
function deltaOf(core,a,b){var A=layout(core,a),B=layout(core,b),out={};for(var id in A){if(B[id])out[id]={dx:B[id].x-A[id].x,dy:B[id].y-A[id].y,dist:Math.hypot(B[id].x-A[id].x,B[id].y-A[id].y)};}return out;}
function nestDepth(core,id){var d=0,t=byIdIn(core,id),g=0;while(t&&t.slots.parent&&g++<50){d++;t=byIdIn(core,t.slots.parent);}return d;}
function nestOrder(core){var roots=core.thoughts.filter(function(t){return !t.slots.parent;}),out=[];function walk(t){out.push(t.id);core.thoughts.filter(function(c){return c.slots.parent===t.id;}).forEach(walk);}roots.forEach(walk);core.thoughts.forEach(function(t){if(out.indexOf(t.id)<0)out.push(t.id);});return out;}
function byIdIn(core,id){for(var i=0;i<core.thoughts.length;i++)if(core.thoughts[i].id===id)return core.thoughts[i];return null;}

/* ===== STATE + view specs (also data) ===== */
var S=null,nodes={},dots={},pan={x:0,y:0},zoom=1,origin={x:0,y:0},HIST=[];
var PALETTE=['#dce6f0','#e0739a','#9b8cdb','#6fa8d0','#f0a868','#5fe3b0'];
function core(){return {thoughts:S.thoughts,edges:S.edges};}
function byId(id){return byIdIn(core(),id);}
var BASE_SPECS=[
  {id:'free',label:'free',sub:'place',kind:'project',x:{slot:'x',map:'direct'},y:{slot:'y',map:'direct'},caption:'<b>a free field.</b> place them wherever feels right.'},
  {id:'matrix',label:'sure \u00d7 soon',sub:'certainty\u00b7urgency',kind:'project',x:{slot:'certainty',map:'unit'},y:{slot:'urgency',map:'unit'},caption:'the same thoughts \u2014 <b>by how sure \u00d7 how soon.</b> drag one to change it.'},
  {id:'time',label:'over time',sub:'time',kind:'order',x:{slot:'time',map:'direct'},caption:'the same thoughts, <b>laid out by when.</b> drag sideways to re-time.'},
  {id:'nest',label:'nest',sub:'parent',kind:'nest',caption:'the same thoughts, <b>nested by what holds what.</b>'}
];
function userSpecs(){try{var v=JSON.parse(localStorage.getItem('atem-specs')||'[]');return Array.isArray(v)?v:[];}catch(e){return [];}}
function saveUserSpecs(a){try{localStorage.setItem('atem-specs',JSON.stringify(a));}catch(e){}}
function allSpecs(){return BASE_SPECS.concat(userSpecs());}
function specById(id){var a=allSpecs();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return BASE_SPECS[0];}
function curSpec(){return specById(S.view);}
var SLOTNAME={x:'free-x',y:'free-y',certainty:'how sure',urgency:'how urgent',time:'when',size:'how big'};
function slotLabel(k){return SLOTNAME[k]||k;}
function numericSlots(){var seen={};S.thoughts.forEach(function(t){for(var k in t.slots){if(typeof t.slots[k]==='number'&&k!=='time'&&k!=='created')seen[k]=1;}});var out=[];for(var k in seen)out.push(k);if(out.indexOf('certainty')<0)out.push('certainty');if(out.indexOf('urgency')<0)out.push('urgency');return out;}

/* ===== BOARDS ===== */
function sl(id,text,color,size,x,y,cert,urg,whenHrs,parent){return {id:id,slots:{text:text,color:color,size:size,x:x,y:y,certainty:cert,urgency:urg,time:now()+whenHrs*3600000,parent:parent||null}};}
function SAMPLES(){return [
  {id:'mind',name:'on my mind',accent:'#5fe3b0',view:'free',meanings:{},thoughts:[
    sl('mom','text mom back\nshe called twice today','#e0739a',1.1,-3.1,1.8,.95,.92,-1,null),
    sl('job','should I take the offer?\nit expires friday','#9b8cdb',1.45,2.1,2.9,.32,.74,-22,null),
    sl('flights','book the flights\nprices keep climbing','#6fa8d0',1.1,1.4,-2.6,.9,.82,-8,null),
    sl('sample','flip the soul-track intro\nthe chipmunk-pitched bit','#f0a868',1.05,3.8,-0.6,.86,.22,-50,null),

var COACH=[{anchor:'lens',text:'these are someone\'s thoughts. switch the lens -',key:'tap "sure \u00d7 soon" \u2193',on:'switched'},{anchor:'center',text:'same thoughts, rearranged. nothing moved in the data - only the lens changed.',key:'drag one to edit it',on:'dragged'},{anchor:'empty',text:'tap any empty space to add your own.',key:'first line is the label',on:'created'}];
function coachStart(){coachStep=0;coachActive=true;setTimeout(showCoach,1100);}
function showCoach(){if(!coachActive||coachStep>=COACH.length){hideCoach();return;}var c=COACH[coachStep],el=$('coach');el.innerHTML=esc(c.text)+'<span class="ck">'+esc(c.key)+'</span>';var x=window.innerWidth/2-120,y=window.innerHeight-150;if(c.anchor==='center')y=window.innerHeight/2-40;else if(c.anchor==='empty'){x=24;y=window.innerHeight/2;}el.style.left=clamp(x,12,window.innerWidth-256)+'px';el.style.top=y+'px';el.classList.add('on');}
function hideCoach(){$('coach').classList.remove('on');coachActive=false;}
function coachAdvance(ev){if(!coachActive)return;if(COACH[coachStep]&&COACH[coachStep].on===ev){coachStep++;$('coach').classList.remove('on');setTimeout(showCoach,420);}}
window.addEventListener('resize',function(){if(S)render();});

/* ===== AGENT SEAM ===== */
window.atem={
  state:function(){return JSON.parse(JSON.stringify(stateOut()));},
  add:function(o){o=o||{};snap();var id=o.id||uid();S.thoughts.push({id:id,slots:{text:o.text||'',color:o.color||'#dce6f0',size:o.size||1,time:o.time||now(),x:o.x||0,y:o.y||0,certainty:o.certainty==null?.6:o.certainty,urgency:o.urgency==null?.5:o.urgency,parent:o.parent||null}});save();render();return id;},
  connect:function(a,b,label,dir){snap();S.edges.push([a,b,label||'',dir==null?1:dir]);save();render();return true;},
  set:function(id,slot,val){var t=byId(id);if(!t)return false;snap();t.slots[slot]=val;save();render();return true;},
  mean:function(color,m){snap();S.meanings=S.meanings||{};if(m)S.meanings[color]=m;else delete S.meanings[color];save();render();return true;},
  specs:function(){return allSpecs().map(function(s){return {id:s.id,label:s.label,kind:s.kind,reads:s.kind==='project'?[s.x.slot,s.y.slot]:s.kind==='order'?[s.x.slot]:'parent'};});},
  lens:function(id){switchLens(id);return id;},
  view:function(spec){if(!spec||!spec.kind)return null;spec.id=spec.id||uid('v');var us=userSpecs();us.push(spec);saveUserSpecs(us);buildLenses();return spec.id;},
  layout:function(id){return layout(core(),specById(id));},
  delta:function(a,b){return deltaOf(core(),specById(a),specById(b));},
  export:atemExport,import:atemImport,
  _selftest:function(){return selfTest();}
};

/* ===== SELF-TEST (runtime, side-effect-free) ===== */
function selfTest(){
  var out=[];function ok(n,c){out.push({name:n,ok:!!c});}
  var c=core();
  (function(){var sp=specById('free'),t={id:'q',slots:{}};invert(c,sp,t,2*SCALE,-3*SCALE);var pos=layout({thoughts:[t]},sp).q;ok('free round-trip',Math.abs(pos.x-2*SCALE)<1&&Math.abs(pos.y+3*SCALE)<1);})();
  (function(){var sp=specById('matrix'),t={id:'q',slots:{}};invert(c,sp,t,0.4*MSPAN,-0.3*MSPAN);var pos=layout({thoughts:[t]},sp).q;ok('matrix round-trip',Math.abs(pos.x-0.4*MSPAN)<1&&Math.abs(pos.y+0.3*MSPAN)<1);})();
  (function(){var d=deltaOf(c,specById('free'),specById('matrix'));ok('delta returns per-thought displacement',S.thoughts.length>0&&!!d[S.thoughts[0].id]&&typeof d[S.thoughts[0].id].dist==='number');})();
  ok('layout pure of viewport',(function(){var a=layout(c,curSpec()),b=layout(c,curSpec()),id=S.thoughts[0].id;return a[id].x===b[id].x;})());
  ok('every base spec resolvable',BASE_SPECS.every(function(s){return !!s.kind;}));
  ok('writable lenses accept invert',['free','matrix','time'].every(function(id){return specWritable(specById(id));}));
  ok('agent api shape',['add','connect','set','lens','view','layout','delta','export'].every(function(k){return typeof window.atem[k]==='function';}));
  ok('export/import roundtrip',(function(){try{var o=JSON.parse(atemExport());return o.atem===1&&Array.isArray(o.thoughts);}catch(e){return false;}})());
  return out;
}

/* ===== BOOT ===== */
function tick(){try{drawEdges();}catch(e){}requestAnimationFrame(tick);}
async function boot(){
  await openDB();var last=await loadLast(),firstEver=false;
  try{firstEver=!localStorage.getItem('atem-seen');localStorage.setItem('atem-seen','1');}catch(e){firstEver=true;}
  if(last&&last.thoughts&&!firstEver){S={boardId:last.boardId,name:last.name,accent:last.accent,view:last.view||'free',meanings:last.meanings||{},thoughts:last.thoughts,edges:last.edges};render();}
  else{loadBoard(SAMPLES()[0]);}
  applyPan();$('stamp').textContent='resonance \u00b7 r11 \u2713'+(canPersist?'':' \u00b7 memory only');booted=true;requestAnimationFrame(tick);
  if(firstEver||!last)coachStart();
}
boot().catch(function(e){fail('boot \u00b7 '+((e&&e.message)||e));try{loadBoard(SAMPLES()[0]);applyPan();$('stamp').textContent='resonance \u00b7 r11 \u00b7 recovered';requestAnimationFrame(tick);}catch(_){}});
})();
</script>
