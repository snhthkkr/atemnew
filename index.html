<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">

<title>atem</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ─── Editor ─── */
#editor{
  position:fixed;display:none;z-index:100;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(340px,88vw);
  max-height:calc(100vh - 80px);
  max-height:calc(100dvh - 80px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:rgba(10,10,15,0.95);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px;padding:16px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
#editor.open{display:block}
#editor textarea{
  -webkit-user-select:text;user-select:text;
  width:100%;min-height:80px;max-height:200px;
  background:transparent;border:none;outline:none;
  color:#fff;font-size:16px;line-height:1.5;
  font-family:inherit;resize:none;
}
#editor textarea::placeholder{color:rgba(255,255,255,0.25)}#ed-color-btn{
  width:20px;height:20px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.2);
  cursor:pointer;position:absolute;top:16px;right:16px;
  transition:transform 0.15s;z-index:5;
}
#ed-color-btn:active{transform:scale(0.9)}
#ed-color-palette{
  position:absolute;top:42px;right:16px;
  background:rgba(15,15,20,0.98);border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:8px;display:none;gap:6px;
  backdrop-filter:blur(20px);z-index:10;
}
#ed-color-palette.open{display:flex}
.ed-color-swatch{
  width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2px solid rgba(255,255,255,0.15);transition:transform 0.1s;
}
.ed-color-swatch:active{transform:scale(0.85)}
#editor-actions{
  display:flex;justify-content:flex-end;gap:8px;
  margin-top:12px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,0.06);
}
#editor-actions button{
  background:rgba(255,255,255,0.08);border:none;
  color:rgba(255,255,255,0.7);font-size:13px;
  padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit;
}
#editor-actions button:active{background:rgba(255,255,255,0.15)}
#editor-actions .save{color:#fff;background:rgba(255,255,255,0.15)}
#del-btn{color:rgba(255,100,100,0.8)}

/* ─── Connection editor ─── */
#conn-editor{
  position:fixed;display:none;z-index:120;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(320px,88vw);
  background:rgba(10,10,15,0.96);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px;padding:14px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
#conn-editor.open{display:block}
#conn-editor-title{font-size:12px;color:rgba(255,255,255,0.3);margin-bottom:10px;letter-spacing:0.05em}
#conn-preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.conn-preset{
  padding:5px 10px;border-radius:14px;font-size:11px;
  border:1px solid rgba(255,255,255,0.1);cursor:pointer;
  background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);
  transition:all 0.12s;white-space:nowrap;font-family:inherit;
}
.conn-preset:active{transform:scale(0.95)}
.conn-preset.active{border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.9);background:rgba(255,255,255,0.08)}
#conn-custom-input{
  width:100%;background:transparent;border:none;
  border-bottom:1px solid rgba(255,255,255,0.1);
  color:#fff;font-size:13px;padding:6px 0;outline:none;
  font-family:inherit;margin-bottom:10px;
  -webkit-user-select:text;user-select:text;
}
#conn-custom-input::placeholder{color:rgba(255,255,255,0.2)}
#conn-color-row{display:flex;gap:6px;margin-bottom:12px;align-items:center}
#conn-color-row .conn-cswatch{
  width:22px;height:22px;border-radius:50%;cursor:pointer;
  border:2px solid rgba(255,255,255,0.1);transition:transform 0.1s;
}
#conn-color-row .conn-cswatch:active{transform:scale(0.85)}
#conn-color-row .conn-cswatch.active{border-color:rgba(255,255,255,0.5)}
#conn-editor-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06)}
#conn-editor-actions button{
  background:rgba(255,255,255,0.08);border:none;
  color:rgba(255,255,255,0.7);font-size:13px;
  padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit;
}
#conn-editor-actions button:active{background:rgba(255,255,255,0.15)}
#conn-editor-actions .conn-del-btn{color:rgba(255,100,100,0.8)}
#conn-editor-actions .conn-done-btn{color:#fff;background:rgba(255,255,255,0.15)}

/* ─── Menu button (bottom-center) ─── */
#menu-btn{
  position:fixed;
  bottom:max(24px,env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:90;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#menu-btn:active{background:rgba(255,255,255,0.15)}
#menu-btn svg{width:16px;height:16px;opacity:0.6;pointer-events:none}

/* ─── Menu drawer ─── */
#menu-scrim{position:fixed;inset:0;z-index:9989;display:none;background:rgba(0,0,0,0.4)}
#menu-scrim.open{display:block}
#menu-drawer{
  position:fixed;top:0;left:0;bottom:0;
  width:min(260px,80vw);
  background:rgba(10,10,15,0.97);
  border-right:1px solid rgba(255,255,255,0.08);
  z-index:9990;
  transform:translateX(-100%);
  transition:transform 0.25s cubic-bezier(0.32,0.72,0,1);
  display:flex;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top,0px)) 0 max(16px,env(safe-area-inset-bottom,0px));
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
#menu-drawer.open{transform:translateX(0)}
#menu-drawer .menu-header{
  padding:4px 16px 14px;margin-bottom:4px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
#menu-drawer .menu-header .mh-label{
  font-size:9px;color:rgba(255,255,255,0.25);
  letter-spacing:0.14em;text-transform:uppercase;
  margin-bottom:4px;
}
#menu-drawer .menu-header .mh-name{
  font-size:15px;color:rgba(255,255,255,0.85);
  font-weight:500;letter-spacing:0.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#menu-drawer .menu-header .mh-count{
  font-size:11px;color:rgba(255,255,255,0.35);
  margin-top:2px;font-variant-numeric:tabular-nums;
}
#menu-drawer .sep{
  margin:6px 16px;font-size:10px;color:rgba(255,255,255,0.15);
  letter-spacing:0.12em;text-transform:uppercase;padding-top:8px;
}
#menu-drawer button{
  display:flex;align-items:center;
  width:100%;text-align:left;background:none;border:none;
  color:rgba(255,255,255,0.55);font-size:13px;
  padding:11px 16px;cursor:pointer;font-family:inherit;
}
#menu-drawer button:active{background:rgba(255,255,255,0.05)}
#menu-drawer .danger{color:rgba(255,100,100,0.55)}
/* iOS-style pill toggle (replaces old 7px dot) */
#menu-drawer .pill{
  width:30px;height:18px;border-radius:999px;
  background:rgba(255,255,255,0.12);margin-left:auto;flex-shrink:0;
  position:relative;transition:background 0.18s ease;
}
#menu-drawer .pill::after{
  content:'';position:absolute;top:2px;left:2px;
  width:14px;height:14px;border-radius:50%;
  background:rgba(255,255,255,0.92);
  transition:transform 0.18s cubic-bezier(0.32,0.72,0,1);
}
#menu-drawer .pill.on{background:rgba(110,168,254,0.9)}
#menu-drawer .pill.on::after{transform:translateX(12px)}

/* ─── Lasso ─── */
#lasso-rect{position:fixed;display:none;z-index:70;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.03);pointer-events:none;border-radius:2px}
#lasso-bar{
  position:fixed;display:none;z-index:110;
  bottom:max(84px,calc(env(safe-area-inset-bottom,0px)+76px));
  left:50%;transform:translateX(-50%);
  background:rgba(10,10,15,0.95);border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:6px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);gap:4px;
}
#lasso-bar.open{display:flex}
#lasso-bar button{
  background:rgba(255,255,255,0.06);border:none;color:rgba(255,255,255,0.7);
  font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;
}
#lasso-bar button:active{background:rgba(255,255,255,0.12)}

/* ─── Starter Gallery ─── */
#gallery-overlay{
  position:fixed;inset:0;z-index:9995;display:none;
  background:rgba(0,0,0,0.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  flex-direction:column;
  padding:max(20px,env(safe-area-inset-top,0px)) 0 max(20px,env(safe-area-inset-bottom,0px));
}
#gallery-overlay.open{display:flex}
#gallery-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 24px 20px;flex-shrink:0;
}
#gallery-title{font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:0.15em;text-transform:uppercase}
#gallery-close{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.4);font-size:13px;cursor:pointer;
  padding:6px 14px;border-radius:8px;font-family:inherit;
}
#gallery-close:active{background:rgba(255,255,255,0.12);color:#fff}
#gallery-grid{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 20px 20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));
  gap:12px;
  align-content:start;
}
.gcard{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;padding:20px;
  cursor:pointer;transition:all 0.15s;
  position:relative;overflow:hidden;
}
.gcard::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--accent);opacity:0.7;
  border-radius:16px 16px 0 0;
}
.gcard:active{transform:scale(0.97);background:rgba(255,255,255,0.06)}
.gcard-name{
  font-size:15px;color:rgba(255,255,255,0.9);
  margin-bottom:8px;line-height:1.3;font-weight:400;
}
.gcard-desc{font-size:12px;color:rgba(255,255,255,0.35);line-height:1.6}
.gcard-meta{
  display:flex;gap:6px;margin-top:14px;align-items:center;
}
.gcard-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);opacity:0.6;flex-shrink:0;
}
.gcard-nodes{font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:0.05em}

/* ─── Board Slots ─── */
#boards-overlay{
  position:fixed;inset:0;z-index:9993;display:none;
  background:rgba(0,0,0,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  flex-direction:column;
  padding:max(20px,env(safe-area-inset-top,0px)) 0 max(20px,env(safe-area-inset-bottom,0px));
}
#boards-overlay.open{display:flex}
#boards-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 24px 20px;flex-shrink:0;
}
#boards-heading{font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:0.15em;text-transform:uppercase}
#boards-close{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.4);font-size:13px;cursor:pointer;
  padding:6px 14px;border-radius:8px;font-family:inherit;
}
#boards-close:active{background:rgba(255,255,255,0.12)}
#boards-grid{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 20px 20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(180px,45vw),1fr));
  gap:12px;align-content:start;
}
.bcard{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;overflow:hidden;cursor:pointer;
  transition:all 0.15s;
}
.bcard.active{border-color:rgba(110,168,254,0.5)}
.bcard:active{transform:scale(0.97)}
.bcard-thumb{
  width:100%;aspect-ratio:16/10;
  background:#050508;
  position:relative;overflow:hidden;
}
.bcard-thumb canvas{width:100%!important;height:100%!important;object-fit:cover}
.bcard-thumb-empty{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,0.08);font-size:11px;letter-spacing:0.08em;
}
.bcard-info{padding:10px 12px 12px}
.bcard-name{
  font-size:13px;color:rgba(255,255,255,0.8);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:3px;
}
.bcard.active .bcard-name{color:#6ea8fe}
.bcard-count{font-size:11px;color:rgba(255,255,255,0.22)}
.bcard-rename{
  display:block;width:100%;text-align:left;
  background:none;border:none;border-top:1px solid rgba(255,255,255,0.05);
  color:rgba(255,255,255,0.2);font-size:11px;
  cursor:pointer;padding:7px 12px;font-family:inherit;
  transition:color 0.1s;
}
.bcard-rename:active{color:rgba(255,255,255,0.6)}

/* ─── Rich Editor (title-above-body, always on) ─── */
#ed-body{
  -webkit-user-select:text;user-select:text;
  width:100%;min-height:72px;max-height:200px;
  background:transparent;border:none;outline:none;
  color:#fff;font-size:16px;line-height:1.6;
  font-family:inherit;resize:none;
  padding-top:10px;
}
#ed-body::placeholder{color:rgba(255,255,255,0.22)}
#ed-title-row{
  padding-bottom:8px;
  border-bottom:1px solid rgba(255,255,255,0.07);
}
#ed-title{
  -webkit-user-select:text;user-select:text;
  width:100%;background:transparent;border:none;outline:none;
  color:rgba(255,255,255,0.72);font-size:13px;
  font-family:inherit;padding:0 40px 0 0;letter-spacing:0.02em;
  font-weight:500;
}
#ed-title::placeholder{color:rgba(255,255,255,0.2);font-weight:400}
#fps{
  position:fixed;top:max(16px,env(safe-area-inset-top,0px));right:16px;
  font-size:10px;color:rgba(255,255,255,0.2);
  font-variant-numeric:tabular-nums;pointer-events:none;display:none;z-index:85;
}
#fps.on{display:block}

/* ─── Hint ─── */
#hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,0.08);font-size:14px;pointer-events:none;transition:opacity 0.8s ease}

/* ─── Toast ─── */
#toast{
  position:fixed;top:max(16px,env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%) translateY(-40px);
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:8px 16px;color:rgba(255,255,255,0.7);font-size:13px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transition:all 0.3s ease;z-index:200;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── Idle chip: surfaces gallery without forcing it ─── */
#idle-chip{
  position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(8px);
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:999px;padding:9px 16px;color:rgba(255,255,255,0.55);font-size:12px;
  letter-spacing:0.02em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transition:opacity 0.6s ease, transform 0.6s ease;
  z-index:90;pointer-events:none;cursor:pointer;
}
#idle-chip.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#idle-chip:active{background:rgba(255,255,255,0.1)}
</style>

<body>
<canvas id="c"></canvas>
<div id="hint">tap anywhere</div>
<div id="idle-chip">start from a template →</div>

<!-- Editor -->
<div id="editor">
  <!-- Title: always visible, small, optional. No more mode toggle. -->
  <div id="ed-title-row">
    <input id="ed-title" type="text" placeholder="title (optional)" autocomplete="off" autocorrect="on" spellcheck="true">
  </div>
  <!-- Body: the thing you actually type into -->
  <textarea id="ed-body" placeholder="think..." autocomplete="off" autocorrect="on" spellcheck="true"></textarea>
  <button id="ed-color-btn" title="change color"></button>
  <div id="ed-color-palette"></div>
  <div id="editor-actions">
    <button id="del-btn">delete</button>
    <button id="cancel-btn">cancel</button>
    <button class="save" id="save-btn">done</button>
  </div>
</div>

<!-- Connection editor -->
<div id="conn-editor">
  <div id="conn-editor-title">connection</div>
  <div id="conn-preset-row"></div>
  <input id="conn-custom-input" type="text" placeholder="or type your own..." autocomplete="off">
  <div id="conn-color-row"></div>
  <div id="conn-editor-actions">
    <button class="conn-del-btn" id="conn-del-btn">remove</button>
    <button id="conn-dir-btn" style="color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.06);border:none;font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit">→ directed</button>
    <button class="conn-done-btn" id="conn-done-btn">done</button>
  </div>
</div>

<!-- Menu -->
<button id="menu-btn" aria-label="menu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <line x1="4" y1="8" x2="20" y2="8"/>
    <line x1="4" y1="12" x2="20" y2="12"/>
    <line x1="4" y1="16" x2="20" y2="16"/>
  </svg>
</button>
<div id="menu-scrim"></div>
<div id="menu-drawer">
  <div class="menu-header">
    <div class="mh-label">current board</div>
    <div class="mh-name" id="m-header-name">Board 1</div>
    <div class="mh-count" id="m-header-count">0 thoughts</div>
  </div>
  <div class="sep">boards</div>
  <button id="m-boards">switch board</button>
  <div class="sep">start</div>
  <button id="m-gallery">start from a board</button>
  <div class="sep">data</div>
  <button id="m-export">export</button>
  <button id="m-import">import</button>
  <div class="sep">view</div>
  <button id="m-reset-view">reset camera</button>
  <button id="m-toggle-fps">fps <span class="pill" id="m-fps-dot"></span></button>
  <button id="m-open-capture">open to capture <span class="pill" id="m-capture-dot"></span></button>
  <div class="sep">dev</div>
  <button id="m-dump">dump state</button>
  <button id="m-orphans">highlight orphans</button>
  <button id="m-bulk">+ 100 test</button>
  <div class="sep"></div>
  <button id="m-clear" class="danger">clear all</button>
  <div style="font-size:9px;color:rgba(255,255,255,0.15);padding:12px 16px 0;margin-top:auto">atem v21</div>
</div>

<!-- Starter Gallery (full-screen) -->
<div id="gallery-overlay">
  <div id="gallery-header">
    <span id="gallery-title">start from a board</span>
    <button id="gallery-close">close</button>
  </div>
  <div id="gallery-grid"></div>
</div>

<!-- Board Slots -->
<div id="boards-overlay">
  <div id="boards-header">
    <span id="boards-heading">your boards</span>
    <button id="boards-close">done</button>
  </div>
  <div id="boards-grid"></div>
</div>

<!-- Lasso -->
<div id="lasso-rect"></div>
<div id="lasso-bar">
  <button id="lasso-recolor">recolor</button>
  <button id="lasso-clear">clear</button>
</div>

<!-- FPS -->
<div id="fps"></div>

const sphereGeo = new THREE.SphereGeometry(SPHERE_RADIUS, 24, 18);

function makeThoughtMaterial(color) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color||'#6ea8fe'),
    emissive: new THREE.Color(color||'#6ea8fe'),
    emissiveIntensity:0.15, roughness:0.4, metalness:0.1,
    transparent:true, opacity:0.9,
  });
}

// Unified label — one primary line (title if set, else first line of body).
// If title is the primary AND body also exists, draw a small '···' glyph beneath
// to signal "more inside". One label, one canvas, no awkward two-height layouts.
function createLabel(text, bodyText) {
  const title = (text || '').trim();
  const body = (bodyText || '').trim();
  let primary = '';
  let hasMore = false;
  if (title) {
    primary = title;
    hasMore = body.length > 0; // body exists alongside title → show ··· glyph
  } else if (body) {
    const first = body.split('\n')[0];
    primary = first;
  } else {
    return null;
  }

  const c = document.createElement('canvas');
  c.width = 1024; c.height = hasMore ? 200 : 160;
  const ctx = c.getContext('2d');
  ctx.scale(2, 2);
  ctx.clearRect(0, 0, 512, c.height / 2);

  ctx.fillStyle = 'rgba(255,255,255,0.82)';
  ctx.font = '300 24px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let display = primary.length > 80 ? primary.slice(0, 78) + '…' : primary;
  let lines = [], line = '';
  for (const w of display.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > 460) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  if (lines.length > 2) lines = lines.slice(0, 2);
  const lineH = 30;
  const blockH = lines.length * lineH;
  const centerY = hasMore ? 36 : (c.height / 4) - blockH/2 + lineH/2;
  const startY = centerY;
  lines.forEach((l, i) => ctx.fillText(l, 256, startY + i * lineH));

  if (hasMore) {
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    ctx.font = '300 14px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText('···', 256, startY + blockH + 6);
  }

  const tex = new THREE.CanvasTexture(c); tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.88, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  // Texture aspect: 1024 / c.height → sprite scale y = 3 * (c.height / 1024 * ~2)
  // Keep label width visually ~3 world units; height follows canvas aspect.
  const aspectScale = (c.height / 1024) * 3;
  sprite.scale.set(3, aspectScale, 1);
  sprite.position.y = -SPHERE_RADIUS - 0.48;
  sprite.userData.hasMore = hasMore;
  return sprite;
}

function addThoughtMesh(t) {
  const mat = makeThoughtMaterial(t.color);
  const mesh = new THREE.Mesh(sphereGeo, mat);
  mesh.position.set(t.position[0], t.position[1], t.position[2]);
  const size = t.size || 1.0;
  mesh.userData = { id:t.id, targetEmissive:0.15, targetOpacity:0.9, breath:Math.random()*Math.PI*2, baseSize:size, bounceStart:0 };
  mesh.scale.setScalar(size);
  const l = createLabel(t.text || '', t.body || '');
  if (l) { l.name = 'label'; mesh.add(l); }
  thoughtGroup.add(mesh);
  meshMap.set(t.id, mesh);
  return mesh;
}

function updateLabel(mesh, text, body) {
  const old = mesh.getObjectByName('label');
  if (old) mesh.remove(old);
  const l = createLabel(text || '', body || '');
  if (l) { l.name = 'label'; mesh.add(l); }
}

function getMesh(id) { return meshMap.get(id); }

// ═══════════════════════════════════════════
// CONNECTIONS
// ═══════════════════════════════════════════

function createConnLabel(text, color) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.scale(2, 2);
  ctx.clearRect(0, 0, 256, 64);
  ctx.fillStyle = color || 'rgba(255,255,255,0.55)';
  ctx.font = '500 16px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let display = text || '';
  if (display.length > 24) display = display.slice(0, 22) + '…';
  ctx.fillText(display, 128, 32);
  const tex = new THREE.CanvasTexture(c); tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, opacity:0.7, depthTest:false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2.0, 0.5, 1);
  return sprite;
}

function rebuildConnections() {
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  const pairs = {};
  for (const c of state.connections) { const key = [c.from, c.to].sort().join('|'); pairs[key] = (pairs[key]||0) + 1; }
  const drawn = new Set();
  for (const c of state.connections) {
    const key = [c.from, c.to].sort().join('|');
    if (drawn.has(key)) continue; drawn.add(key);
    const mA = getMesh(c.from), mB = getMesh(c.to);
    if (!mA || !mB) continue;
    const density = pairs[key]||1;
    const connColor = c.color || '#6ea8fe';
    const baseOpacity = Math.min(0.35 + density*0.1, 0.75);
    const geo = new THREE.BufferGeometry().setFromPoints([mA.position.clone(), mB.position.clone()]);
    const mat = new THREE.LineBasicMaterial({ color: new THREE.Color(connColor), transparent:true, opacity:baseOpacity });
    const line = new THREE.Line(geo, mat);
    const firstConn = state.connections.find(x => [x.from, x.to].sort().join('|') === key);
    line.userData = { from:c.from, to:c.to, density, connKey:key, connId:firstConn?.id, baseOpacity };
    lineGroup.add(line);

    // Directional arrow — two short angled lines forming a fork at target
    if (c.directed) {
      const dir = new THREE.Vector3().subVectors(mB.position, mA.position);
      const len = dir.length();
      if (len > 0.1) {
        const norm = dir.clone().normalize();

        // Bug 3: scale arm length with connection length (short connections don't get giant arrows)
        const armLen = Math.min(Math.max(len * 0.12, 0.25), 0.6);
        const spread = armLen * 0.55;

        const arrowTip = mB.position.clone().sub(norm.clone().multiplyScalar(SPHERE_RADIUS + 0.08));
        const arrowBase = arrowTip.clone().sub(norm.clone().multiplyScalar(armLen));

        // Bug 3: camera-right basis so near-vertical arrows don't collapse
        const camDir = camera.getWorldDirection(new THREE.Vector3());
        let perp = new THREE.Vector3().crossVectors(camDir, norm).normalize();
        if (perp.length() < 0.1) perp = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), norm).normalize();
        if (perp.length() < 0.1) perp = new THREE.Vector3().crossVectors(new THREE.Vector3(1, 0, 0), norm).normalize();

        const forkL = arrowBase.clone().add(perp.clone().multiplyScalar(spread));
        const forkR = arrowBase.clone().sub(perp.clone().multiplyScalar(spread));

        const arrowColor = new THREE.Color(connColor);
        const arrowOpacity = Math.min(baseOpacity + 0.25, 0.95);

        for (const forkPt of [forkL, forkR]) {
          const geo = new THREE.BufferGeometry().setFromPoints([arrowTip.clone(), forkPt]);
          const mat = new THREE.LineBasicMaterial({ color: arrowColor, transparent: true, opacity: arrowOpacity });
          const fork = new THREE.Line(geo, mat);
          fork.userData = { isArrow: true, from: c.from, to: c.to, connKey: key, isLeft: forkPt === forkL };
          lineGroup.add(fork);
        }
      }
    }

    const label = c.label || (density > 1 ? `×${density}` : null);
    if (label) {
      const mid = new THREE.Vector3().addVectors(mA.position, mB.position).multiplyScalar(0.5);
      const sprite = createConnLabel(label, connColor);
      sprite.position.copy(mid);
      sprite.position.y += 0.25;
      sprite.userData = { isConnLabel: true, connKey: key };
      lineGroup.add(sprite);
    }
  }
  needsRender = true;
}

// Scratch vectors reused every frame to avoid GC churn in the hot path
const _camDir = new THREE.Vector3();
const _dir = new THREE.Vector3();
const _norm = new THREE.Vector3();
const _perp = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);
const _right = new THREE.Vector3(1, 0, 0);
const _arrowTip = new THREE.Vector3();
const _arrowBase = new THREE.Vector3();
const _forkPt = new THREE.Vector3();
const _scratch = new THREE.Vector3();

function updateConnectionPositions() {
  // Hoist camDir: computed once per frame instead of per-arrow.
  // On boards with many directed connections this saves ~N allocations/frame.
  let camDirComputed = false;
  for (const child of lineGroup.children) {
    if (child.userData.isConnLabel) {
      const parts = child.userData.connKey.split('|');
      const mA = getMesh(parts[0]), mB = getMesh(parts[1]);
      if (mA && mB) {
        child.position.set(
          (mA.position.x + mB.position.x) / 2,
          (mA.position.y + mB.position.y) / 2 + 0.25,
          (mA.position.z + mB.position.z) / 2
        );
      }
      continue;
    }
    if (child.userData.isArrow) {
      const mA = getMesh(child.userData.from), mB = getMesh(child.userData.to);
      if (mA && mB) {
        _dir.subVectors(mB.position, mA.position);
        const len = _dir.length();
        if (len > 0.1) {
          _norm.copy(_dir).normalize();
          // Bug 3: arm length scales with connection length
          const armLen = Math.min(Math.max(len * 0.12, 0.25), 0.6);
          const spread = armLen * 0.55;
          _arrowTip.copy(mB.position).sub(_scratch.copy(_norm).multiplyScalar(SPHERE_RADIUS + 0.08));
          _arrowBase.copy(_arrowTip).sub(_scratch.copy(_norm).multiplyScalar(armLen));
          // Bug 3: camera-right basis — computed once per frame, not per arrow
          if (!camDirComputed) { camera.getWorldDirection(_camDir); camDirComputed = true; }
          _perp.crossVectors(_camDir, _norm).normalize();
          if (_perp.length() < 0.1) _perp.crossVectors(_up, _norm).normalize();
          if (_perp.length() < 0.1) _perp.crossVectors(_right, _norm).normalize();
          if (child.userData.isLeft) {
            _forkPt.copy(_arrowBase).add(_scratch.copy(_perp).multiplyScalar(spread));
          } else {
            _forkPt.copy(_arrowBase).sub(_scratch.copy(_perp).multiplyScalar(spread));
          }
          const pos = child.geometry.attributes.position;
          pos.setXYZ(0, _arrowTip.x, _arrowTip.y, _arrowTip.z);
          pos.setXYZ(1, _forkPt.x, _forkPt.y, _forkPt.z);
          pos.needsUpdate = true;
        }
      }
      continue;
    }
    if (!child.userData.from) continue;
    const mA = getMesh(child.userData.from), mB = getMesh(child.userData.to);
    if (!mA || !mB) continue;
    const pos = child.geometry.attributes.position;
    pos.setXYZ(0, mA.position.x, mA.position.y, mA.position.z);
    pos.setXYZ(1, mB.position.x, mB.position.y, mB.position.z);
    pos.needsUpdate = true;
  }
}

// Bug 6: debounce sync — 1 POST per 3s max. State ref is stable (fields mutated,
// not object replaced), so pending payload naturally resolves to latest state.
let supabaseSyncTimer = null;
let supabasePending = null;
function scheduleSupabaseSync(boardId, data) {
  supabasePending = { boardId, data };
  if (supabaseSyncTimer) return; // already in flight window
  supabaseSyncTimer = setTimeout(() => {
    const p = supabasePending;
    supabaseSyncTimer = null;
    supabasePending = null;
    if (p) syncToSupabase(p.boardId, p.data).catch(() => {});
  }, 3000);
}

async function syncToSupabase(boardId, data) {
  if (!SUPABASE_URL || !SUPABASE_KEY) return;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/boards`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({
        id: boardId,
        name: data.boardName || boardId,
        data: data,
        updated_at: new Date().toISOString()
      })
    });
  } catch(e) { console.warn('supabase sync failed', e); }
}

async function loadFromSupabase(boardId) {
  if (!SUPABASE_URL || !SUPABASE_KEY) return null;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/boards?id=eq.${boardId}&select=data`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
      }
    });
    const rows = await res.json();
    if (rows && rows[0] && rows[0].data) return rows[0].data;
  } catch(e) { console.warn('supabase load failed', e); }
  return null;
}

async function save() {
  state.camera = {
    px:camera.position.x,py:camera.position.y,pz:camera.position.z,
    tx:controls.target.x,ty:controls.target.y,tz:controls.target.z
  };
  const key = 'atem-' + state.boardId;
  try { await set(key, state); } catch(e) { console.warn('idb save failed', e); }
  try { localStorage.setItem(key+'-backup', JSON.stringify(state)); } catch(e){}

  // Registry
  const registry = await getBoardRegistry();
  const idx = registry.findIndex(b => b.id === state.boardId);
  const entry = { id: state.boardId, name: state.boardName, count: state.thoughts.length, updated: Date.now() };
  if (idx >= 0) registry[idx] = entry; else registry.push(entry);
  try { await set('atem-boards', registry); } catch(e) {}

  // Supabase sync (debounced, non-blocking)
  scheduleSupabaseSync(state.boardId, state);
}

async function getBoardRegistry() {
  try {
    const r = await get('atem-boards');
    if (r && Array.isArray(r)) return r;
  } catch(e) {}
  // Bootstrap 5 slots
  return [
    { id:'board-1', name:'Board 1', count:0, updated:0 },
    { id:'board-2', name:'Board 2', count:0, updated:0 },
    { id:'board-3', name:'Board 3', count:0, updated:0 },
    { id:'board-4', name:'Board 4', count:0, updated:0 },
    { id:'board-5', name:'Board 5', count:0, updated:0 },
  ];
}

async function loadBoard(boardId) {
  // Close any open editors first — editingId would point to a thought that's about to be cleared.
  if (editingId) closeEditor(true);
  if (editingConnId) closeConnEditor();
  // Save current board first
  if (state.thoughts.length > 0 || state.connections.length > 0) await save();

  // Clear scene
  while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  thoughtMap.clear(); meshMap.clear();

  // Reset state (preserve settings)
  const richMode = state.richMode;
  const openToCapture = state.openToCapture;
  state.thoughts = [];
  state.connections = [];
  state.boardId = boardId;
  state.richMode = richMode;
  state.openToCapture = openToCapture;

  const key = 'atem-' + boardId;
  let s = null;

  // Remote first
  s = await loadFromSupabase(boardId);
  if (!s) { try { s = await get(key); } catch(e) {} }
  if (!s) {
    try {
      const raw = localStorage.getItem(key+'-backup');
      if (raw) s = JSON.parse(raw);
    } catch(e) {}
  }

  if (s) {
    state.thoughts = s.thoughts || [];
    state.connections = s.connections || [];
    state.boardName = s.boardName || boardId;
    if (s.camera) {
      camera.position.set(s.camera.px,s.camera.py,s.camera.pz);
      controls.target.set(s.camera.tx,s.camera.ty,s.camera.tz);
    }
    const validIds = new Set(state.thoughts.map(t=>t.id));
    state.connections = state.connections.filter(c=>validIds.has(c.from)&&validIds.has(c.to));
    for (const t of state.thoughts) { if(!t.size)t.size=1.0; if(!t.props)t.props={}; if(!t.body)t.body=''; }
    for (const t of state.thoughts) addThoughtMesh(t);
    rebuildMaps(); rebuildConnections();
    if (state.thoughts.length > 0) hideHint();
  }

  // Update board registry name
  const registry = await getBoardRegistry();
  const slot = registry.find(b => b.id === boardId);
  if (slot) { state.boardName = slot.name; }

  updateRichModeUI();
  needsRender = true;
  toast(state.boardName);
}

async function load() {
  let boardId = 'board-1';
  try { const lb = localStorage.getItem('atem-last-board'); if (lb) boardId = lb; } catch(e) {}
  state.boardId = boardId;

  let s = null;

  // Try Supabase first (source of truth)
  s = await loadFromSupabase(boardId);

  // Fall back to IndexedDB
  if (!s) {
    const key = 'atem-' + boardId;
    try { s = await get(key); } catch(e) {}
  }
  // Fall back to legacy keys
  if (!s) {
    try { s = await get('atem-state'); } catch(e) {}
  }
  if (!s) {
    try {
      const raw = localStorage.getItem('atem-' + boardId + '-backup')
        || localStorage.getItem('atem-state')
        || localStorage.getItem('atem-state-backup');
      if (raw) { s = JSON.parse(raw); if (s) await set('atem-' + boardId, s); }
    } catch(e) {}
  }
  if (!s) return;

  try {
    state.version = s.version || state.version;
    state.thoughts = s.thoughts || [];
    state.connections = s.connections || [];
    state.openToCapture = s.openToCapture || false;
    state.richMode = s.richMode || false;
    state.boardName = s.boardName || 'Board 1';

    if (s.camera) {
      camera.position.set(s.camera.px,s.camera.py,s.camera.pz);
      controls.target.set(s.camera.tx,s.camera.ty,s.camera.tz);
    }
    const validIds = new Set(state.thoughts.map(t=>t.id));
    state.connections = state.connections.filter(c=>validIds.has(c.from)&&validIds.has(c.to));
    for (const t of state.thoughts) { if(!t.size)t.size=1.0; if(!t.props)t.props={}; if(!t.body)t.body=''; }
    for (const c of state.connections) { if(!c.color)c.color='#6ea8fe'; if(c.directed===undefined)c.directed=false; if(c._reversed===undefined)c._reversed=false; }
    for (const t of state.thoughts) addThoughtMesh(t);
    rebuildMaps(); rebuildConnections();
    updateCaptureToggle(); updateRichModeUI();
    if (state.thoughts.length > 0) hideHint();
  } catch(e) { console.warn('hydrate failed', e); }
}

// ═══════════════════════════════════════════
// CRUD
// ═══════════════════════════════════════════

function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function createThought(x, y, z, text, color, body) {
  const t = {
    id:uid(), text:text||'',
    body: body||'',
    position:[x,y,z],
    color: color || COLORS[0],
    created:Date.now(), touched:Date.now(),
    size: 1.0,
    props: {}
  };
  state.thoughts.push(t);
  thoughtMap.set(t.id, t);
  state.isStarterBoard = false;
  addThoughtMesh(t); save(); hideHint(); hideIdleChip();
  // Joy layer 1: bounce on create — damped oscillation 1.0 → 1.15 → 1.0 over ~300ms
  const mesh = getMesh(t.id);
  if (mesh) { mesh.userData.bounceStart = performance.now(); mesh.userData.baseSize = t.size; }
  // Live-update menu header if open
  const menu = document.getElementById('menu-drawer');
  if (menu && menu.classList.contains('open')) updateMenuHeader();
  needsRender = true;
  return t;
}

function updateThought(id, text, color, size, body) {
  const t = thoughtMap.get(id);
  if (!t) return;
  t.text = text; t.touched = Date.now();
  if (body !== undefined) t.body = body;
  if (color !== undefined) t.color = color;
  if (size !== undefined) t.size = size;
  const mesh = getMesh(id);
  if (mesh) {
    updateLabel(mesh, t.text, t.body);
    if (color) { mesh.material.color.set(color); mesh.material.emissive.set(color); }
    if (size !== undefined) { mesh.scale.setScalar(size); mesh.userData.baseSize = size; }
  }
  save(); needsRender = true;
}

function deleteThought(id) {
  state.thoughts = state.thoughts.filter(t=>t.id!==id);
  state.connections = state.connections.filter(c=>c.from!==id&&c.to!==id);
  const mesh = getMesh(id);
  if (mesh) thoughtGroup.remove(mesh);
  thoughtMap.delete(id);
  meshMap.delete(id);
  rebuildConnections(); save(); needsRender = true;
  const menu = document.getElementById('menu-drawer');
  if (menu && menu.classList.contains('open')) updateMenuHeader();
}

function moveThought(id, x, y, z) {
  const t = thoughtMap.get(id);
  if (t) { t.position=[x,y,z]; t.touched=Date.now(); }
}

function addConnection(fromId, toId, label, color, directed) {
  if (fromId === toId) return;
  const conn = { id:uid(), from:fromId, to:toId, created:Date.now(), label: label||null, color: color||'#6ea8fe', directed: directed||false };
  state.connections.push(conn);
  rebuildConnections(); save();
  // Joy layer 2: soft glow pulse on the target when a connection lands.
  // Ramps emissive up through animate() damping, then back down.
  const targetMesh = getMesh(toId);
  if (targetMesh) {
    targetMesh.userData.targetEmissive = 0.7;
    setTimeout(() => {
      if (targetMesh.userData) targetMesh.userData.targetEmissive = 0.15;
      needsRender = true;
    }, 450);
  }
  needsRender = true;
  if (label === null) return;
  if (!label) openConnEditor(conn.id);
  else toast('connected');
}

function deleteConnection(connKey) {
  state.connections = state.connections.filter(c => [c.from,c.to].sort().join('|') !== connKey);
  rebuildConnections(); save(); toast('disconnected');
  needsRender = true;
}

// ═══════════════════════════════════════════
// CONNECTION EDITOR
// ═══════════════════════════════════════════

const connEditorEl = document.getElementById('conn-editor');
const connCustomInput = document.getElementById('conn-custom-input');

function openConnEditor(connId) {
  const conn = state.connections.find(c => c.id === connId);
  if (!conn) return;
  editingConnId = connId;
  controls.enabled = false;

  const presetRow = document.getElementById('conn-preset-row');
  presetRow.innerHTML = CONN_PRESETS.map(p =>
    `<button class="conn-preset${conn.label===p.label?' active':''}" data-label="${p.label}" data-color="${p.color}">${p.label}</button>`
  ).join('');
  presetRow.querySelectorAll('.conn-preset').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      presetRow.querySelectorAll('.conn-preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      connCustomInput.value = '';
      conn.label = btn.dataset.label;
      conn.color = btn.dataset.color;
      document.querySelectorAll('#conn-color-row .conn-cswatch').forEach(s => {
        s.classList.toggle('active', s.dataset.color === conn.color);
      });
      rebuildConnections(); save();
    });
  });

  connCustomInput.value = (conn.label && !CONN_PRESETS.find(p=>p.label===conn.label)) ? conn.label : '';
  connCustomInput.oninput = () => {
    const v = connCustomInput.value.trim();
    if (v) {
      presetRow.querySelectorAll('.conn-preset').forEach(b => b.classList.remove('active'));
      conn.label = v;
      rebuildConnections(); save();
    }
  };

  const colorRow = document.getElementById('conn-color-row');
  colorRow.innerHTML = CONN_COLORS.map(c =>
    `<div class="conn-cswatch${conn.color===c?' active':''}" data-color="${c}" style="background:${c}"></div>`
  ).join('');
  colorRow.querySelectorAll('.conn-cswatch').forEach(swatch => {
    swatch.addEventListener('click', (e) => {
      e.stopPropagation();
      colorRow.querySelectorAll('.conn-cswatch').forEach(s => s.classList.remove('active'));
      swatch.classList.add('active');
      conn.color = swatch.dataset.color;
      rebuildConnections(); save();
    });
  });

  connEditorEl.classList.add('open');

  // Directed toggle — 3 states: undirected → A→B → B→A → undirected
  const dirBtn = document.getElementById('conn-dir-btn');
  // direction state: 0=undirected, 1=forward (from→to), 2=reverse (to→from)
  const getDirState = () => {
    if (!conn.directed) return 0;
    return conn._reversed ? 2 : 1;
  };
  const updateDirBtn = () => {
    const s = getDirState();
    const labels = ['↔ undirected', '→ A to B', '← B to A'];
    const colors = ['rgba(255,255,255,0.4)', 'rgba(255,200,100,0.9)', 'rgba(100,200,255,0.9)'];
    const bgs = ['rgba(255,255,255,0.06)', 'rgba(255,180,60,0.15)', 'rgba(60,160,255,0.15)'];
    dirBtn.textContent = labels[s];
    dirBtn.style.color = colors[s];
    dirBtn.style.background = bgs[s];
  };
  updateDirBtn();
  dirBtn.onclick = (e) => {
    e.stopPropagation();
    const s = getDirState();
    if (s === 0) {
      conn.directed = true; conn._reversed = false;
    } else if (s === 1) {
      // flip: swap from/to so the arrow points the other way
      const tmp = conn.from; conn.from = conn.to; conn.to = tmp;
      conn._reversed = true;
    } else {
      conn.directed = false; conn._reversed = false;
    }
    updateDirBtn();
    rebuildConnections(); save();
  };
}

function closeConnEditor() {
  editingConnId = null;
  connEditorEl.classList.remove('open');
  controls.enabled = true;
  needsRender = true;
}

document.getElementById('conn-done-btn').addEventListener('click', () => closeConnEditor());
document.getElementById('conn-del-btn').addEventListener('click', () => {
  if (editingConnId) {
    const conn = state.connections.find(c => c.id === editingConnId);
    if (conn) deleteConnection([conn.from, conn.to].sort().join('|'));
  }
  closeConnEditor();
});
connCustomInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); closeConnEditor(); }
});

// ═══════════════════════════════════════════
// EDITOR
// ═══════════════════════════════════════════

const editorEl = document.getElementById('editor');

function renderEditorColors() {
  const btn = document.getElementById('ed-color-btn');
  const palette = document.getElementById('ed-color-palette');
  if (!btn || !palette) return;
  btn.style.background = editingColor;
  palette.innerHTML = COLORS.map(c =>
    `<div class="ed-color-swatch" data-color="${c}" style="background:${c}"></div>`
  ).join('');
  btn.onclick = (e) => { e.stopPropagation(); palette.classList.toggle('open'); };
  palette.querySelectorAll('.ed-color-swatch').forEach(swatch => {
    swatch.onclick = (e) => {
      e.stopPropagation();
      editingColor = swatch.dataset.color;
      btn.style.background = editingColor;
      palette.classList.remove('open');
      if (editingId) {
        const mesh = getMesh(editingId);
        if (mesh) { mesh.material.color.set(editingColor); mesh.material.emissive.set(editingColor); }
      }
    };
  });
}

function updateRichModeUI() {
  // v20: title is always visible. richMode state preserved for backward compat
  // with saved boards, but the UI no longer gates the title field. No-op.
}

function openEditor(id) {
  clearSelection(); closeConnEditor();
  editingId = id;
  const t = thoughtMap.get(id);
  const edBody = document.getElementById('ed-body');
  const edTitle = document.getElementById('ed-title');

  edBody.value = t ? (t.body || '') : '';
  if (edTitle) edTitle.value = t ? (t.text || '') : '';
  editingColor = t ? t.color : COLORS[0];
  renderEditorColors();
  updateRichModeUI();
  editorEl.classList.add('open');
  controls.enabled = false;
  edBody.style.height = 'auto';

  // Glow connected thoughts
  for (const child of lineGroup.children) {
    if (child.userData.isConnLabel || child.userData.isArrow) continue;
    if (child.userData.from === id || child.userData.to === id) {
      const base = child.userData.baseOpacity || 0.35;
      child.material.opacity = Math.min(base + 0.3, 1.0);
      setTimeout(() => { if (child.material) child.material.opacity = base; needsRender = true; }, 800);
    }
  }
  needsRender = true;
  edBody.focus();
  edBody.selectionStart = edBody.value.length;
  setTimeout(() => edBody.focus(), 80);
}

function closeEditor(doSave) {
  if (doSave && editingId) {
    const edBody = document.getElementById('ed-body');
    const edTitle = document.getElementById('ed-title');
    const body = edBody ? edBody.value.trim() : '';
    // Bug 4: always read title from DOM — never force-wipe based on a mode flag
    const title = edTitle ? edTitle.value.trim() : '';
    if (!body && !title) {
      deleteThought(editingId);
    } else {
      updateThought(editingId, title, editingColor, undefined, body);
    }
  }
  editingId = null; editingColor = null;
  editorEl.classList.remove('open'); controls.enabled = true;
}

document.getElementById('save-btn').addEventListener('click', ()=>closeEditor(true));
document.getElementById('cancel-btn').addEventListener('click', () => {
  if (editingId) {
    const t = thoughtMap.get(editingId);
    if (t && !t.text && !t.body) deleteThought(editingId);
  }
  closeEditor(false);
});
document.getElementById('del-btn').addEventListener('click', ()=>{ if(editingId) deleteThought(editingId); closeEditor(false); });
// Editor keyboard + input handlers
function setupEditorListeners() {
  const edBody = document.getElementById('ed-body');
  const edTitle = document.getElementById('ed-title');

  edBody.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeEditor(false); e.preventDefault(); }
    // v20: title is always on. Body Enter = newline (multi-line thinking).
    // Cmd/Ctrl+Enter = save. Matches rich editor conventions.
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { closeEditor(true); e.preventDefault(); }
  });
  edBody.addEventListener('input', () => {
    edBody.style.height = 'auto';
    edBody.style.height = Math.min(edBody.scrollHeight, 200) + 'px';
  });

  if (edTitle) {
    edTitle.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeEditor(false); e.preventDefault(); }
      // Enter in title field: jump to body (not save). Thinking continues.
      if (e.key === 'Enter') { edBody.focus(); e.preventDefault(); }
      // Cmd/Ctrl+Enter from title also saves
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { closeEditor(true); e.preventDefault(); }
    });
  }
}
setupEditorListeners();

// Tap outside editor = save (pointerdown on canvas while editor open)
canvas.addEventListener('pointerdown', (e) => {
  if (editorEl.classList.contains('open') && e.target === canvas) {
    closeEditor(true);
  }
}, { capture: true });

// ═══════════════════════════════════════════
// LASSO
// ═══════════════════════════════════════════

const lassoRect = document.getElementById('lasso-rect');
const lassoBar = document.getElementById('lasso-bar');

function clearSelection() {
  selectedIds.clear();
  lassoBar.classList.remove('open');
  lassoRect.style.display = 'none';
  for (const mesh of thoughtGroup.children) mesh.userData.targetEmissive = 0.15;
}

function updateLassoRect() {
  if (!lassoStart || !lassoEnd) return;
  const x = Math.min(lassoStart.x, lassoEnd.x), y = Math.min(lassoStart.y, lassoEnd.y);
  const w = Math.abs(lassoEnd.x - lassoStart.x), h = Math.abs(lassoEnd.y - lassoStart.y);
  lassoRect.style.display = 'block';
  lassoRect.style.left = x+'px'; lassoRect.style.top = y+'px';
  lassoRect.style.width = w+'px'; lassoRect.style.height = h+'px';
}

function finishLasso() {
  if (!lassoStart || !lassoEnd) { lassoRect.style.display='none'; return; }
  const x1 = Math.min(lassoStart.x, lassoEnd.x), y1 = Math.min(lassoStart.y, lassoEnd.y);
  const x2 = Math.max(lassoStart.x, lassoEnd.x), y2 = Math.max(lassoStart.y, lassoEnd.y);
  if (x2-x1 < 20 && y2-y1 < 20) { lassoRect.style.display='none'; return; }
  selectedIds.clear();
  for (const mesh of thoughtGroup.children) {
    const sp = mesh.position.clone().project(camera);
    const sx = (sp.x+1)/2 * window.innerWidth, sy = (1-sp.y)/2 * window.innerHeight;
    if (sx>=x1 && sx<=x2 && sy>=y1 && sy<=y2) { selectedIds.add(mesh.userData.id); mesh.userData.targetEmissive = 0.5; }
  }
  lassoRect.style.display = 'none';
  if (selectedIds.size > 0) { lassoBar.classList.add('open'); toast(selectedIds.size + ' selected'); }
}

document.getElementById('lasso-clear').addEventListener('pointerdown', (e)=>{ e.stopPropagation(); e.preventDefault(); clearSelection(); });
document.getElementById('lasso-recolor').addEventListener('pointerdown', (e)=>{
  e.stopPropagation(); e.preventDefault();
  if (selectedIds.size === 0) return;
  // Cycle through palette on each tap
  const idx = Math.floor(Math.random() * COLORS.length);
  const color = COLORS[idx];
  for (const id of selectedIds) {
    updateThought(id, thoughtMap.get(id)?.text, color, undefined, thoughtMap.get(id)?.body);
    const mesh = getMesh(id);
    if (mesh) { mesh.material.color.set(color); mesh.material.emissive.set(color); }
  }
  save(); toast(`${selectedIds.size} recolored`);
  clearSelection();
});

// ═══════════════════════════════════════════
// RAYCASTING
// ═══════════════════════════════════════════

function ndcFromEvent(e) {
  let x,y;
  if (e.touches && e.touches.length > 0) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
  else if (e.changedTouches && e.changedTouches.length > 0) { x = e.changedTouches[0].clientX; y = e.changedTouches[0].clientY; }
  else { x = e.clientX ?? 0; y = e.clientY ?? 0; }
  pointer.set((x/window.innerWidth)*2-1, -(y/window.innerHeight)*2+1);
}

function hitThought(e) {
  ndcFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(thoughtGroup.children, false);
  return hits.length ? hits[0].object : null;
}

function hitLine(e) {
  ndcFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(lineGroup.children.filter(l=>!l.userData.isConnLabel), false);
  return hits.length ? hits[0].object : null;
}

function worldPosFromScreen(e) {
  ndcFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  const camDir = camera.getWorldDirection(new THREE.Vector3());
  plane.setFromNormalAndCoplanarPoint(camDir.negate(), controls.target);
  raycaster.ray.intersectPlane(plane, intersectPt);
  return intersectPt.clone();
}

// ═══════════════════════════════════════════
// POINTER
// ═══════════════════════════════════════════

function pxFromEvent(e) {
  if (e.touches && e.touches.length > 0) return { x:e.touches[0].clientX, y:e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches.length > 0) return { x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY };
  return { x:e.clientX??0, y:e.clientY??0 };
}

function isOverlayOpen() {
  return editorEl.classList.contains('open')
    || connEditorEl.classList.contains('open')
    || boardsOverlay.classList.contains('open')
    || galleryOverlay.classList.contains('open');
}

function onPointerDown(e) {
  if (isOverlayOpen()) return;
  if (e.target !== canvas) return;
  if (e.touches && e.touches.length > 1) { clearHold(); multiTouchActive = true; return; }
  const px = pxFromEvent(e);
  pointerStart = px; pointerMoved = false; holdTriggered = false;
  isDragging = false; lassoActive = false; lassoHoldTriggered = false;
  const hit = hitThought(e);
  if (hit) {
    draggedMesh = hit;
    const wp = worldPosFromScreen(e);
    dragOffset.copy(draggedMesh.position).sub(wp);
    holdTimer = setTimeout(()=>{
      if (!pointerMoved) {
        holdTriggered = true;
        connectSource = draggedMesh.userData.id;
        draggedMesh.material.emissiveIntensity = 0.6;
        pendingLineMesh.visible = true;
        if (navigator.vibrate) navigator.vibrate(30);
      }
    }, HOLD_MS);
    controls.enabled = false;
  } else {
    draggedMesh = null;
    lassoStart = px;
    lassoHoldTimer = setTimeout(()=>{
      if (!pointerMoved) {
        lassoHoldTriggered = true; lassoActive = true;
        if (navigator.vibrate) navigator.vibrate(20);
      }
    }, HOLD_MS);
    controls.enabled = true;
  }
}

function onPointerMove(e) {
  if (isOverlayOpen()) return;
  if (e.touches && e.touches.length > 1) { clearHold(); clearTimeout(lassoHoldTimer); lassoActive=false; lassoRect.style.display='none'; multiTouchActive = true; return; }
  const px = pxFromEvent(e);
  const dx = px.x-pointerStart.x, dy = px.y-pointerStart.y;
  if (Math.sqrt(dx*dx+dy*dy) > DRAG_THRESH) pointerMoved = true;

  if (draggedMesh && !holdTriggered && pointerMoved) {
    clearTimeout(holdTimer); isDragging = true;
    const wp = worldPosFromScreen(e);
    draggedMesh.position.copy(wp.add(dragOffset));
    moveThought(draggedMesh.userData.id, draggedMesh.position.x, draggedMesh.position.y, draggedMesh.position.z);
    updateConnectionPositions();
  }

  if (holdTriggered && connectSource) {
    const srcMesh = getMesh(connectSource);
    if (srcMesh) {
      const wp = worldPosFromScreen(e);
      const pos = pendingLineMesh.geometry.attributes.position;
      pos.setXYZ(0, srcMesh.position.x, srcMesh.position.y, srcMesh.position.z);
      pos.setXYZ(1, wp.x, wp.y, wp.z);
      pos.needsUpdate = true;
      needsRender = true;
    }
    const hit = hitThought(e);
    for (const child of thoughtGroup.children) {
      child.userData.targetEmissive = (hit===child && child.userData.id!==connectSource) ? 0.5 : 0.15;
    }
  }

  if (lassoActive && lassoHoldTriggered) { controls.enabled = false; lassoEnd = px; updateLassoRect(); }
}

function onPointerUp(e) {
  if (isOverlayOpen()) return;
  if (multiTouchActive) { multiTouchActive = false; draggedMesh=null; isDragging=false; holdTriggered=false; controls.enabled=true; return; }
  clearTimeout(holdTimer); clearTimeout(lassoHoldTimer);

  if (lassoActive && lassoHoldTriggered && lassoEnd) {
    finishLasso(); lassoActive=false; lassoHoldTriggered=false; lassoStart=null; lassoEnd=null;
    controls.enabled = true; return;
  }
  lassoActive=false; lassoHoldTriggered=false; lassoStart=null; lassoEnd=null; lassoRect.style.display='none';

  if (holdTriggered && connectSource) {
    pendingLineMesh.visible = false;
    const hit = hitThought(e);
    if (hit && hit.userData.id !== connectSource) {
      addConnection(connectSource, hit.userData.id);
    } else if (!hit && pointerMoved) {
      const wp = worldPosFromScreen(e);
      const newT = createThought(wp.x, wp.y, wp.z);
      const conn = { id:uid(), from:connectSource, to:newT.id, created:Date.now(), label:null, color:'#6ea8fe' };
      state.connections.push(conn);
      rebuildConnections(); save(); needsRender = true;
      setTimeout(() => openEditor(newT.id), 80);
    }
    const src = getMesh(connectSource);
    if (src) src.userData.targetEmissive = 0.15;
    for (const child of thoughtGroup.children) child.userData.targetEmissive = 0.15;
    connectSource = null;
  } else if (isDragging && draggedMesh) {
    save();
  } else if (draggedMesh && !pointerMoved) {
    openEditor(draggedMesh.userData.id);
  } else if (!draggedMesh && !pointerMoved) {
    if (selectedIds.size > 0) { clearSelection(); }
    else {
      const lineHit = hitLine(e);
      if (lineHit && lineHit.userData.connKey) {
        const conn = state.connections.find(c => [c.from,c.to].sort().join('|') === lineHit.userData.connKey);
        if (conn) openConnEditor(conn.id);
      } else {
        const wp = worldPosFromScreen(e);
        const t = createThought(wp.x, wp.y, wp.z);
        openEditor(t.id);
      }
    }
  }
  draggedMesh = null; isDragging = false; holdTriggered = false; multiTouchActive = false; controls.enabled = true;
}

function clearHold() {
  clearTimeout(holdTimer); holdTriggered = false;
  if (connectSource) { const src = getMesh(connectSource); if (src) src.userData.targetEmissive = 0.15; connectSource = null; pendingLineMesh.visible = false; }
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length > 1) { multiTouchActive = true; clearHold(); draggedMesh = null; holdTriggered = true; controls.enabled = true; return; }
  multiTouchActive = false; onPointerDown(e);
}, { passive:false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e); }, { passive:false });
canvas.addEventListener('touchend', onPointerUp);
canvas.addEventListener('touchcancel', ()=>{ clearHold(); clearTimeout(lassoHoldTimer); lassoActive=false; lassoRect.style.display='none'; draggedMesh=null; isDragging=false; holdTriggered=false; multiTouchActive=false; controls.enabled=true; });
canvas.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);

// Hover highlight (desktop)
window.addEventListener('mousemove', (e) => {
  if (isDragging || holdTriggered || connectSource || isOverlayOpen()) {
    if (!connectSource) {
      for (const child of thoughtGroup.children) child.userData.targetEmissive = 0.15;
      for (const child of lineGroup.children) {
        if (!child.userData.isConnLabel) child.material.opacity = child.userData.baseOpacity || 0.35;
      }
    }
    return;
  }
  const hit = hitThought(e);
  for (const child of thoughtGroup.children) {
    const tId = child.userData.id;
    if (!hit) child.userData.targetEmissive = 0.15;
    else if (tId === hit.userData.id) child.userData.targetEmissive = 0.75;
    else {
      const isConnected = state.connections.some(c =>
        (c.from === hit.userData.id && c.to === tId) || (c.to === hit.userData.id && c.from === tId)
      );
      child.userData.targetEmissive = isConnected ? 0.5 : 0.05;
    }
  }
  for (const child of lineGroup.children) {
    if (child.userData.isConnLabel) continue;
    const base = child.userData.baseOpacity || 0.35;
    if (!hit) child.material.opacity = base;
    else {
      const isRelated = child.userData.from === hit.userData.id || child.userData.to === hit.userData.id;
      child.material.opacity = isRelated ? 0.9 : 0.04;
    }
  }
  needsRender = true;
});

const menuDrawer = document.getElementById('menu-drawer');
const menuScrim = document.getElementById('menu-scrim');
function updateMenuHeader() {
  const nameEl = document.getElementById('m-header-name');
  const countEl = document.getElementById('m-header-count');
  if (nameEl) nameEl.textContent = state.boardName || state.boardId || 'Board 1';
  if (countEl) {
    const n = state.thoughts.length;
    const c = state.connections.length;
    countEl.textContent = `${n} thought${n===1?'':'s'} · ${c} connection${c===1?'':'s'}`;
  }
}
function openMenu() { updateMenuHeader(); hideIdleChip(); menuDrawer.classList.add('open'); menuScrim.classList.add('open'); }
function closeMenu() { menuDrawer.classList.remove('open'); menuScrim.classList.remove('open'); }

document.getElementById('menu-btn').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); openMenu(); }, { passive:false });
menuScrim.addEventListener('click', closeMenu);

document.getElementById('m-export').addEventListener('click', () => {
  const data = JSON.stringify({ thoughts:state.thoughts, connections:state.connections }, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `atem-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  closeMenu(); toast('exported');
});

document.getElementById('m-import').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = (ev) => {
    const file = ev.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (r) => {
      try {
        const data = JSON.parse(r.target.result);
        if (data.thoughts) {
          while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
          while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
          state.thoughts = data.thoughts;
          state.connections = data.connections || [];
          for (const t of state.thoughts) { if (!t.size) t.size = 1.0; if (!t.props) t.props = {}; }
          for (const c of state.connections) { if (!c.color) c.color = '#6ea8fe'; }
          for (const t of state.thoughts) addThoughtMesh(t);
          rebuildMaps();
          rebuildConnections(); save();
          toast('imported ' + state.thoughts.length + ' thoughts');
          if (state.thoughts.length > 0) hideHint();
        }
      } catch (err) { toast('import failed'); }
    };
    reader.readAsText(file);
  };
  input.click(); closeMenu();
});

document.getElementById('m-reset-view').addEventListener('click', () => {
  camera.position.set(0,0,18); controls.target.set(0,0,0); save(); closeMenu();
});

function updateCaptureToggle() {
  document.getElementById('m-capture-dot').classList.toggle('on', !!state.openToCapture);
}
document.getElementById('m-open-capture').addEventListener('click', () => {
  state.openToCapture = !state.openToCapture; updateCaptureToggle(); save();
  toast(state.openToCapture ? 'will open to capture' : 'will open to space');
  closeMenu();
});

document.getElementById('m-toggle-fps').addEventListener('click', () => {
  showFps = !showFps;
  document.getElementById('fps').classList.toggle('on', showFps);
  document.getElementById('m-fps-dot').classList.toggle('on', showFps);
  closeMenu();
});

document.getElementById('m-dump').addEventListener('click', () => {
  console.log(JSON.stringify(state, null, 2));
  closeMenu(); toast('state → console');
});

document.getElementById('m-orphans').addEventListener('click', () => {
  const connected = new Set();
  for (const c of state.connections) { connected.add(c.from); connected.add(c.to); }
  let count = 0;
  for (const mesh of thoughtGroup.children) {
    if (!connected.has(mesh.userData.id)) {
      count++;
      mesh.material.emissive.set('#ff4444'); mesh.material.emissiveIntensity = 0.8;
      setTimeout(() => {
        const t = thoughtMap.get(mesh.userData.id);
        if (t) mesh.material.emissive.set(t.color || '#6ea8fe');
        mesh.userData.targetEmissive = 0.15;
      }, 1500);
    }
  }
  closeMenu(); toast(count + ' orphan' + (count !== 1 ? 's' : ''));
});

document.getElementById('m-bulk').addEventListener('click', () => {
  const spread = Math.sqrt(100) * 2;
  for (let i = 0; i < 100; i++) {
    const x = (Math.random()-0.5)*spread, y = (Math.random()-0.5)*spread, z = (Math.random()-0.5)*spread*0.5;
    createThought(x, y, z, `test-${i}`);
  }
  closeMenu(); toast('+100');
});

document.getElementById('m-clear').addEventListener('click', async () => {
  if (!confirm('clear all thoughts?')) return;
  state.thoughts = []; state.connections = [];
  while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  thoughtMap.clear(); meshMap.clear();
  // Bug 7: also purge thumbnail so cleared board doesn't show ghost preview
  try { await del('atem-thumb-' + state.boardId); } catch(e) {}
  try { localStorage.removeItem('atem-thumb-' + state.boardId); } catch(e) {}
  save(); closeMenu(); toast('cleared');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (boardsOverlay.classList.contains('open')) { closeBoards(); e.preventDefault(); }
    else if (galleryOverlay.classList.contains('open')) { closeGallery(); e.preventDefault(); }
    else if (connEditorEl.classList.contains('open')) { closeConnEditor(); e.preventDefault(); }
    else if (menuDrawer.classList.contains('open')) { closeMenu(); e.preventDefault(); }
    else if (editorEl.classList.contains('open')) { closeEditor(false); e.preventDefault(); }
  }
});

// Drag-drop import
document.body.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); });
document.body.addEventListener('drop', (e) => {
  e.preventDefault(); e.stopPropagation();
  const file = e.dataTransfer.files[0];
  if (!file || !file.name.endsWith('.json')) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.thoughts) return;
      while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
      while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
      state.thoughts = data.thoughts;
      state.connections = data.connections || [];
      for (const t of state.thoughts) { if (!t.size) t.size = 1.0; if (!t.props) t.props = {}; }
      for (const c of state.connections) { if (!c.color) c.color = '#6ea8fe'; }
      for (const t of state.thoughts) addThoughtMesh(t);
      rebuildMaps();
      rebuildConnections(); save();
      toast(`imported ${state.thoughts.length} thoughts`);
      if (state.thoughts.length > 0) hideHint();
    } catch (err) { toast('import failed'); }
  };
  reader.readAsText(file);
});

// ─── Board Slots ───

const boardsOverlay = document.getElementById('boards-overlay');

function captureThumbnail() {
  // Force a render then grab the canvas pixel data as a small dataURL
  renderer.render(scene, camera);
  try {
    return renderer.domElement.toDataURL('image/jpeg', 0.5);
  } catch(e) { return null; }
}

async function saveThumbnail(boardId, dataUrl) {
  if (!dataUrl) return;
  try { await set('atem-thumb-' + boardId, dataUrl); } catch(e) {}
  try { localStorage.setItem('atem-thumb-' + boardId, dataUrl); } catch(e) {}
}

async function getThumbnail(boardId) {
  try {
    const t = await get('atem-thumb-' + boardId);
    if (t) return t;
  } catch(e) {}
  try { return localStorage.getItem('atem-thumb-' + boardId); } catch(e) { return null; }
}

function openBoards() {
  hideIdleChip();
  // Capture thumbnail of current board before opening
  const thumb = captureThumbnail();
  if (thumb) saveThumbnail(state.boardId, thumb);
  renderBoardSlots();
  boardsOverlay.classList.add('open');
}

function closeBoards() {
  boardsOverlay.classList.remove('open');
}

async function renderBoardSlots() {
  const registry = await getBoardRegistry();
  const grid = document.getElementById('boards-grid');
  grid.innerHTML = registry.map(b => `
    <div class="bcard${b.id === state.boardId ? ' active' : ''}" data-board-id="${b.id}">
      <div class="bcard-thumb" id="thumb-${b.id}">
        <div class="bcard-thumb-empty">empty</div>
      </div>
      <div class="bcard-info">
        <div class="bcard-name">${b.name}</div>
        <div class="bcard-count">${b.count > 0 ? b.count + ' thoughts' : 'empty'}</div>
      </div>
      <button class="bcard-rename" data-board-id="${b.id}">rename</button>
    </div>
  `).join('');

  // Load thumbnails async
  for (const b of registry) {
    getThumbnail(b.id).then(thumb => {
      if (!thumb) return;
      const container = document.getElementById('thumb-' + b.id);
      if (!container) return;
      container.innerHTML = '';
      const img = document.createElement('img');
      img.src = thumb;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
      container.appendChild(img);
    });
  }

  grid.querySelectorAll('.bcard').forEach(card => {
    card.addEventListener('click', async (e) => {
      if (e.target.classList.contains('bcard-rename')) return;
      const bid = card.dataset.boardId;
      if (bid === state.boardId) { closeBoards(); return; }
      closeBoards();
      await loadBoard(bid);
      try { localStorage.setItem('atem-last-board', bid); } catch(e) {}
    });
  });

  grid.querySelectorAll('.bcard-rename').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const bid = btn.dataset.boardId;
      getBoardRegistry().then(async reg => {
        const slot = reg.find(b => b.id === bid);
        const newName = prompt('Board name:', slot?.name || bid);
        if (!newName || !newName.trim()) return;
        const trimmed = newName.trim();
        if (bid === state.boardId) { state.boardName = trimmed; save(); }
        if (slot) { slot.name = trimmed; try { await set('atem-boards', reg); } catch(e) {} }
        renderBoardSlots();
      });
    });
  });
}

document.getElementById('boards-close').addEventListener('click', closeBoards);
boardsOverlay.addEventListener('click', (e) => { if (e.target === boardsOverlay) closeBoards(); });
document.getElementById('m-boards').addEventListener('click', () => { closeMenu(); openBoards(); });

const galleryOverlay = document.getElementById('gallery-overlay');

function openGallery() {
  hideIdleChip();
  renderGalleryCards();
  galleryOverlay.classList.add('open');
}

function closeGallery() {
  galleryOverlay.classList.remove('open');
}

function renderGalleryCards() {
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = STARTER_BOARDS.map(b => `
    <div class="gcard" data-board-id="${b.id}" style="--accent:${b.accent}">
      <div class="gcard-name">${b.name}</div>
      <div class="gcard-desc">${b.desc}</div>
      <div class="gcard-meta">
        <div class="gcard-dot"></div>
        <span class="gcard-nodes">${b.thoughts.length} nodes · ${b.tags.join(', ')}</span>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.gcard').forEach(card => {
    card.addEventListener('click', () => {
      const board = STARTER_BOARDS.find(b => b.id === card.dataset.boardId);
      if (board) loadStarterBoard(board);
    });
  });
}

function loadStarterBoard(board) {
  if (state.thoughts.length > 0 && !state.isStarterBoard) {
    if (!confirm(`Load "${board.name}"?\n\nThis replaces your current space. Export first to keep it.`)) return;
  }
  // Close any open editors — editingId would point to a thought about to be cleared
  if (editingId) closeEditor(false);
  if (editingConnId) closeConnEditor();
  hideIdleChip();

  while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  thoughtMap.clear(); meshMap.clear();

  const now = Date.now();
  state.thoughts = board.thoughts.map(t => ({
    ...t,
    position: [...t.position],
    body: '',
    created: now,
    touched: now,
    props: {}
  }));

  // Bug 2: 5-tuple destructure [from, to, label, directed, color]
  state.connections = board.connections.map(([from, to, label, directed, color]) => {
    return {
      id: uid(),
      from, to,
      label: label || null,
      color: color || board.accent,
      directed: directed || false,
      created: now
    };
  });

  for (const t of state.thoughts) addThoughtMesh(t);
  rebuildMaps();
  rebuildConnections();
  hideHint();

  // Bug 10: dynamic camera distance — max(22, maxR * 1.9)
  let maxR = 0;
  for (const t of state.thoughts) {
    const r = Math.hypot(t.position[0], t.position[1], t.position[2]);
    if (r > maxR) maxR = r;
  }
  const camDist = Math.max(22, maxR * 1.9);
  camera.position.set(0, 0, camDist);
  controls.target.set(0, 0, 0);
  needsRender = true;

  // Bug 8: update board slot registry (name, count, updated) — persist metadata
  state.boardName = board.name;
  state.isStarterBoard = true;
  save();
  getBoardRegistry().then(async reg => {
    const slot = reg.find(b => b.id === state.boardId);
    if (slot) {
      slot.name = board.name;
      slot.count = state.thoughts.length;
      slot.updated = Date.now();
      try { await set('atem-boards', reg); } catch(e) {}
    }
  });

  closeGallery();
  toast(`"${board.name}" loaded`);
}

document.getElementById('gallery-close').addEventListener('click', closeGallery);
galleryOverlay.addEventListener('click', (e) => { if (e.target === galleryOverlay) closeGallery(); });
document.getElementById('m-gallery').addEventListener('click', () => { closeMenu(); openGallery(); });

function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 1800); }
function hideHint() { if (!hintVisible) return; hintVisible = false; const h = document.getElementById('hint'); h.style.opacity = '0'; setTimeout(()=>h.style.display='none', 800); }

// Idle chip: surfaces gallery as an option after 10s of stillness on fresh state.
// Not onboarding chrome — just a quiet suggestion. Teach by exemplar.
let idleChipShown = false;
let idleChipArmed = false;
function startIdleChip() {
  idleChipArmed = true;
  const chip = document.getElementById('idle-chip');
  if (!chip) return;
  chip.onclick = () => { hideIdleChip(); openGallery(); };
  setTimeout(() => {
    if (!idleChipArmed) return;
    // Only show if user still on the bible demo (bible has 19 nodes)
    if (state.thoughts.length > 19) return;
    chip.classList.add('show');
    idleChipShown = true;
  }, 10000);
}
function hideIdleChip() {
  idleChipArmed = false;
  if (!idleChipShown) return;
  const chip = document.getElementById('idle-chip');
  if (chip) chip.classList.remove('show');
  idleChipShown = false;
}

// ═══════════════════════════════════════════
// ANIMATION
// ═══════════════════════════════════════════

let fpsFrames = 0, fpsLast = performance.now(), fpsValue = 0;
let lastTime = performance.now();
let needsRender = true;

const frustum = new THREE.Frustum();
const camMatrix = new THREE.Matrix4();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now(); const dt = Math.min((now-lastTime)/1000, 0.05); lastTime = now;
  fpsFrames++;
  if (now-fpsLast >= 500) {
    fpsValue = Math.round(fpsFrames/((now-fpsLast)/1000)); fpsFrames = 0; fpsLast = now;
    if (showFps) document.getElementById('fps').textContent = fpsValue + ' fps';
  }

  controls.update();

  camera.updateMatrixWorld();
  camMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(camMatrix);

  let hasAnim = false;
  for (const mesh of thoughtGroup.children) {
    const ud = mesh.userData; ud.breath += dt*0.8;
    if (!isDragging || mesh !== draggedMesh) {
      mesh.position.y += Math.sin(ud.breath)*0.0003;
      mesh.position.x += Math.cos(ud.breath*0.7)*0.0002;
    }
    const ce = mesh.material.emissiveIntensity;
    const te = ud.targetEmissive + Math.sin(ud.breath)*0.03;
    mesh.material.emissiveIntensity += (te-ce)*0.1;
    const co = mesh.material.opacity;
    mesh.material.opacity += (ud.targetOpacity-co)*0.08;

    // Joy layer 1: damped bounce on creation. 1.0 → 1.15 → 1.0 over ~300ms.
    if (ud.bounceStart) {
      const elapsed = now - ud.bounceStart;
      if (elapsed >= 300) {
        ud.bounceStart = 0;
        mesh.scale.setScalar(ud.baseSize || 1.0);
      } else {
        const t = elapsed / 300;
        const mult = 1 + 0.15 * Math.sin(Math.PI * t);
        mesh.scale.setScalar((ud.baseSize || 1.0) * mult);
        hasAnim = true;
      }
    }

    const label = mesh.getObjectByName('label');
    if (label) {
      const inView = frustum.containsPoint(mesh.position);
      label.visible = inView && ud.targetOpacity > 0.5;
    }

    if (Math.abs(ce-te) > 0.01 || Math.abs(co-ud.targetOpacity) > 0.01) hasAnim = true;
  }

  if (lineGroup.children.length > 0) updateConnectionPositions();

  if (needsRender || isDragging || hasAnim) {
    renderer.render(scene, camera);
    needsRender = false;
  }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  needsRender = true;
});

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════

(async () => {
  await load();
  animate();

  if (state.thoughts.length === 0) {

      {id:'complete',text:'Three is complete',position:[-5,-2.5,2.5],color:'#7ed4a4',size:0.85},

    ];
    const BCONNS = [
      ['claim','soul','why it matters'],['claim','medium','what it is'],['claim','fundamental','how'],
      ['claim','cheap','constraint'],['claim','joy','feeling'],['claim','sensitive','nature'],
      ['claim','space','primitive 1'],['claim','thought2','primitive 2'],['claim','conn3','primitive 3'],
      ['space','thought2','contains'],['thought2','conn3','enables'],['conn3','density','core insight'],
      ['space','empty','opens as'],['space','complete','proof'],['thought2','complete','proof'],['conn3','complete','proof'],
      ['space','spatial','cognitive basis'],['thought2','external','cognitive basis'],['flow','joy','produces'],
      ['soul','s1','stage 1'],['s1','s2','adds prompting'],['s2','s3','adds code'],
    ];
    for (const t of BIBLE) {
      const now = Date.now();
      const thought = { id:t.id, text:t.text, position:t.position, color:t.color, size:t.size, created:now, touched:now, props:{} };
      state.thoughts.push(thought);
      thoughtMap.set(thought.id, thought);
      addThoughtMesh(thought);
    }
    for (const [from, to, label] of BCONNS) {
      state.connections.push({ id:uid(), from, to, label:label||null, color:'#6ea8fe', created:Date.now() });
    }
    rebuildMaps();
    rebuildConnections();
    state.isStarterBoard = true;
    await save();
    hideHint();
    // Bug 10 rationale applied here too — the bible spreads to ±11
    camera.position.set(0, 0, 24);
    controls.target.set(0, 0, 0);
    // Gallery polish: DO NOT force-open. Instead, surface a subtle chip after 10s of idle.
    startIdleChip();
  }
})();

setInterval(save, 10000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
