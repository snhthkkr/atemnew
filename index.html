<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>atem</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono&display=swap');
:root{--void:#0b0e14;--void2:#0e131b;--panel:#121822;--ink:#dce6f0;--faint:rgba(220,230,240,.45);--ghost:rgba(220,230,240,.16);--line:rgba(180,205,230,.12);--line2:rgba(180,205,230,.22);--signal:#5fe3b0;--t:420ms}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse 120% 80% at 50% -10%,#0e131b 0%,#0b0e14 60%);font-family:'Space Grotesk',-apple-system,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#layer{position:absolute;inset:0}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:3px;align-items:flex-start;cursor:grab;max-width:180px;transition:left var(--t) cubic-bezier(.22,.68,0,1),top var(--t) cubic-bezier(.22,.68,0,1),opacity var(--t)}
.node.row{flex-direction:row;align-items:center;gap:9px;max-width:none}
.node .dot{width:var(--d,15px);height:var(--d,15px);border-radius:50%;background:var(--c,#dce6f0);box-shadow:0 0 0 1px rgba(0,0,0,.45);flex-shrink:0;transition:width var(--t),height var(--t)}
.node .lab{font-size:13px;line-height:1.35;letter-spacing:-.01em}
.node .sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--ghost)}
.node.sel .dot{box-shadow:0 0 0 1px var(--signal),0 0 12px rgba(95,227,176,.5)}
.node.src .dot{box-shadow:0 0 0 1px var(--signal),0 0 0 5px rgba(95,227,176,.18)}
.edge{stroke:rgba(220,230,240,.16);stroke-width:1;fill:none}
.edge.hl{stroke:rgba(95,227,176,.6)}
.edge.live{stroke:var(--signal);stroke-width:1.4;stroke-dasharray:4 4;opacity:.85}
.axis{stroke:rgba(180,205,230,.18);stroke-width:1}
.axl{fill:var(--faint);font-family:'Space Mono',monospace;font-size:10px}
.panel{position:fixed;z-index:6}
#top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:15px 18px;pointer-events:none}
#nm{font-size:15px;font-weight:600;letter-spacing:-.02em}#nm .d{font-family:'Space Mono',monospace;font-size:10px;color:var(--faint);font-weight:400;margin-top:2px}
#rd{max-width:50%;text-align:right;font-size:11px;line-height:1.55;color:var(--faint)}#rd b{color:var(--signal);font-weight:500}#rd i{color:var(--ink);font-style:normal}
#menubtn{position:fixed;top:13px;right:14px;z-index:8;width:34px;height:34px;border-radius:8px;border:.5px solid var(--line);background:rgba(18,24,34,.7);color:var(--faint);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#menubtn:hover{color:var(--ink)}
#addbtn{position:fixed;bottom:84px;right:20px;z-index:7;width:48px;height:48px;border-radius:50%;border:.5px solid var(--line2);background:rgba(18,24,34,.92);color:var(--signal);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 14px 36px -16px rgba(0,0,0,.8)}
#addbtn:active{transform:scale(.94)}
#inspect{top:54px;right:14px;width:228px;background:var(--panel);border:.5px solid var(--line);border-radius:9px;padding:12px 13px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
#inspect.show{opacity:1;transform:translateY(0)}
#inspect .ih{font-family:'Space Mono',monospace;font-size:10px;color:var(--ghost);letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px}
#inspect .sl{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:11px;border-bottom:.5px solid rgba(180,205,230,.09);align-items:center}
#inspect .sl:last-child{border-bottom:none}
#inspect .sk{color:var(--faint);font-family:'Space Mono',monospace;display:flex;align-items:center;gap:5px}
#inspect .sv{color:var(--ink);font-family:'Space Mono',monospace;text-align:right}#inspect .sv.r{color:var(--signal)}
#inspect .pip{width:5px;height:5px;border-radius:50%;background:var(--signal);box-shadow:0 0 5px var(--signal);flex-shrink:0}
#editor{top:50%;left:50%;transform:translate(-50%,-50%) scale(.98);width:min(340px,88vw);background:var(--panel);border:.5px solid var(--line2);border-radius:11px;padding:16px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 30px 70px -24px rgba(0,0,0,.85)}
#editor.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#etext{-webkit-user-select:text;user-select:text;width:100%;min-height:64px;background:transparent;border:none;outline:none;color:var(--ink);font-size:16px;line-height:1.45;font-family:'Space Grotesk',sans-serif;resize:none}
#etext::placeholder{color:var(--ghost)}
#swatch{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.sw{width:21px;height:21px;border-radius:50%;cursor:pointer;border:none;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 1px var(--signal),0 0 0 3px var(--panel),0 0 0 4px var(--signal)}
#eslots{margin-top:12px}
#eslots .esl{font-family:'Space Mono',monospace;font-size:8px;color:var(--ghost);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
#chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{display:flex;align-items:center;gap:5px;background:var(--void2);border:.5px solid var(--line);border-radius:5px;padding:3px 7px;font-family:'Space Mono',monospace;font-size:10px;color:var(--faint)}
.chip b{color:var(--signal);font-weight:400}.chip .rm{cursor:pointer;color:var(--ghost)}.chip .rm:hover{color:#e0739a}
.addrow{display:flex;gap:5px}
.addrow input{-webkit-user-select:text;user-select:text;background:var(--void2);border:.5px solid var(--line);border-radius:5px;color:var(--ink);font-family:'Space Mono',monospace;font-size:10.5px;padding:5px 7px;outline:none}
#esname{flex:1;min-width:0}#esval{width:58px}
#esadd{background:transparent;border:.5px solid var(--line);border-radius:5px;color:var(--faint);font-size:13px;padding:3px 10px;cursor:pointer}#esadd:hover{color:var(--signal)}
#eact{display:flex;justify-content:flex-end;gap:2px;margin-top:13px;padding-top:11px;border-top:.5px solid rgba(180,205,230,.09)}
#eact button{background:transparent;border:none;color:var(--faint);font-family:'Space Grotesk',sans-serif;font-size:13px;padding:6px 11px;border-radius:5px;cursor:pointer}#eact button:hover{color:var(--ink)}
#eact .go{color:var(--signal)}#eact .del{color:#e0739a;margin-right:auto}
#views{bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:rgba(18,24,34,.9);border:.5px solid var(--line);border-radius:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.vbtn{background:transparent;border:none;color:var(--faint);font-family:'Space Grotesk',sans-serif;font-size:12px;padding:7px 13px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.vbtn .k{font-family:'Space Mono',monospace;font-size:9px;color:var(--ghost)}
.vbtn:hover{color:var(--ink)}.vbtn.on{color:var(--ink);background:rgba(220,230,240,.05)}.vbtn.on .k{color:var(--signal)}
#axis{bottom:70px;left:50%;transform:translateX(-50%);display:none;gap:6px;align-items:center;background:rgba(18,24,34,.92);border:.5px solid var(--line);border-radius:8px;padding:6px 9px}
#axis.show{display:flex}#axis .ax{font-family:'Space Mono',monospace;font-size:10px;color:var(--signal)}
#axis select{-webkit-appearance:none;appearance:none;background:var(--void2);color:var(--ink);border:.5px solid var(--line);border-radius:5px;font-family:'Space Mono',monospace;font-size:11px;padding:4px 8px;cursor:pointer;outline:none}
#drawer{top:0;right:0;height:100%;width:248px;background:var(--panel);border-left:.5px solid var(--line2);padding:54px 0 20px;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,0,1);z-index:9;overflow-y:auto;box-shadow:-30px 0 70px -30px rgba(0,0,0,.8)}
#drawer.show{transform:translateX(0)}
.sec{font-family:'Space Mono',monospace;font-size:9px;color:var(--ghost);letter-spacing:.14em;text-transform:uppercase;padding:14px 18px 6px}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:none;color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:13.5px;text-align:left;padding:9px 18px;cursor:pointer}
.item:hover{background:rgba(220,230,240,.04)}.item .meta{font-family:'Space Mono',monospace;font-size:9px;color:var(--ghost)}
.item.on{color:var(--signal)}
#scrim{position:fixed;inset:0;background:rgba(5,7,10,.4);opacity:0;pointer-events:none;transition:opacity .26s;z-index:8}#scrim.show{opacity:1;pointer-events:auto}
#hint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);color:var(--ghost);font-size:11.5px;text-align:center;line-height:1.7;pointer-events:none;z-index:5;transition:opacity .6s;max-width:90vw}
#hint b{color:var(--faint);font-weight:400}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-8px);color:var(--signal);font-family:'Space Mono',monospace;font-size:11px;opacity:0;transition:opacity .2s,transform .2s;z-index:10;pointer-events:none}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#errbar{position:fixed;top:0;left:0;right:0;display:none;background:#3a1620;color:#ffb3c1;font-family:'Space Mono',monospace;font-size:11px;line-height:1.5;padding:9px 14px;z-index:50;border-bottom:1px solid #e0739a}
#errbar a{color:#fff;text-decoration:underline;cursor:pointer;margin-left:10px}
#stamp{position:fixed;left:14px;bottom:14px;font-family:'Space Mono',monospace;font-size:9px;color:var(--ghost);z-index:5;letter-spacing:.05em}
#mean{top:50%;left:50%;transform:translate(-50%,-50%) scale(.98);width:min(340px,88vw);background:var(--panel);border:.5px solid var(--line2);border-radius:11px;padding:16px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:11;box-shadow:0 30px 70px -24px rgba(0,0,0,.85)}
#mean.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#mean .mh{font-family:'Space Mono',monospace;font-size:9px;color:var(--ghost);letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
.mrow{display:flex;align-items:center;gap:9px;margin-bottom:8px}.mrow .md{width:13px;height:13px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px var(--line)}
.mrow input{-webkit-user-select:text;user-select:text;flex:1;min-width:0;background:var(--void2);border:.5px solid var(--line);border-radius:6px;color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:12.5px;padding:7px 10px;outline:none}
#mean .md2{margin-top:8px;width:100%;background:transparent;border:.5px solid var(--line);border-radius:6px;color:var(--signal);font-size:12.5px;padding:8px;cursor:pointer}
#legend{position:fixed;left:18px;top:58px;z-index:5;display:flex;flex-direction:column;gap:4px;max-width:200px}
#legend .lg{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--faint);cursor:pointer}.lg .ld{width:8px;height:8px;border-radius:50%}
@media (max-width:600px){#inspect{display:none}#rd{max-width:40%;font-size:10px}.vbtn{padding:8px 9px}#legend{top:54px;max-width:130px}}
</style>
</head>
<body>
<div id="errbar"></div>
<div id="stage"><svg id="svg"></svg><div id="layer"></div></div>
<div id="top" class="panel"><div id="nm">atem<div class="d"></div></div><div id="rd"></div></div>
<button id="menubtn" aria-label="menu">⋯</button>
<button id="addbtn" aria-label="new thought">+</button>
<div id="legend" class="panel"></div>
<div id="inspect" class="panel"><div class="ih">one thought · just slots</div><div id="slots"></div></div>
<div id="axis" class="panel"><span class="ax">x</span><select id="axx"></select><span class="ax">y</span><select id="axy"></select></div>
<div id="views" class="panel"></div>
<div id="editor" class="panel">
  <textarea id="etext" placeholder="Think…" spellcheck="true"></textarea>
  <div id="swatch"></div>
  <div id="eslots"><div class="esl">slots · invent a dimension</div><div id="chips"></div><div class="addrow"><input id="esname" placeholder="slot name" autocomplete="off" spellcheck="false"><input id="esval" placeholder="value" autocomplete="off"><button id="esadd">+</button></div></div>
  <div id="eact"><button class="del" id="edel">Delete</button><button id="ecancel">Cancel</button><button class="go" id="edone">Done</button></div>
</div>
<div id="mean" class="panel"><div class="mh">name what your colours mean · this board</div><div id="meanrows"></div><button class="md2" id="meandone">done</button></div>
<div id="scrim"></div>
<div id="drawer" class="panel">
  <div class="sec">boards</div><div id="gallery"></div>
  <div class="sec">make</div>
  <button class="item" id="m-new">New board</button>
  <button class="item" id="m-add">Add thought</button>
  <button class="item" id="m-mean">Name the colours<span class="meta">grammar</span></button>
  <div class="sec">data</div>
  <button class="item" id="m-exp">Export .atem<span class="meta">signed</span></button>
  <button class="item" id="m-imp">Import .atem</button>
  <button class="item" id="m-reset">Reset everything<span class="meta">danger</span></button>
  <input type="file" id="file" accept=".json,.atem" style="display:none">
</div>
<div id="hint" class="panel"><b>tap empty space to think · tap a dot to edit · drag to place · hold a dot then drag to another to link · 1–5 to switch views.</b></div>
<div id="toast"></div>
<div id="stamp">resonance · booting…</div>
<script>
window.addEventListener('error',function(e){fail((e.message||'error')+' · '+(e.filename?e.filename.split('/').pop():'')+':'+(e.lineno||'?'));});
window.addEventListener('unhandledrejection',function(e){fail('promise · '+((e.reason&&e.reason.message)||e.reason||'rejected'));});
function fail(msg){try{var b=document.getElementById('errbar');if(b){b.innerHTML='⚠ '+String(msg).slice(0,200)+'<a onclick="atemReset()">reset & reload</a>';b.style.display='block';}}catch(_){}}
function atemReset(){try{if(window.indexedDB)indexedDB.deleteDatabase('atem-resonance');}catch(e){}try{localStorage.removeItem('atem-last');}catch(e){}location.reload();}

(function(){try{
var $=function(id){return document.getElementById(id);};
var DAY=86400000, now=function(){return Date.now();};
var uid=function(){return 't_'+Math.random().toString(36).slice(2,9);};
var W=function(){return window.innerWidth;}, H=function(){return window.innerHeight;};
var daysAgo=function(ts){return Math.max(0,Math.round((now()-ts)/DAY));};
var COLORS=[['claim','#dce6f0'],['spark','#f0a868'],['weight','#e0739a'],['cool','#6fa8d0'],['deep','#9b8cdb'],['go','#5fe3b0'],['mute','#7d8a99']];
var nameOf=function(c){for(var i=0;i<COLORS.length;i++)if(COLORS[i][1]===c)return COLORS[i][0];return String(c);};
var num=function(v){var n=typeof v==='number'?v:parseFloat(v);return isFinite(n)?n:null;};
var norm=function(a){var f=a.filter(function(v){return v!=null;});if(!f.length)return a.map(function(){return .5;});var mn=Math.min.apply(0,f),mx=Math.max.apply(0,f),sp=(mx-mn)||1;return a.map(function(v){return v==null?.5:(v-mn)/sp;});};
var short=function(k){return String(k).replace('spatial.','').replace('confidence','conf').replace('urgency','urg').replace('created','time').slice(0,8);};

function layoutSpatial(TH){var cx=W()/2,cy=H()/2,scale=Math.min(W(),H())/13,yaw=.5,pitch=.34;
  return TH.map(function(t){var a=t.slots['spatial.a']||0,b=t.slots['spatial.b']||0,c=t.slots['spatial.c']||0;
    var rx=a*Math.cos(yaw)-c*Math.sin(yaw),rz=a*Math.sin(yaw)+c*Math.cos(yaw);
    var ry=b*Math.cos(pitch)-rz*Math.sin(pitch),depth=b*Math.sin(pitch)+rz*Math.cos(pitch);
    var p=1/(1+depth*.045);return{t:t,x:cx+rx*scale*p,y:cy-ry*scale*p,sm:p,mode:'free'};});}
function layoutPriority(TH){var m=58,L=m+30,R=W()-m,T=m+54,B=H()-128;
  return TH.map(function(t){var cf=t.slots.confidence==null?.5:t.slots.confidence,ur=t.slots.urgency==null?.5:t.slots.urgency;
    return{t:t,x:L+cf*(R-L),y:B-ur*(B-T),mode:'free',axes:{L:L,R:R,T:T,B:B}};});}
function layoutTimeline(TH){var m=54,L=m+44,R=W()-m,T=m+64,B=H()-128;
  var tm=TH.map(function(t){return t.slots.created||now();});var mn=Math.min.apply(0,tm),mx=Math.max.apply(0,tm),sp=(mx-mn)||1;
  var byId=function(id){for(var i=0;i<TH.length;i++)if(TH[i].id===id)return TH[i];};
  var rootOf=function(id){var cur=id,g=0,t=byId(cur);while(t&&t.slots.parent&&g++<20){cur=t.slots.parent;t=byId(cur);}return cur;};
  var roots=[];TH.forEach(function(t){var r=rootOf(t.id);if(roots.indexOf(r)<0)roots.push(r);});
  var lh=(B-T)/Math.max(roots.length,1);
  return TH.map(function(t){var lane=roots.indexOf(rootOf(t.id));
    return{t:t,x:L+(((t.slots.created||now())-mn)/sp)*(R-L),y:T+lane*lh+lh/2,mode:'row',axes:{L:L,R:R,T:T,B:B}};});}
function layoutOutline(TH){var m=60,x0=m,y0=m+44,rowH=Math.min(42,(H()-200)/Math.max(TH.length,1)+8);
  var kids=function(pid){return TH.filter(function(t){return(t.slots.parent==null?null:t.slots.parent)===pid;});};
  var order=[];(function walk(pid,d){kids(pid).forEach(function(t){order.push({id:t.id,depth:d});walk(t.id,d+1);});})(null,0);
  TH.forEach(function(t){if(!order.some(function(o){return o.id===t.id;}))order.push({id:t.id,depth:0});});
  var pos={};order.forEach(function(o,i){pos[o.id]={x:x0+o.depth*26,y:y0+i*rowH};});
  return TH.map(function(t){var p=pos[t.id]||{x:x0,y:y0};return{t:t,x:p.x,y:p.y,mode:'row'};});}
function layoutFree(TH){var m=58,L=m+40,R=W()-m,T=m+62,B=H()-128;
  var xv=TH.map(function(t){return num(t.slots[S.freeX]);}),yv=TH.map(function(t){return num(t.slots[S.freeY]);});
  var nx=norm(xv),ny=norm(yv);
  return TH.map(function(t,i){return{t:t,x:L+nx[i]*(R-L),y:B-ny[i]*(B-T),mode:'free',axes:{L:L,R:R,T:T,B:B}};});}

var VIEWS={spatial:{label:'Space',keys:'a·b·c',fn:layoutSpatial},priority:{label:'Priority',keys:'conf·urg',fn:layoutPriority},timeline:{label:'Timeline',keys:'created',fn:layoutTimeline},outline:{label:'Outline',keys:'parent',fn:layoutOutline},free:{label:'Free',keys:'pick',fn:layoutFree}};
var READS={spatial:['spatial.a','spatial.b','spatial.c'],priority:['confidence','urgency'],timeline:['created'],outline:['parent'],free:[]};
var READING={spatial:'<b>Space.</b> slots <i>a·b·c</i> become x·y·z — where you place each thought by hand.',priority:'<b>Priority.</b> x = <i>confidence</i>, y = <i>urgency</i>. nothing in the data moved.',timeline:'<b>Timeline.</b> the <i>created</i> slot becomes the x-axis.',outline:'<b>Outline.</b> only the <i>parent</i> slot matters now.'};
function viewReads(){return S.view==='free'?[S.freeX,S.freeY]:READS[S.view];}

function sl(id,text,c,size,a,b,cc,conf,urg,hrs,parent){return{id:id,slots:{text:text,color:c,size:size,'spatial.a':a,'spatial.b':b,'spatial.c':cc,confidence:conf,urgency:urg,created:now()+hrs*3600000,parent:parent}};}
function SAMPLES(){return [
  {id:'tonight',name:'tonight',accent:'#5fe3b0',thoughts:[
    sl('a','How today actually felt','#dce6f0',1.3,0,.4,0,.7,.5,-1,null),
    sl('b','The good thing','#5fe3b0',1.1,-3.2,1.3,-.3,.85,.5,-3,'a'),
    sl('c','The thing that stung','#e0739a',1.0,3.2,1.2,.4,.6,.8,-4,'a'),
    sl('d','A small win','#f0a868',.95,-3.6,-.8,.7,.8,.4,-6,'b'),
    sl('e','What I keep avoiding','#9b8cdb',1.0,3.4,-1,1.3,.55,.9,-2,'a'),
    sl('f','Tomorrow, one thing','#6fa8d0',1.05,.4,-2.2,-.5,.9,.9,-.4,'a')
  ],edges:[['c','e','feeds',true]],freeX:'confidence',freeY:'urgency',meanings:{}},

function edgePath(a,b){if(!a||!b)return'';var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;return'M '+a.x+' '+a.y+' Q '+mx+' '+my+' '+b.x+' '+b.y;}

    s+='<text class="axl" x="'+(A.R-2)+'" y="'+(A.B+22)+'" text-anchor="end">'+xl+' →</text><text class="axl" x="'+(A.L-6)+'" y="'+(A.T+2)+'" text-anchor="end" transform="rotate(-90 '+(A.L-6)+' '+(A.T+2)+')">'+yl+' →</text>';return s;}

var dragId=null,dragMoved=false,dStart={x:0,y:0},dOrig={x:0,y:0},holdT=null,connecting=null,linkPending=null;
function onDown(e,id){e.stopPropagation();dragId=id;dragMoved=false;connecting=null;var el=nodes[id];dStart={x:e.clientX,y:e.clientY};dOrig={x:parseFloat(el.style.left),y:parseFloat(el.style.top)};

  if(Math.abs(dx)+Math.abs(dy)>4){dragMoved=true;if(holdT){clearTimeout(holdT);holdT=null;}}
  if(connecting){var s=placedById[connecting.from];if(s){drawSVG(lastPlaced);$('svg').innerHTML+='<path class="edge live" d="M '+s.x+' '+s.y+' L '+e.clientX+' '+e.clientY+'"/>';}return;}
  if(!dragMoved)return;var el=nodes[dragId];var nx=dOrig.x+dx,ny=dOrig.y+dy;el.style.transition='none';el.style.left=nx+'px';el.style.top=ny+'px';
  if(S.view==='spatial'){var t=byId(dragId);var cx=W()/2,cy=H()/2,scale=Math.min(W(),H())/13,yaw=.5;var rx=(nx-cx)/scale,ry=-(ny-cy)/scale;
    t.slots['spatial.a']=+(rx*Math.cos(yaw)).toFixed(2);t.slots['spatial.b']=+(ry).toFixed(2);t.slots['spatial.c']=+(-rx*Math.sin(yaw)).toFixed(2);drawSVG(layoutSpatial(S.thoughts));}}

  if(i>=0){S.edges.splice(i,1);toast('unlinked');}else{S.edges.push([a,b,'',false]);toast('linked');}save();render();}

function openDrawer(){buildGallery();$('drawer').classList.add('show');$('scrim').classList.add('show');}
function closeDrawer(){$('drawer').classList.remove('show');$('scrim').classList.remove('show');}
$('menubtn').onclick=openDrawer;$('scrim').onclick=function(){closeDrawer();$('mean').classList.remove('show');};
$('addbtn').onclick=function(){hideHint();createAt(W()/2+(Math.random()-.5)*80,H()/2+(Math.random()-.5)*80);};
$('m-new').onclick=function(){loadBoardData({thoughts:[],edges:[]},'b_'+Math.random().toString(36).slice(2,8),'untitled');closeDrawer();hideHint();toast('new board · tap to think');};
$('m-add').onclick=function(){closeDrawer();createAt(W()/2,H()/2);};
$('m-mean').onclick=function(){closeDrawer();openMean();};
$('m-exp').onclick=function(){exportAtem();closeDrawer();};
$('m-imp').onclick=function(){$('file').click();};
$('file').onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){importAtem(String(r.result));closeDrawer();};r.readAsText(f);e.target.value='';};
$('m-reset').onclick=function(){if(confirm('Reset everything? This clears all saved boards on this device.'))atemReset();};

var toastT=null;function toast(m){var el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},1500);}
function hideHint(){var h=$('hint');if(h)h.style.opacity='0';}
window.addEventListener('keydown',function(e){if($('editor').classList.contains('show'))return;
  if(/^[1-5]$/.test(e.key)){var ks=Object.keys(VIEWS);if(ks[+e.key-1]){S.view=ks[+e.key-1];hideHint();save();render();}}
  if(e.key==='Escape'){closeDrawer();$('mean').classList.remove('show');}});
window.addEventListener('resize',function(){render();});

function buildViewsAndBoot(){buildViews();}
async function boot(){buildViewsAndBoot();await openDB();var loaded=false;
  try{var last=lsGet('atem-last');if(last){var d=await dbGet(last);if(d&&d.thoughts&&d.thoughts.length){loadBoardData(d,last,d.boardName||'board');loaded=true;}}}catch(e){}
  if(!loaded)loadSample(SAMPLES()[0]);
  render();$('stamp').textContent='resonance · r1 ✓'+(canPersist?'':' · memory only');
  setTimeout(function(){hideHint();},9000);}
boot().catch(function(e){fail('boot · '+(e&&e.message||e));try{loadSample(SAMPLES()[0]);render();$('stamp').textContent='resonance · r1 · recovered';}catch(_){}});

}catch(err){fail('init · '+(err&&err.message||err));}})();

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
