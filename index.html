<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>atem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  /* ── depth palette: looking into water/space, not warm paper ── */
  --void:#0b0e14;          /* the deep */
  --void-2:#0e131b;        /* panels float just above */
  --panel:#121822;
  --line:rgba(180,205,230,0.09);
  --line-2:rgba(180,205,230,0.16);
  --ink:#dce6f0;           /* primary */
  --ink-soft:rgba(220,230,240,0.60);
  --ink-faint:rgba(220,230,240,0.34);
  --ink-ghost:rgba(220,230,240,0.16);
  --ink-trace:rgba(220,230,240,0.05);
  /* ── the signal: phosphor — live, active, being-read ── */
  --signal:#5fe3b0;
  --signal-soft:rgba(95,227,176,0.16);
  --signal-line:rgba(95,227,176,0.5);
  /* ── thought signal-colors (map to meaning, not decoration) ── */
  --c-claim:#dce6f0;       /* bone-white: a statement */
  --c-spark:#f0a868;       /* amber: generative, a push */
  --c-weight:#e0739a;      /* rose: emotional weight */
  --c-cool:#6fa8d0;        /* blue: calm, structural */
  --c-deep:#9b8cdb;        /* violet: the unsaid, deep */
  --c-go:#5fe3b0;          /* phosphor: live, urgent, go */
  --c-mute:#7d8a99;        /* slate: distant, faded */
  --sans:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'Space Mono','SF Mono',monospace;
  --t:420ms; --e:cubic-bezier(0.22,0.68,0,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(ellipse 120% 80% at 50% 0%, #0d121b 0%, var(--void) 60%)}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}
svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#layer{position:absolute;inset:0}

/* ── nodes ── */
.node{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;gap:3px;align-items:flex-start;
  transition:left var(--t) var(--e), top var(--t) var(--e), opacity var(--t) var(--e), transform 140ms var(--e);
  cursor:grab;will-change:left,top;max-width:190px;
}
.node:active{cursor:grabbing}
.node.row{flex-direction:row;align-items:center;gap:10px;max-width:none}
.node .dot{
  width:var(--d,15px);height:var(--d,15px);border-radius:50%;
  background:var(--c,var(--ink));flex-shrink:0;
  box-shadow:0 0 0 1px rgba(0,0,0,0.35), 0 0 var(--glow,0px) var(--c,transparent);
  transition:width var(--t) var(--e), height var(--t) var(--e), box-shadow 220ms var(--e), background 220ms var(--e);
}
.node.row .dot{align-self:center}
.node .label{font-size:13px;line-height:1.36;color:var(--ink);letter-spacing:-0.006em;font-weight:400}
.node.row .label{font-size:13.5px}
.node .sub{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);letter-spacing:0;margin-top:1px}
.node.dim{opacity:0.22}
.node.sel .dot{box-shadow:0 0 0 1px var(--signal), 0 0 12px var(--signal-soft)}

/* ── edges ── */
.edge{stroke:var(--ink-ghost);stroke-width:1;fill:none;transition:opacity var(--t) var(--e)}
.edge.ai{stroke:var(--signal);opacity:0.4;stroke-dasharray:2 5}
.edge.hl{stroke:var(--signal-line);opacity:0.85}
.axis{stroke:var(--line-2);stroke-width:1}
.axis-label{fill:var(--ink-faint);font-family:var(--mono);font-size:10px;letter-spacing:0.02em}
.grid-line{stroke:var(--line);stroke-width:1}
.tick-label{fill:var(--ink-ghost);font-family:var(--mono);font-size:9px}

/* ── top chrome ── */
#top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:flex-start;justify-content:space-between;padding:16px 20px;pointer-events:none}
#brand{pointer-events:auto;cursor:pointer}
#brand .name{font-size:15px;font-weight:600;letter-spacing:-0.02em;color:var(--ink)}
#brand .board{font-size:10.5px;font-family:var(--mono);color:var(--ink-faint);margin-top:1px;letter-spacing:0.01em}
#reading{pointer-events:none;max-width:42%;text-align:right;font-size:11px;line-height:1.5;color:var(--ink-faint);letter-spacing:-0.004em}
#reading b{color:var(--signal);font-weight:500}
#reading i{color:var(--ink-soft);font-style:normal}

/* ── view switch (signature) ── */
#views{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;padding:14px 12px max(18px,env(safe-area-inset-bottom,0));pointer-events:none}
.vbar{display:flex;gap:2px;padding:4px;background:rgba(18,24,34,0.86);border:1px solid var(--line);border-radius:9px;pointer-events:auto;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 20px 50px -20px rgba(0,0,0,0.8)}
.vbtn{background:transparent;border:none;color:var(--ink-faint);font-family:var(--sans);font-size:12.5px;font-weight:400;letter-spacing:-0.01em;padding:8px 15px;border-radius:6px;cursor:pointer;transition:color var(--t) var(--e),background var(--t) var(--e);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.vbtn .k{font-family:var(--mono);font-size:8.5px;color:var(--ink-ghost);letter-spacing:0.02em}
.vbtn:hover{color:var(--ink-soft)}
.vbtn.active{color:var(--ink);background:var(--ink-trace)}
.vbtn.active .k{color:var(--signal)}

/* ── slot inspector ── */
#inspect{position:fixed;top:50px;right:16px;z-index:45;width:236px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 14px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity 200ms var(--e),transform 200ms var(--e);box-shadow:0 20px 50px -20px rgba(0,0,0,0.8)}
#inspect.show{opacity:1;transform:translateY(0)}
#inspect .ih{font-family:var(--mono);font-size:9px;color:var(--ink-ghost);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:10px}
#inspect .slot{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:11px;border-bottom:1px solid var(--line);align-items:center}
#inspect .slot:last-of-type{border-bottom:none}
#inspect .sk{color:var(--ink-faint);font-family:var(--mono);font-size:10px}
#inspect .sv{color:var(--ink);text-align:right;font-family:var(--mono);font-size:10px}
#inspect .sv.read{color:var(--signal)}
#inspect .read-pip{width:5px;height:5px;border-radius:50%;background:var(--signal);flex-shrink:0;margin-right:5px;box-shadow:0 0 5px var(--signal)}
#inspect .note{font-size:9.5px;color:var(--ink-ghost);line-height:1.55;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}

/* ── editor ── */
#editor{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.98);width:min(380px,90vw);z-index:120;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:18px;opacity:0;pointer-events:none;transition:opacity 200ms var(--e),transform 200ms var(--e);box-shadow:0 30px 70px -24px rgba(0,0,0,0.85)}
#editor.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#editor textarea{-webkit-user-select:text;user-select:text;width:100%;min-height:84px;max-height:220px;background:transparent;border:none;outline:none;color:var(--ink);font-size:15px;line-height:1.5;font-family:var(--sans);resize:none;letter-spacing:-0.01em}
#editor textarea::placeholder{color:var(--ink-ghost)}
#ed-colors{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:none;box-shadow:0 0 0 1px var(--line);transition:transform 140ms var(--e)}
.swatch:hover{transform:scale(1.18)}
.swatch.on{box-shadow:0 0 0 1px var(--signal),0 0 0 3px var(--panel),0 0 0 4px var(--signal)}
#ed-act{display:flex;justify-content:flex-end;gap:0;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
#ed-act button{background:transparent;border:none;color:var(--ink-faint);font-family:var(--sans);font-size:12.5px;padding:6px 11px;border-radius:5px;cursor:pointer;transition:color 160ms var(--e);letter-spacing:-0.01em}
#ed-act button:hover{color:var(--ink)}
#ed-act .go{color:var(--signal)}
#ed-act .del{color:var(--c-weight);margin-right:auto}

/* ── menu ── */
#menu-btn{position:fixed;top:14px;right:16px;z-index:46;width:34px;height:34px;border-radius:8px;background:transparent;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;transition:border-color 160ms var(--e)}
#menu-btn:hover{border-color:var(--line-2)}
#menu-btn .ico{width:13px;height:13px;color:var(--ink-soft)}
#scrim{position:fixed;inset:0;z-index:90;background:rgba(5,7,11,0.6);opacity:0;pointer-events:none;transition:opacity 200ms var(--e)}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(290px,84vw);z-index:100;background:var(--void-2);border-left:1px solid var(--line);transform:translateX(100%);transition:transform 320ms var(--e);display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top,0)) 0 max(16px,env(safe-area-inset-bottom,0));overflow-y:auto}
#drawer.show{transform:translateX(0)}
#drawer .dh{padding:6px 20px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
#drawer .dh .t{font-size:10px;font-family:var(--mono);color:var(--ink-ghost);letter-spacing:0.1em;text-transform:uppercase}
#drawer .seclabel{font-family:var(--mono);font-size:9px;color:var(--ink-ghost);letter-spacing:0.1em;text-transform:uppercase;padding:12px 20px 4px}
#drawer button.item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:none;color:var(--ink-soft);font-family:var(--sans);font-size:13px;padding:9px 20px;cursor:pointer;transition:color 140ms var(--e),background 140ms var(--e);letter-spacing:-0.01em}
#drawer button.item:hover{color:var(--ink);background:var(--ink-trace)}
#drawer button.item .meta{font-family:var(--mono);font-size:9.5px;color:var(--ink-ghost)}
#drawer button.item.danger{color:var(--c-weight)}
#drawer .ver{font-family:var(--mono);font-size:9px;color:var(--ink-ghost);padding:14px 20px 0;margin-top:auto;letter-spacing:0.05em}

/* ── gallery ── */
#gallery{position:fixed;inset:0;z-index:95;background:radial-gradient(ellipse 120% 80% at 50% 0%, #0d121b 0%, var(--void) 60%);display:none;flex-direction:column;padding:max(26px,env(safe-area-inset-top,0)) 0 max(20px,env(safe-area-inset-bottom,0))}
#gallery.show{display:flex}
#gallery .gh{display:flex;align-items:baseline;justify-content:space-between;padding:0 26px 22px}
#gallery .gh .t{font-size:15px;font-weight:600;letter-spacing:-0.02em}
#gallery .gh .x{background:transparent;border:none;color:var(--ink-faint);font-family:var(--sans);font-size:13px;cursor:pointer;padding:6px 10px;transition:color 160ms var(--e)}
#gallery .gh .x:hover{color:var(--ink)}
#gallery .grid{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 26px 26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px;align-content:start}
.gcard{background:var(--void-2);border:1px solid var(--line);border-radius:10px;padding:18px 19px 16px;cursor:pointer;transition:border-color 180ms var(--e),background 180ms var(--e);position:relative;overflow:hidden}
.gcard:hover{border-color:var(--line-2);background:var(--panel)}
.gcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac,var(--signal));opacity:0.7}
.gcard .gn{font-size:15px;font-weight:500;letter-spacing:-0.015em;margin-bottom:6px}
.gcard .gd{font-size:12px;color:var(--ink-faint);line-height:1.5;letter-spacing:-0.005em}
.gcard .gm{display:flex;gap:7px;align-items:center;margin-top:13px}
.gcard .gm .gdot{width:6px;height:6px;border-radius:50%;background:var(--ac,var(--signal));opacity:0.7}
.gcard .gm .gx{font-family:var(--mono);font-size:9px;color:var(--ink-ghost);letter-spacing:0.04em}

#hint{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);color:var(--ink-ghost);font-size:13px;letter-spacing:-0.005em;pointer-events:none;opacity:0;transition:opacity 700ms ease;text-align:center;line-height:1.7;width:80%}
#hint.show{opacity:1}
#hint b{color:var(--ink-faint);font-weight:400}

#toast{position:fixed;top:max(18px,env(safe-area-inset-top,0));left:50%;transform:translateX(-50%) translateY(-10px);background:transparent;color:var(--signal);font-family:var(--mono);font-size:11px;letter-spacing:0.02em;opacity:0;transition:opacity 200ms var(--e),transform 200ms var(--e);z-index:200;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* v31 additions */
#axispick{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:39;display:none;gap:6px;align-items:center;background:rgba(18,24,34,0.9);border:1px solid var(--line);border-radius:8px;padding:6px 9px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:auto;box-shadow:0 16px 40px -20px rgba(0,0,0,0.8)}
#axispick.show{display:flex}
#axispick .apx{font-family:var(--mono);font-size:10px;color:var(--signal);letter-spacing:0.04em}
#axispick select{-webkit-user-select:auto;user-select:auto;appearance:none;-webkit-appearance:none;background:var(--void-2);color:var(--ink);border:1px solid var(--line);border-radius:5px;font-family:var(--mono);font-size:11px;padding:4px 8px;cursor:pointer;outline:none}
#axispick select:hover{border-color:var(--line-2)}
#legend{position:fixed;left:20px;top:56px;z-index:38;display:flex;flex-direction:column;gap:4px;pointer-events:auto;max-width:200px}
#legend .lg{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-faint);cursor:pointer;letter-spacing:-0.004em}
#legend .lg .ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}
#legend .lg:hover{color:var(--ink-soft)}
.edge.live{stroke:var(--signal);stroke-width:1.4;stroke-dasharray:4 4;opacity:0.85;fill:none}
.node.connect-src .dot{box-shadow:0 0 0 1px var(--signal),0 0 0 4px var(--signal-soft)}
#ed-slots{margin-top:12px;display:flex;flex-direction:column;gap:6px}
#ed-slots .chips{display:flex;flex-wrap:wrap;gap:5px}
#ed-slots .chip{display:flex;align-items:center;gap:5px;background:var(--void-2);border:1px solid var(--line);border-radius:5px;padding:3px 7px;font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
#ed-slots .chip b{color:var(--signal);font-weight:400}
#ed-slots .chip .rm{cursor:pointer;color:var(--ink-ghost);margin-left:2px}
#ed-slots .chip .rm:hover{color:var(--c-weight)}
#ed-slots .addrow{display:flex;gap:5px;align-items:center}
#ed-slots input{-webkit-user-select:text;user-select:text;background:var(--void-2);border:1px solid var(--line);border-radius:5px;color:var(--ink);font-family:var(--mono);font-size:10.5px;padding:5px 7px;outline:none}
#ed-slots input#es-name{flex:1;min-width:0}
#ed-slots input#es-val{width:60px}
#ed-slots .addbtn{background:transparent;border:1px solid var(--line);border-radius:5px;color:var(--ink-faint);font-family:var(--mono);font-size:13px;padding:3px 10px;cursor:pointer}
#ed-slots .addbtn:hover{color:var(--signal);border-color:var(--signal-line)}
#ed-slots .eslabel{font-family:var(--mono);font-size:8.5px;color:var(--ink-ghost);letter-spacing:0.1em;text-transform:uppercase}
#meanings{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.98);width:min(360px,90vw);z-index:130;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:18px;opacity:0;pointer-events:none;transition:opacity 200ms var(--e),transform 200ms var(--e);box-shadow:0 30px 70px -24px rgba(0,0,0,0.85)}
#meanings.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#meanings .mh{font-family:var(--mono);font-size:9px;color:var(--ink-ghost);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:12px}
#meanings .mrow{display:flex;align-items:center;gap:9px;margin-bottom:8px}
#meanings .mrow .md{width:13px;height:13px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px var(--line)}
#meanings .mrow input{-webkit-user-select:text;user-select:text;flex:1;min-width:0;background:var(--void-2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-family:var(--sans);font-size:12.5px;padding:7px 10px;outline:none}
#meanings .mrow input:focus{border-color:var(--signal-line)}
#meanings .mdone{margin-top:8px;width:100%;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--signal);font-family:var(--sans);font-size:12.5px;padding:8px;cursor:pointer}

@media (max-width:600px){
  #inspect{display:none}
  #reading{max-width:38%;font-size:10px}
  .vbtn{padding:8px 9px;font-size:11.5px}
  #legend{top:50px;max-width:140px}
}
</style>
</head>
<body>
<div id="stage">
  <svg id="svg"></svg>
  <div id="layer"></div>
</div>

<div id="top">
  <div id="brand"><div class="name">atem</div><div class="board" id="board-name">—</div></div>
  <div id="reading"></div>
</div>
<button id="menu-btn" aria-label="menu"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>

<div id="inspect"><div class="ih">one thought · just slots</div><div id="slots"></div><div class="note"></div></div>

<div id="editor">
  <textarea id="ed-text" placeholder="Think…" autocomplete="off" autocorrect="on" spellcheck="true"></textarea>
  <div id="ed-colors"></div>
  <div id="ed-slots">
    <div class="eslabel">slots · invent your own dimension</div>
    <div class="chips" id="es-chips"></div>
    <div class="addrow"><input id="es-name" placeholder="slot name" autocomplete="off" autocorrect="off" spellcheck="false"><input id="es-val" placeholder="value" autocomplete="off"><button class="addbtn" id="es-add">+</button></div>
  </div>
  <div id="ed-act"><button class="del" id="ed-del">Delete</button><button id="ed-cancel">Cancel</button><button class="go" id="ed-done">Done</button></div>
</div>

<div id="hint" class="show"></div>

<div id="views"><div class="vbar" id="vbar"></div></div>
<div id="axispick">
  <span class="apx">x</span><select id="ax-x"></select>
  <span class="apx">y</span><select id="ax-y"></select>
</div>
<div id="legend"></div>
<div id="meanings">
  <div class="mh">name what your colours mean · this board</div>
  <div id="mean-rows"></div>
  <button class="mdone" id="mean-done">done</button>
</div>
<input type="file" id="file-atem" accept=".json,.atem" style="display:none">

<div id="scrim"></div>
<div id="drawer">
  <div class="dh"><div class="t">current board</div><div class="board" id="drawer-board" style="font-size:14px;font-weight:500;margin-top:4px;letter-spacing:-0.01em">—</div></div>
  <div class="seclabel">boards</div>
  <button class="item" id="m-gallery">Open a board<span class="meta">examples</span></button>
  <button class="item" id="m-new">New empty board</button>
  <div class="seclabel">this board</div>
  <button class="item" id="m-add">Add a thought<span class="meta">or double-tap</span></button>
  <button class="item" id="m-clear" class="danger">Clear board</button>
  <button class="item" id="m-meanings">Name the colours<span class="meta">grammar</span></button>
  <div class="seclabel">experiments</div>
  <div id="exp-list"></div>
  <div class="seclabel">data</div>
  <button class="item" id="m-export-atem">Export .atem<span class="meta">the standard</span></button>
  <button class="item" id="m-import-atem">Import .atem</button>
  <button class="item" id="m-export">Export JSON</button>
  <div class="ver">atem · v31 · the engine + the standard<br>atem™ · created by Sneh Thakkar</div>
</div>

<div id="gallery">
  <div class="gh"><div class="t">Boards</div><button class="x" id="g-close">close</button></div>
  <div class="grid" id="g-grid"></div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════
// atem · the slot engine (v30)
//
// FIRST LAW: the data layer never knows what a slot means.
// A thought is a bag of named slots holding values. There is no "position".
// Slots named a/b/c are not special — they sit beside text, color, created,
// confidence, urgency, parent, all equally meaningless to the engine.
// A VIEW is a pure function: read some slots, return screen coordinates.
// No view writes position back. Same data, many shapes of thought.
// ══════════════════════════════════════════════════════════════════════════

const DAY = 86400000;
const nowTs = () => Date.now();
const uid = () => 't_' + Math.random().toString(36).slice(2,9);
const W = () => window.innerWidth, H = () => window.innerHeight;
const cssv = v => v && v.startsWith('--') ? getComputedStyle(document.documentElement).getPropertyValue(v).trim() : v;
const daysAgo = ts => Math.max(0, Math.round((nowTs()-ts)/DAY));

// the colour vocabulary (signal-colours, each a meaning not a decoration)
const COLORS = ['--c-claim','--c-spark','--c-weight','--c-cool','--c-deep','--c-go','--c-mute'];

// ── VIEWS ─────────────────────────────────────────────────────────────────
// Each returns [{t, x, y, mode, scaleMul?, axes?}]. Pure. No writes.

function layoutSpatial(TH){
  const cx=W()/2, cy=H()/2, scale=Math.min(W(),H())/13, yaw=0.5, pitch=0.34;
  return TH.map(t=>{
    const a=t.slots['spatial.a']??0, b=t.slots['spatial.b']??0, c=t.slots['spatial.c']??0;
    const rx=a*Math.cos(yaw)-c*Math.sin(yaw), rz=a*Math.sin(yaw)+c*Math.cos(yaw);
    const ry=b*Math.cos(pitch)-rz*Math.sin(pitch), depth=b*Math.sin(pitch)+rz*Math.cos(pitch);
    const persp=1/(1+depth*0.045);
    return { t, x:cx+rx*scale*persp, y:cy-ry*scale*persp, depth, scaleMul:persp, mode:'free' };
  });
}
function layoutPriority(TH){
  const m=64, L=m+34, R=W()-m, T=m+58, B=H()-112;
  return TH.map(t=>{
    const cf=t.slots.confidence??0.5, ur=t.slots.urgency??0.5;
    return { t, x:L+cf*(R-L), y:B-ur*(B-T), mode:'free', axes:{L,R,T,B} };
  });
}
function layoutTimeline(TH){
  const m=58, L=m+48, R=W()-m, T=m+70, B=H()-118;
  const times=TH.map(t=>t.slots.created??nowTs());
  const min=Math.min(...times), max=Math.max(...times), span=(max-min)||1;
  const byId=id=>TH.find(t=>t.id===id);
  const rootOf=id=>{ let cur=id,g=0; let t=byId(cur); while(t&&t.slots.parent&&g++<20){cur=t.slots.parent;t=byId(cur);} return cur; };
  const roots=[...new Set(TH.map(t=>rootOf(t.id)))];
  const laneH=(B-T)/Math.max(roots.length,1);
  return TH.map(t=>{
    const lane=roots.indexOf(rootOf(t.id));
    return { t, x:L+(((t.slots.created??nowTs())-min)/span)*(R-L), y:T+lane*laneH+laneH/2, mode:'row', axes:{L,R,T,B} };
  });
}
function layoutOutline(TH){
  const m=70, x0=m+8, y0=m+56, rowH=Math.min(40,(H()-210)/Math.max(TH.length,1)+6);
  const kids=pid=>TH.filter(t=>(t.slots.parent??null)===pid);
  const order=[];
  (function walk(pid,depth){ for(const t of kids(pid)){ order.push({id:t.id,depth}); walk(t.id,depth+1);} })(null,0);
  // any orphans (parent set but missing, or cycles) appended at depth 0
  for(const t of TH){ if(!order.find(o=>o.id===t.id)) order.push({id:t.id,depth:0}); }
  const pos={}; order.forEach((o,i)=>pos[o.id]={x:x0+o.depth*26,y:y0+i*rowH,depth:o.depth});
  return TH.map(t=>{ const p=pos[t.id]; return { t, x:p.x, y:p.y, depth:p.depth, mode:'row' }; });
}

const VIEWS = {
  spatial:  { label:'Space',    keys:'a·b·c',        fn:layoutSpatial,  reads:['spatial.a','spatial.b','spatial.c'] },
  priority: { label:'Priority', keys:'conf·urgency', fn:layoutPriority, reads:['confidence','urgency'] },
  timeline: { label:'Timeline', keys:'created',      fn:layoutTimeline, reads:['created'] },
  outline:  { label:'Outline',  keys:'parent',       fn:layoutOutline,  reads:['parent'] },
  free:     { label:'Free',     keys:'pick·pick',    fn:layoutFree,     reads:[], dynamic:true },
};
const READING = {
  spatial:'<b>Space.</b> Slots <i>a·b·c</i> become x·y·z. Where you placed each thought by hand — yours, untouched by other views.',
  priority:'<b>Priority.</b> Same thoughts. Now x = <i>confidence</i>, y = <i>urgency</i>. Nothing moved in the data — a different pair of slots drives position.',
  timeline:'<b>Timeline.</b> The <i>created</i> slot becomes the x-axis. The cluster becomes a chronology.',
  outline:'<b>Outline.</b> Only the <i>parent</i> slot matters now. The graph collapses into hierarchy.',
};

// ── STATE ───────────────────────────────────────────────────────────────────

let prefs={ holdConnect:true, linkMode:false, depthCue:'fade', edges:'curve', motion:'full', newColor:'--c-claim' };

const layer=$('layer'), svg=$('svg');

// slot-bag constructor: keeps the demo readable. order: id,text,color,size, a,b,c, conf,urg, created, parent
function sl(id,text,color,size,a,b,c,conf,urg,created,parent){
  return { id, slots:{ text, color, size, 'spatial.a':a,'spatial.b':b,'spatial.c':c, confidence:conf, urgency:urg, created, parent } };
}

// ══ PERSISTENCE (IndexedDB, tiny) ══
let db=null;
function openDB(){ return new Promise(res=>{
  const r=indexedDB.open('atem-v30',1);
  r.onupgradeneeded=e=>{ const d=e.target.result; if(!d.objectStoreNames.contains('boards')) d.createObjectStore('boards'); };
  r.onsuccess=e=>{ db=e.target.result; res(db); };
  r.onerror=()=>res(null);
}); }
function idbPut(k,v){ try{ if(!db)return; const tx=db.transaction('boards','readwrite'); tx.objectStore('boards').put(JSON.parse(JSON.stringify(v)),k); }catch(e){} }
function idbGet(k){ return new Promise(res=>{ try{ if(!db)return res(null); const tx=db.transaction('boards','readonly'); const rq=tx.objectStore('boards').get(k); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null);}catch(e){res(null);} }); }
function save(){ if(!state.boardId) return; idbPut(state.boardId,{ boardName:state.boardName, thoughts:state.thoughts, edges:state.edges, aiEdges:state.aiEdges, view:state.view, accent:state.accent, freeX:state.freeX, freeY:state.freeY, meanings:state.meanings }); localStorage.setItem('atem-last',state.boardId); }

// ══ RENDER ══
function ensureNode(t){
  if(nodes[t.id]) return nodes[t.id];
  const el=document.createElement('div'); el.className='node'; el.dataset.id=t.id;
  const dot=document.createElement('div'); dot.className='dot';
  const lab=document.createElement('div'); lab.className='label';
  const sub=document.createElement('div'); sub.className='sub';
  el.append(dot,lab,sub);
  // interactions
  el.addEventListener('pointerdown',e=>onNodeDown(e,t.id));
  el.addEventListener('pointerenter',()=>{ if(!draggingNode){ hovered=t.id; showInspect(t); highlight(t.id); } });
  el.addEventListener('pointerleave',()=>{ if(!draggingNode){ hovered=null; hideInspect(); unhighlight(); } });
  layer.appendChild(el); nodes[t.id]=el; return el;
}
function removeStaleNodes(){
  const ids=new Set(state.thoughts.map(t=>t.id));
  for(const id in nodes){ if(!ids.has(id)){ nodes[id].remove(); delete nodes[id]; } }
}

function render(){
  removeStaleNodes();
  const V=VIEWS[state.view];
  const placed=V.fn(state.thoughts);
  placedById={}; placed.forEach(p=>placedById[p.t.id]=p); lastPlaced=placed;

  for(const p of placed){
    const t=p.t, el=ensureNode(t), s=t.slots;
    const sm=p.scaleMul||1;
    const sizeMul=(state.view==='spatial'&&prefs.depthCue==='fade')?1:sm;
    const d=14*(s.size||1)*sizeMul;
    el.style.left=p.x+'px'; el.style.top=p.y+'px';
    el.style.setProperty('--d',d.toFixed(1)+'px');
    el.style.setProperty('--c',cssv(s.color||'--c-claim'));
    el.querySelector('.label').textContent=s.text||'';
    el.classList.toggle('row',p.mode==='row');
    el.classList.toggle('sel',selected===t.id);
    const sub=el.querySelector('.sub');
    if(state.view==='timeline'){ sub.textContent=daysAgo(s.created)+'d ago'; sub.style.display='block'; }
    else if(state.view==='priority'){ sub.textContent='c'+Math.round((s.confidence||0)*100)+' u'+Math.round((s.urgency||0)*100); sub.style.display='block'; }
    else if(state.view==='free'){ const xv=num(s[state.freeX]),yv=num(s[state.freeY]); sub.textContent=short(state.freeX)+' '+(xv==null?'—':xv)+' · '+short(state.freeY)+' '+(yv==null?'—':yv); sub.style.display='block'; }
    else sub.style.display='none';
    if(state.view==='spatial'){ el.style.opacity=(prefs.depthCue==='scale')?1:Math.max(0.4,Math.min(1,0.5+sm*0.55)); el.style.zIndex=Math.round((p.scaleMul||0)*100); }
    else { el.style.opacity=1; el.style.zIndex=10; }
  }
  drawSVG(placed);
  $('reading').innerHTML = state.view==='free' ? `<b>Free.</b> x = <i>${short(state.freeX)}</i>, y = <i>${short(state.freeY)}</i>. Point an axis at any slot — even one you invented. The view is a slot.` : READING[state.view];
  refreshAxisPick();
  $('board-name').textContent=state.boardName||'untitled';
  $('drawer-board').textContent=state.boardName||'untitled';
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
  if(hovered&&state.thoughts.find(t=>t.id===hovered)) showInspect(state.thoughts.find(t=>t.id===hovered));
}

function edgePath(a,b){ if(!a||!b)return ''; if(prefs.edges==='straight') return `M ${a.x} ${a.y} L ${b.x} ${b.y}`; const mx=(a.x+b.x)/2,my=(a.y+b.y)/2; return `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`; }
function drawSVG(placed){
  const v=state.view; let axes='', edges='';
  // axes
  if(v==='priority'&&placed[0]?.axes){ const {L,R,T,B}=placed[0].axes;
    for(let i=0;i<=4;i++){ const gx=L+(R-L)*i/4; axes+=`<line class="grid-line" x1="${gx}" y1="${T}" x2="${gx}" y2="${B}"/><text class="tick-label" x="${gx}" y="${B+14}" text-anchor="middle">${i*25}</text>`; }
    axes+=`<line class="axis" x1="${L}" y1="${B}" x2="${R}" y2="${B}"/><line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${B}"/>`;
    axes+=`<text class="axis-label" x="${R-2}" y="${B+24}" text-anchor="end">confidence →</text><text class="axis-label" x="${L-6}" y="${T+2}" text-anchor="end" transform="rotate(-90 ${L-6} ${T+2})">urgency →</text>`;
  }
  if(v==='timeline'&&placed[0]?.axes){ const {L,R,T,B}=placed[0].axes;
    const times=state.thoughts.map(t=>t.slots.created??nowTs()); const min=Math.min(...times);
    for(let i=0;i<=4;i++){ const gx=L+(R-L)*i/4; axes+=`<line class="grid-line" x1="${gx}" y1="${T}" x2="${gx}" y2="${B}"/><text class="tick-label" x="${gx}" y="${B+16}" text-anchor="middle">${Math.round(daysAgo(min)*(1-i/4))}d</text>`; }
    axes+=`<line class="axis" x1="${L}" y1="${B}" x2="${R}" y2="${B}"/><text class="axis-label" x="${R-2}" y="${T-8}" text-anchor="end">time →</text>`;
  }
  if(v==='free'&&placed[0]?.axes){ const {L,R,T,B}=placed[0].axes;
    axes+=`<line class="axis" x1="${L}" y1="${B}" x2="${R}" y2="${B}"/><line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${B}"/>`;
    axes+=`<text class="axis-label" x="${R-2}" y="${B+22}" text-anchor="end">${short(state.freeX)} →</text><text class="axis-label" x="${L-6}" y="${T+2}" text-anchor="end" transform="rotate(-90 ${L-6} ${T+2})">${short(state.freeY)} →</text>`;
  }
  // edges: parent links in spatial/outline/timeline; relations + ai in spatial/priority
  const showStruct = v==='outline'||v==='timeline'||v==='spatial';
  const showRel = v==='spatial'||v==='priority'||v==='free';
  if(showStruct){ for(const t of state.thoughts){ const pid=t.slots.parent; if(pid&&placedById[t.id]&&placedById[pid]){ const hl=(hovered===t.id||hovered===pid)?' hl':''; edges+=`<path class="edge${hl}" d="${edgePath(placedById[pid],placedById[t.id])}"/>`; } } }
  if(showRel){ for(const [f,to] of state.edges){ if(placedById[f]&&placedById[to]){ const hl=(hovered===f||hovered===to)?' hl':''; edges+=`<path class="edge${hl}" d="${edgePath(placedById[f],placedById[to])}"/>`; } }
    for(const [f,to] of (state.aiEdges||[])){ if(placedById[f]&&placedById[to]) edges+=`<path class="edge ai" d="${edgePath(placedById[f],placedById[to])}"/>`; } }
  svg.innerHTML=axes+edges;
}

// ── inspector ──
function showInspect(t){
  const box=$('inspect'), wrap=$('slots'); const reads=viewReads();
  const keys=['text',...reads,...Object.keys(t.slots).filter(k=>k!=='text'&&!reads.includes(k))];
  let h='';
  for(const k of keys){
    let v=t.slots[k];
    if(k==='created') v=daysAgo(v)+'d ago';
    else if(k==='parent') v=v||'—';
    else if(k==='color'){ const nm=state.meanings&&state.meanings[v]; v=String(v).replace('--c-','').replace('--','')+(nm?' · '+nm:''); }
    else if(typeof v==='number') v=Number.isInteger(v)?v:v.toFixed(2);
    else if(typeof v==='string'&&v.length>15) v=v.slice(0,14)+'…';
    const r=reads.includes(k);
    h+=`<div class="slot"><span class="sk">${r?'<span class=read-pip></span>':''}${k}</span><span class="sv ${r?'read':''}">${v}</span></div>`;
  }
  wrap.innerHTML=h;
  box.querySelector('.note').textContent='Phosphor slots are what this view reads as position. Everything else: same, untouched.';
  box.classList.add('show');
}
function hideInspect(){ if(!selected) $('inspect').classList.remove('show'); }
function highlight(id){
  const fam=new Set([id]); const byId=i=>state.thoughts.find(t=>t.id===i);
  for(const t of state.thoughts) if(t.slots.parent===id) fam.add(t.id);
  const me=byId(id); if(me&&me.slots.parent) fam.add(me.slots.parent);
  for(const [f,to] of [...state.edges,...(state.aiEdges||[])]){ if(f===id)fam.add(to); if(to===id)fam.add(f); }
  for(const t of state.thoughts) nodes[t.id]?.classList.toggle('dim',!fam.has(t.id));
  render();
}
function unhighlight(){ for(const t of state.thoughts) nodes[t.id]?.classList.remove('dim'); render(); }

// ── drag (spatial only writes spatial.* ; other views: drag picks for edit) ──
let dragStart={x:0,y:0}, dragOrig={x:0,y:0};
function onNodeDown(e,id){
  e.stopPropagation();
  draggingNode=id; dragMoved=false; connecting=null;
  const el=nodes[id]; dragStart={x:e.clientX,y:e.clientY};
  dragOrig={x:parseFloat(el.style.left),y:parseFloat(el.style.top)};
  el.setPointerCapture?.(e.pointerId);
  if(prefs.holdConnect && !prefs.linkMode){ holdTimer=setTimeout(()=>{ if(draggingNode===id && !dragMoved){ connecting={from:id}; nodes[id]&&nodes[id].classList.add('connect-src'); $('stage').style.cursor='crosshair'; toast('drag to another thought'); } }, 360); }
  window.addEventListener('pointermove',onNodeMove);
  window.addEventListener('pointerup',onNodeUp);
}
function onNodeMove(e){
  if(!draggingNode) return;
  const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
  if(Math.abs(dx)+Math.abs(dy)>4){ dragMoved=true; if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } }
  if(connecting){
    const srcp=placedById[connecting.from];
    if(srcp){ drawSVG(lastPlaced); svg.innerHTML += `<path class="edge live" d="M ${srcp.x} ${srcp.y} L ${e.clientX} ${e.clientY}"/>`; }
    return;
  }
  if(!dragMoved) return;
  const el=nodes[draggingNode];
  const nx=dragOrig.x+dx, ny=dragOrig.y+dy;
  el.style.transition='none'; el.style.left=nx+'px'; el.style.top=ny+'px';
  if(state.view==='spatial'){
    const t=state.thoughts.find(t=>t.id===draggingNode);
    const cx=W()/2, cy=H()/2, scale=Math.min(W(),H())/13;
    const persp=1; const rx=(nx-cx)/(scale*persp), ry=-(ny-cy)/(scale*persp);
    const yaw=0.5;
    t.slots['spatial.a']=+(rx*Math.cos(yaw)).toFixed(2);
    t.slots['spatial.b']=+(ry).toFixed(2);
    t.slots['spatial.c']=+(-rx*Math.sin(yaw)).toFixed(2);
    drawSVG(VIEWS.spatial.fn(state.thoughts));
  }
}
function onNodeUp(e){
  window.removeEventListener('pointermove',onNodeMove);
  window.removeEventListener('pointerup',onNodeUp);
  if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
  const id=draggingNode; draggingNode=null;
  const el=nodes[id]; if(el) el.style.transition='';
  if(connecting){
    const from=connecting.from; connecting=null; $('stage').style.cursor='';
    nodes[from]&&nodes[from].classList.remove('connect-src');
    const tgt=nodeUnder(e.clientX,e.clientY);
    if(tgt && tgt!==from) addEdge(from,tgt); else render();
    return;
  }
  if(prefs.linkMode && !dragMoved){
    if(!linkPending){ linkPending=id; nodes[id]&&nodes[id].classList.add('connect-src'); toast('link · tap another'); }
    else if(linkPending!==id){ const a=linkPending; nodes[a]&&nodes[a].classList.remove('connect-src'); linkPending=null; addEdge(a,id); }
    else { nodes[id]&&nodes[id].classList.remove('connect-src'); linkPending=null; }
    return;
  }
  if(!dragMoved){ openEditor(id); }
  else { save(); render(); }
}

// ── editor ──
let editId=null, editColor='--c-claim';
function openEditor(id){
  editId=id;
  const t=id?state.thoughts.find(t=>t.id===id):null;
  editColor = t?(t.slots.color||'--c-claim'):(prefs.newColor||'--c-claim');
  $('ed-text').value = t?(t.slots.text||''):'';
  $('ed-del').style.display = id?'block':'none';
  editorSlots = t?customSlotsOf(t):{};
  buildSwatches(); renderEdSlots();
  $('editor').classList.add('show');
  selected=id; render();
  setTimeout(()=>$('ed-text').focus(),60);
}
function buildSwatches(){
  const wrap=$('ed-colors'); wrap.innerHTML='';
  for(const c of COLORS){ const b=document.createElement('button'); b.className='swatch'+(c===editColor?' on':''); b.style.background=cssv(c);
    b.title=(state.meanings&&state.meanings[c])||c.replace('--c-','');
    b.onclick=()=>{ editColor=c; buildSwatches(); }; wrap.appendChild(b); }
}
function closeEditor(commit){
  if(commit){
    const text=$('ed-text').value.trim();
    if(editId){
      const t=state.thoughts.find(t=>t.id===editId);
      if(!text){ state.thoughts=state.thoughts.filter(x=>x.id!==editId); }
      else {
        t.slots.text=text; t.slots.color=editColor; t.slots.touched=nowTs();
        for(const k in t.slots){ if(!CORE.has(k)) delete t.slots[k]; }
        for(const k in editorSlots){ const nn=num(editorSlots[k]); t.slots[k]=(nn!=null)?nn:editorSlots[k]; }
      }
    } else if(text){
      const nid=uid(); const slots={ text:text, color:editColor, size:1.0, created:nowTs(),
        'spatial.a':(Math.random()-0.5)*3,'spatial.b':(Math.random()-0.5)*3,'spatial.c':(Math.random()-0.5)*2,
        confidence:0.6, urgency:0.5, parent:null };
      for(const k in editorSlots){ const nn=num(editorSlots[k]); slots[k]=(nn!=null)?nn:editorSlots[k]; }
      state.thoughts.push({ id:nid, slots:slots });
    }
    save();
  }
  editId=null; selected=null; editorSlots={};
  $('editor').classList.remove('show');
  render();
}
$('ed-done').onclick=()=>closeEditor(true);
$('ed-cancel').onclick=()=>closeEditor(false);
$('ed-del').onclick=()=>{ if(editId){ state.thoughts=state.thoughts.filter(x=>x.id!==editId); save(); } editId=null; selected=null; $('editor').classList.remove('show'); render(); };
$('ed-text').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); closeEditor(true);} if(e.key==='Escape'){ e.preventDefault(); closeEditor(false);} });

// double-tap / double-click empty → new thought
let lastTap=0;
$('stage').addEventListener('pointerdown',e=>{
  if(e.target.closest('.node')||e.target.closest('#editor')) return;
  const t=Date.now();
  if(t-lastTap<320){ openEditor(null); lastTap=0; }
  else lastTap=t;
});

// ── views wiring ──
function buildVbar(){
  const bar=$('vbar'); bar.innerHTML='';
  for(const k in VIEWS){ const v=VIEWS[k]; const b=document.createElement('button'); b.className='vbtn'+(k===state.view?' active':''); b.dataset.view=k;
    b.innerHTML=`${v.label}<span class="k">${v.keys}</span>`;
    b.onclick=()=>{ state.view=k; $('hint').classList.remove('show'); save(); render(); }; bar.appendChild(b); }
}

// ── boards ──
function loadBoardData(data, id, name, accent){
  state.boardId=id; state.boardName=name; state.thoughts=data.thoughts||[]; state.edges=data.edges||[];
  state.aiEdges=data.aiEdges||[]; state.view=data.view||'spatial'; state.accent=accent||data.accent||'--signal';
  state.freeX=data.freeX||'confidence'; state.freeY=data.freeY||'urgency'; state.meanings=data.meanings||{};
  document.documentElement.style.setProperty('--accent', cssv(state.accent));
  for(const id in nodes){ nodes[id].remove(); delete nodes[id]; }
  selected=null; hovered=null; linkPending=null;
  buildVbar(); render(); renderLegend(); save();
}
async function openSample(b){
  // if a saved version exists, prefer it (user's edits persist)
  const saved=await idbGet(b.id);
  if(saved&&saved.thoughts&&saved.thoughts.length){ loadBoardData(saved,b.id,saved.boardName||b.name,b.accent); }
  else { loadBoardData({thoughts:b.thoughts,edges:b.edges,aiEdges:b.aiEdges,view:'spatial'}, b.id, b.name, b.accent); }
  closeDrawer(); $('gallery').classList.remove('show');
  if(b.reading){ toast(b.name+' · loaded'); }
}
function newBoard(){
  const id='b_'+Math.random().toString(36).slice(2,8);
  loadBoardData({thoughts:[],edges:[],view:'spatial'}, id, 'untitled', '--signal');
  closeDrawer();
  $('hint').innerHTML='<b>Empty board.</b><br>Double-tap anywhere to add your first thought.'; $('hint').classList.add('show');
  setTimeout(()=>$('hint').classList.remove('show'),4200);
}

// ── gallery ──
function buildGallery(){
  const grid=$('g-grid'); grid.innerHTML='';
  for(const b of SAMPLES){ const card=document.createElement('div'); card.className='gcard'; card.style.setProperty('--ac',cssv(b.accent));
    card.innerHTML=`<div class="gn">${b.name}</div><div class="gd">${b.desc}</div><div class="gm"><span class="gdot"></span><span class="gx">${b.thoughts.length} thoughts · slot-bags</span></div>`;
    card.onclick=()=>openSample(b); grid.appendChild(card); }
}

// ── menu / drawer ──
function openDrawer(){ $('drawer').classList.add('show'); $('scrim').classList.add('show'); }
function closeDrawer(){ $('drawer').classList.remove('show'); $('scrim').classList.remove('show'); }
$('menu-btn').onclick=openDrawer;
$('brand').onclick=()=>{ buildGallery(); $('gallery').classList.add('show'); };
$('scrim').onclick=closeDrawer;
$('m-gallery').onclick=()=>{ closeDrawer(); buildGallery(); $('gallery').classList.add('show'); };
$('g-close').onclick=()=>$('gallery').classList.remove('show');
$('m-new').onclick=newBoard;
$('m-add').onclick=()=>{ closeDrawer(); openEditor(null); };
$('m-clear').onclick=()=>{ if(confirm('Clear every thought on this board?')){ state.thoughts=[]; state.edges=[]; state.aiEdges=[]; save(); render(); } closeDrawer(); };
$('m-export').onclick=()=>{ const blob=new Blob([JSON.stringify({boardName:state.boardName,thoughts:state.thoughts,edges:state.edges},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(state.boardName||'atem')+'.json'; a.click(); closeDrawer(); toast('exported'); };
$('m-export-atem').onclick=()=>{ exportAtem(); closeDrawer(); };
$('m-import-atem').onclick=()=>{ $('file-atem').click(); };
$('file-atem').onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ importAtem(String(r.result)); closeDrawer(); }; r.readAsText(f); e.target.value=''; };
$('m-meanings').onclick=()=>{ closeDrawer(); openMeanings(); };
$('mean-done').onclick=closeMeanings;
$('es-add').onclick=()=>{ const n=$('es-name').value.trim(); if(!n)return; const raw=$('es-val').value.trim(); const nn=num(raw); editorSlots[n]=(raw===''?0:(nn!=null?nn:raw)); $('es-name').value=''; $('es-val').value=''; renderEdSlots(); $('es-name').focus(); };
$('es-val').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('es-add').click(); } });
$('ax-x').onchange=e=>{ state.freeX=e.target.value; save(); render(); };
$('ax-y').onchange=e=>{ state.freeY=e.target.value; save(); render(); };

let toastT=null;
function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1800); }

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('gallery').classList.contains('show'))$('gallery').classList.remove('show'); else if($('drawer').classList.contains('show'))closeDrawer(); }
  if(/^[1-5]$/.test(e.key) && !$('editor').classList.contains('show')){ const ks=Object.keys(VIEWS); if(ks[+e.key-1]){ state.view=ks[+e.key-1]; $('hint').classList.remove('show'); save(); render(); } }
});
window.addEventListener('resize',render);

// ── the FREE view: point an axis at any slot — this is "the view is a slot" ──
function num(v){ const n=typeof v==='number'?v:parseFloat(v); return Number.isFinite(n)?n:null; }
function norm(arr){ const f=arr.filter(v=>v!=null); if(!f.length) return arr.map(()=>0.5); const mn=Math.min(...f),mx=Math.max(...f),sp=(mx-mn)||1; return arr.map(v=>v==null?0.5:(v-mn)/sp); }
function layoutFree(TH){
  const m=64, L=m+44, R=W()-m, T=m+64, B=H()-118;
  const xv=TH.map(t=>num(t.slots[state.freeX])), yv=TH.map(t=>num(t.slots[state.freeY]));
  const nx=norm(xv), ny=norm(yv);
  return TH.map((t,i)=>({ t, x:L+nx[i]*(R-L), y:B-ny[i]*(B-T), mode:'free', axes:{L:L,R:R,T:T,B:B} }));
}
function viewReads(){ return state.view==='free' ? [state.freeX,state.freeY] : (VIEWS[state.view]?VIEWS[state.view].reads:[]); }
function viewReadsObj(){ const r=viewReads(); const o={}; if(state.view==='spatial'){o.x='spatial.a';o.y='spatial.b';o.z='spatial.c';} else { if(r[0])o.x=r[0]; if(r[1])o.y=r[1]; } return o; }
function short(k){ return String(k).replace('spatial.','').replace('confidence','conf').replace('urgency','urg').replace('created','time').slice(0,8); }
function numericKeys(){ const s=new Set(); for(const t of state.thoughts) for(const k in t.slots){ if(num(t.slots[k])!=null) s.add(k); } return [...s]; }
function refreshAxisPick(){
  const xs=$('ax-x'), ys=$('ax-y'); if(!xs||!ys) return;
  let keys=numericKeys(); if(!keys.length) keys=['confidence','urgency'];
  if(!keys.includes(state.freeX)) state.freeX=keys[0];
  if(!keys.includes(state.freeY)) state.freeY=keys[1]||keys[0];
  const opt=(sel)=>keys.map(k=>`<option value="${k}"${k===sel?' selected':''}>${short(k)}</option>`).join('');
  xs.innerHTML=opt(state.freeX); ys.innerHTML=opt(state.freeY);
  $('axispick').classList.toggle('show', state.view==='free');
  const fb=document.querySelector('.vbtn[data-view="free"] .k'); if(fb) fb.textContent=short(state.freeX)+'·'+short(state.freeY);
}

// ── .atem — speak the standard; every export carries provenance ──
function download(text,name,type){ try{ const blob=new Blob([text],{type:type||'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);}catch(e){} }
function exportAtem(){
  const ents=[];
  ents.push({ id:'space.'+(state.boardId||'b'), kind:'space', slots:{ label:state.boardName||'untitled', view:state.view } });
  for(const t of state.thoughts) ents.push({ id:t.id, kind:'thought', slots:Object.assign({},t.slots) });
  for(const e of state.edges){ const f=e[0],to=e[1],label=e[2]||'',dir=e[3]; ents.push({ id:'c_'+f+'_'+to, kind:'connection', from:f, to:to, slots:{ label:label, direction:dir?'forward':'none' } }); }
  ents.push({ id:'view.'+state.view, kind:'view', slots:{ label:state.view }, reads:viewReadsObj() });
  const doc={ atem:{ version:'0.1', author:'Sneh Thakkar', created:new Date().toISOString(), id:state.boardId||null, signature:'atem — created by Sneh Thakkar', mark:'atem™' }, entities:ents };
  download(JSON.stringify(doc,null,2), String(state.boardName||'atem').replace(/\s+/g,'-')+'.atem.json','application/json');
  toast('.atem exported · signed');
}
function importAtem(text){
  try{
    const doc=JSON.parse(text); const ents=doc.entities||[];
    const thoughts=ents.filter(e=>e.kind==='thought').map(e=>({ id:e.id||uid(), slots:Object.assign({},e.slots||{}) }));
    const edges=ents.filter(e=>e.kind==='connection').map(e=>[e.from,e.to,(e.slots&&e.slots.label)||'', !!(e.slots&&e.slots.direction&&e.slots.direction!=='none')]).filter(e=>e[0]&&e[1]);
    const space=ents.find(e=>e.kind==='space');
    const name=(space&&space.slots&&space.slots.label)||(doc.atem&&doc.atem.id)||'imported';
    if(!thoughts.length){ toast('no thoughts in file'); return; }
    const id='b_'+Math.random().toString(36).slice(2,8);
    loadBoardData({thoughts:thoughts,edges:edges,view:'spatial'}, id, name, '--signal');
    toast('imported · '+thoughts.length+' thoughts');
  }catch(err){ toast('could not read .atem'); }
}

// ── board meanings (name what a colour means — your grammar, this board) ──
function renderLegend(){
  const wrap=$('legend'); if(!wrap) return; let h='';
  for(const c in (state.meanings||{})){ const m=state.meanings[c]; if(m&&String(m).trim()) h+=`<div class="lg" data-c="${c}"><span class="ld" style="background:${cssv(c)}"></span>${m}</div>`; }
  wrap.innerHTML=h;
  wrap.querySelectorAll('.lg').forEach(el=>{ el.onclick=openMeanings; });
}
function openMeanings(){
  const rows=$('mean-rows'); rows.innerHTML='';
  for(const c of COLORS){ const v=(state.meanings&&state.meanings[c])||''; const row=document.createElement('div'); row.className='mrow';
    const sv=String(v).replace(/"/g,'&quot;');
    row.innerHTML=`<span class="md" style="background:${cssv(c)}"></span><input data-c="${c}" value="${sv}" placeholder="${c.replace('--c-','')} means…">`;
    rows.appendChild(row); }
  $('meanings').classList.add('show');
}
function closeMeanings(){
  $('meanings').querySelectorAll('input').forEach(inp=>{ const c=inp.dataset.c, v=inp.value.trim(); if(!state.meanings)state.meanings={}; if(v) state.meanings[c]=v; else delete state.meanings[c]; });
  $('meanings').classList.remove('show'); save(); renderLegend(); const hv=state.thoughts.find(t=>t.id===hovered); if(hv) showInspect(hv);
}

// ── experiment toggles — a fork becomes a switch, never a rewrite ──
const EXPERIMENTS=[
  { key:'holdConnect', label:'Hold to link',      opts:[['true','on'],['false','off']] },
  { key:'linkMode',    label:'Tap-two link mode', opts:[['false','off'],['true','on']] },
  { key:'depthCue',    label:'Depth in Space',    opts:[['fade','fade'],['scale','scale'],['both','both']] },
  { key:'edges',       label:'Connections',       opts:[['curve','curve'],['straight','straight']] },
  { key:'motion',      label:'Motion',            opts:[['full','full'],['reduced','reduced']] },
];
function buildExperiments(){
  const wrap=$('exp-list'); if(!wrap) return; wrap.innerHTML='';
  for(const x of EXPERIMENTS){ const b=document.createElement('button'); b.className='item';
    const cur=String(prefs[x.key]); const found=x.opts.find(o=>o[0]===cur); const lbl=found?found[1]:cur;
    b.innerHTML=`${x.label}<span class="meta">${lbl}</span>`;
    b.onclick=()=>{ const vals=x.opts.map(o=>o[0]); let i=vals.indexOf(cur); i=(i+1)%vals.length; const nv=vals[i]; prefs[x.key]=(nv==='true')?true:((nv==='false')?false:nv); if(x.key==='linkMode'){ linkPending=null; } savePrefs(); applyPrefs(); buildExperiments(); render(); };
    wrap.appendChild(b); }
}
function loadPrefs(){ try{ const p=JSON.parse(localStorage.getItem('atem-prefs')||'{}'); prefs=Object.assign(prefs,p); }catch(e){} }
function savePrefs(){ try{ localStorage.setItem('atem-prefs',JSON.stringify(prefs)); }catch(e){} }
function applyPrefs(){ document.documentElement.style.setProperty('--t', prefs.motion==='reduced'?'1ms':'420ms'); }

// ── connect helpers (hold-to-link / tap-two) ──
function nodeUnder(x,y){ const el=document.elementFromPoint(x,y); const n=el&&el.closest?el.closest('.node'):null; return n?n.dataset.id:null; }
function addEdge(from,to){
  if(!from||!to||from===to) return;
  const i=state.edges.findIndex(e=>(e[0]===from&&e[1]===to)||(e[0]===to&&e[1]===from));
  if(i>=0){ state.edges.splice(i,1); toast('unlinked'); } else { state.edges.push([from,to,'',false]); toast('linked'); }
  save(); render();
}

// ── add-slot editor: invent a dimension, then point a view at it ──
const CORE=new Set(['text','color','size','spatial.a','spatial.b','spatial.c','confidence','urgency','created','parent','touched']);
function customSlotsOf(t){ const o={}; if(t&&t.slots) for(const k in t.slots){ if(!CORE.has(k)) o[k]=t.slots[k]; } return o; }
function renderEdSlots(){
  const wrap=$('es-chips'); if(!wrap) return; let h='';
  for(const k in editorSlots){ h+=`<span class="chip"><b>${k}</b> ${editorSlots[k]}<span class="rm" data-k="${k}">×</span></span>`; }
  wrap.innerHTML=h;
  wrap.querySelectorAll('.rm').forEach(el=>{ el.onclick=()=>{ delete editorSlots[el.dataset.k]; renderEdSlots(); }; });
}

// ══ BOOT ══
let SAMPLES=[];
(async function boot(){
  await openDB();
  loadPrefs(); applyPrefs(); buildExperiments();
  SAMPLES=sampleBoards();
  const lastId=localStorage.getItem('atem-last');
  let booted=false;
  if(lastId){ const saved=await idbGet(lastId);
    if(saved&&saved.thoughts){ const s=SAMPLES.find(b=>b.id===lastId);
      loadBoardData(saved,lastId,saved.boardName||(s?s.name:'untitled'), s?s.accent:'--signal'); booted=true; } }
  if(!booted){ const diary=SAMPLES.find(b=>b.id==='diary'); loadBoardData({thoughts:diary.thoughts,edges:diary.edges,view:'spatial'},diary.id,diary.name,diary.accent); }
  $('hint').innerHTML='<b>New tonight:</b> a <b>Free</b> view that reads any slot · <b>hold</b> a thought to link it · <b>+ slot</b> in the editor to invent a dimension · <b>Export .atem</b> in the menu.<br>Drag to place · double-tap to add · tap to edit · 1–5 switch views.';
  $('hint').classList.add('show');
  setTimeout(()=>$('hint').classList.remove('show'),9000);
  console.log('atem v30 — the slot engine, usable. Thoughts are slot-bags; a/b/c are not special; views read slots as coordinates and never write position back. Diary board ready. First law: the data layer never knows what a slot means.');
})();
</script>
